<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Goal Line — prototype</title>
<style>
  :root {
    --gold: #e8c561;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #08090b; color: #e9e9ec;
    font-family: var(--mono);
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  #wrap {
    height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
  }
  #stage { position: relative; }
  canvas {
    image-rendering: pixelated;          /* the whole trick: low-res, integer-scaled */
    image-rendering: crisp-edges;
    touch-action: none;                  /* we own every gesture on the field */
    background: #08090b;
    border: 1px solid rgba(255,255,255,0.08);
    display: block;
  }
  /* Type lives in the DOM, not the canvas, so it renders at full device
     resolution instead of being scaled up with the pixel art. */
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 9px;
    pointer-events: none; text-align: center; padding: 0 18px;
    opacity: 0; transition: opacity 0.28s ease;
    /* soft scrim so type stays legible when it lands over sprites */
    background: radial-gradient(ellipse 70% 32% at 50% 50%,
      rgba(8,9,11,0.88) 0%, rgba(8,9,11,0.72) 45%, rgba(8,9,11,0) 100%);
  }
  #overlay.show { opacity: 1; }
  #ttl {
    font-size: 19px; font-weight: 600; letter-spacing: 0.2em;
    text-transform: uppercase; color: #fbfbfd;
  }
  #ttl.gold { color: var(--gold); }
  #sub {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a8c92;
  }
  #tap {
    font-size: 8.5px; letter-spacing: 0.24em; text-transform: uppercase; color: #4a4c52;
    margin-top: 6px;
  }
  /* Drive state sits above the field, never on it. */
  #status {
    display: flex; gap: 16px; align-items: baseline;
    font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #6d6f76;
  }
  #status b { color: #c9c9cf; font-weight: 600; }
  #status .sc { color: var(--gold); font-weight: 600; }
  #hint { font-size: 9px; letter-spacing: 0.16em; color: #46484e; text-transform: uppercase; }
  #build { font-size: 9px; letter-spacing: 0.16em; color: #2e3035; text-transform: uppercase; }
</style>
</head>
<body>
<div id="wrap">
  <div id="status"></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay">
      <div id="ttl"></div>
      <div id="sub"></div>
      <div id="tap"></div>
    </div>
  </div>
  <div id="hint">swipe ← → to cut · tap to spin</div>
  <div id="build"></div>
</div>
<script>
// ---------------------------------------------------------------------------
// GOAL LINE — playable prototype
// Canvas 2D at a fixed low resolution, integer-scaled up. No engine, no assets:
// sprites are string arrays, so the whole game is a few KB of code.
// Four downs to score; a touchdown earns a fresh, faster drive.
// ---------------------------------------------------------------------------

const BUILD = 'g4-downs32';
const VW = 180, VH = 260;              // logical (pixel-art) viewport
const YARD = 16;                       // logical px per yard
const DRIVE_YARDS = 25;                // distance to the end zone each drive
const WORLD_H = DRIVE_YARDS * YARD;
const ENDZONE_Y = 0;

// ---- palette -------------------------------------------------------------
const PAL = {
  '.': null,
  W: '#ffffff',   // ball carrier
  L: '#c9c9cf',   // carrier shading (light)
  M: '#8f9199',   // carrier shading (mid)
  G: '#6d6f76',   // defenders
  D: '#26282d',   // outline
  O: '#e8c561',   // the football
};

// ---- sprites: 32x32 ------------------------------------------------------
const SPR = 32;
const HALF = SPR / 2;

// Back view: helmet with a stripe, flared pads with shading, jersey number.
const BODY = [
  '................................',
  '................................',
  '..........DDDDDDDDDDDD..........',
  '.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........',
  '.........DWWWMMMMMMWWWD.........',
  '.........DWWWMMMMMMWWWD.........',
  '.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........',
  '.........DDWWWWWWWWWWDD.........',
  '...........DLLLLLLLLD...........',
  '......DDDWWWWWWWWWWWWWWDDD......',
  '...DDDWWWWWWWWWWWWWWWWWWWWDDD...',
  '...DWWWWWWWWWWWWWWWWWWWWWWWWD...',
  '...DWWWWWWWWWWWWWWWWWWWWWWWWD...',
  '....DWWWWWWWWWWWWWWWWWWWWWWD....',
  '....DMWWWWWWWWWWWWWWWWWWWWMD....',
  '.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '......DWWWWWWWWWWWWWWWWWWD......',
  '......DWWWWWWWWWWWWWWWWWWD......',
  '.......DWWWWWWWWWWWWWWWWD.......',
  '........DWWWWWWWWWWWWWWD........',
];
const LEGS = [
  [
    '.......DLLLLD......DLLLLD.......',
    '.......DLLLLD......DLLLLD.......',
    '......DLLLLD........DLLLLD......',
    '......DLLLD..........DLLLD......',
    '.....DLLLD............DLLLD.....',
    '.....DDDDD............DDDDD.....',
  ],
  [
    '..........DLLLLDDLLLLD..........',
    '..........DLLLLDDLLLLD..........',
    '..........DLLLLDDLLLLD..........',
    '..........DLLLDDDLLLD...........',
    '..........DLLDDDDDLLD...........',
    '..........DDDDDDDDDDD...........',
  ],
  [
    '.......DLLLLD......DLLLLD.......',
    '......DLLLLD........DLLLLD......',
    '......DLLLLD........DLLLLD......',
    '.....DLLLD............DLLLD.....',
    '....DLLLD..............DLLLD....',
    '....DDDDD..............DDDDD....',
  ],
];
const RUN_FRAMES = LEGS.map((legs) => [...BODY, ...legs]);

// Spin: the body rotates back → side → front → side, feet planted as a pivot.
const BODY_SIDE = [
  '................................',
  '................................',
  '...........DDDDDDDDDD...........',
  '..........DWWWWWWWWWWD..........',
  '..........DWWWWWWWWWWD..........',
  '..........DWWWMMMMWWWD..........',
  '..........DWWWMMMMWWWD..........',
  '..........DWWWWWWWWWWD..........',
  '..........DWWWWWWWWWWD..........',
  '..........DDWWWWWWWWDD..........',
  '............DLLLLLLD............',
  '........DDDWWWWWWWWWWDDD........',
  '.......DWWWWWWWWWWWWWWWWD.......',
  '.......DWWWWWWWWWWWWWWWWD.......',
  '.......DWWWWWWWWWWWWWWWWD.......',
  '........DWWWWWWWWWWWWWWD........',
  '........DMWWWWWWWWWWWWMD........',
  '........DWWWWWWWWWWWWWWD........',
  '........DWWWWWMMMMWWWWWD........',
  '........DWWWWWMMMMWWWWWD........',
  '........DWWWWWMMMMWWWWWD........',
  '........DWWWWWWWWWWWWWWD........',
  '.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........',
  '..........DWWWWWWWWWWD..........',
  '..........DWWWWWWWWWWD..........',
];
const BODY_FRONT = [
  '................................',
  '................................',
  '..........DDDDDDDDDDDD..........',
  '.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........',
  '.........DWWDDDDDDDDWWD.........',
  '.........DWWDDDDDDDDWWD.........',
  '.........DWWDDDDDDDDWWD.........',
  '.........DWWWWWWWWWWWWD.........',
  '.........DDWWWWWWWWWWDD.........',
  '...........DLLLLLLLLD...........',
  '......DDDWWWWWWWWWWWWWWDDD......',
  '...DDDWWWWWWWWWWWWWWWWWWWWDDD...',
  '...DWWWWWWWWWWWWWWWWWWWWWWWWD...',
  '...DWWWWWWWWWWWWWWWWWWWWWWWWD...',
  '....DWWWWWWWWWWWWWWWWWWWWWWD....',
  '....DMWWWWWWWWWWWWWWWWWWWWMD....',
  '.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '......DWWWWWWWWWWWWWWWWWWD......',
  '......DWWWWWWWWWWWWWWWWWWD......',
  '.......DWWWWWWWWWWWWWWWWD.......',
  '........DWWWWWWWWWWWWWWD........',
];
const PIVOT = LEGS[1];
const SPIN_FRAMES = [
  [...BODY, ...PIVOT],
  [...BODY_SIDE, ...PIVOT],
  [...BODY_FRONT, ...PIVOT],
  [...BODY_SIDE, ...PIVOT],
];
const SPIN_BALL_DX = [0, -9, -17, -7];

const toDefender = (rows) => rows.map((r) => r.replace(/[WLM]/g, 'G'));
const DEF_FRAMES = RUN_FRAMES.map(toDefender);

// Ball tucked under the right arm — the only gold on the field.
const BALL = [
  [18, 27], [18, 28],
  [19, 26], [19, 27], [19, 28], [19, 29],
  [20, 26], [20, 27], [20, 28], [20, 29],
  [21, 27], [21, 28],
];

// ---- deterministic RNG so the whole league faces the same defense --------
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- canvas --------------------------------------------------------------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function fit() {
  const maxW = Math.min(window.innerWidth - 24, 420);
  const maxH = window.innerHeight - 150;
  const scale = Math.max(1, Math.floor(Math.min(maxW / VW, maxH / VH)));
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW * scale + 'px';
  canvas.style.height = VH * scale + 'px';
}
window.addEventListener('resize', fit);
fit();
ctx.imageSmoothingEnabled = false;

function drawSprite(rows, px, py, ballTint, ballDx) {
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const c = PAL[row[x]];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(px + x, py + y, 1, 1);
    }
  }
  if (ballTint) {
    ctx.fillStyle = PAL.O;
    for (const [y, x] of BALL) ctx.fillRect(px + x + (ballDx || 0), py + y, 1, 1);
  }
}

// ---- game ----------------------------------------------------------------
const SEED = new URLSearchParams(location.search).get('seed') || 'WK15';
const SPIN_LEN = 30, SPIN_CD = 34, SPIN_IFRAMES = 8, CONTACT = 40;
const TACKLE_R = 17;
const FORWARD = 0.92;

let game;

function makeDefenders(rnd, drive) {
  const ramp = 1 + drive * 0.07;                 // each drive gets a little faster
  const count = drive >= 2 ? 4 : 3;
  const list = [];
  for (let i = 0; i < count; i++) {
    list.push({
      x: 28 + i * (124 / (count - 1)) + Math.floor(rnd() * 16) - 8,
      y: WORLD_H - 100 - i * 58 - Math.floor(rnd() * 26),
      speed: (0.58 + rnd() * 0.28) * ramp,
      lateral: (0.46 + rnd() * 0.32) * ramp,
      stumble: 0,
      frame: rnd() * 3,
    });
  }
  return list;
}

function newGame() {
  game = {
    rnd: mulberry32(hashSeed(SEED)),
    drive: 0,
    down: 1,
    los: WORLD_H - 26,          // line of scrimmage for this down
    touchdowns: 0,
    totalYards: 0,
    state: 'ready',
    rb: null,
    defenders: [],
    camY: 0,
    yards: 0,
  };
  startDown();
  game.state = 'ready';
}

function startDown() {
  const g = game;
  g.rb = { x: VW / 2, y: g.los, vx: 0, frame: 0, spin: 0, spinCd: 0, spinDir: 1, clean: false };
  g.defenders = makeDefenders(g.rnd, g.drive);
  // push defenders ahead of the current line of scrimmage
  const shift = g.los - (WORLD_H - 26);
  for (const d of g.defenders) d.y += shift;
  g.camY = Math.max(0, Math.min(WORLD_H - VH, g.rb.y - VH * 0.62));
  g.startY = g.los;
  g.state = 'live';
}

function endPlay(result) {
  const g = game;
  g.yards = Math.max(0, Math.round((g.startY - g.rb.y) / YARD));
  g.totalYards += g.yards;

  if (result === 'td') {
    g.touchdowns++;
    g.drive++;
    g.down = 1;
    g.los = WORLD_H - 26;
    g.state = 'td';
  } else if (g.down >= 4) {
    g.state = 'gameover';
  } else {
    g.down++;
    g.los = g.rb.y;
    g.state = 'between';
  }
  paintUI();
}

newGame();

// ---- input ---------------------------------------------------------------
let pStart = null;
function advance() {
  const g = game;
  if (g.state === 'ready' || g.state === 'between' || g.state === 'td') { startDown(); paintUI(); }
  else if (g.state === 'gameover') { newGame(); paintUI(); }
}
function nudge(dir) {
  if (game.state !== 'live') { advance(); return; }
  game.rb.vx += dir * 1.9;
}
function spin() {
  const g = game;
  if (g.state !== 'live') { advance(); return; }
  const rb = g.rb;
  if (rb.spin > 0 || rb.spinCd > 0) return;
  let near = null, nd = Infinity;
  for (const d of g.defenders) {
    if (d.stumble > 0) continue;
    const dist = Math.hypot(rb.x - d.x, rb.y - d.y);
    if (dist < nd) { nd = dist; near = d; }
  }
  rb.spin = SPIN_LEN;
  rb.spinCd = SPIN_LEN + SPIN_CD;
  rb.clean = !!near && nd < CONTACT;
  rb.spinDir = near && nd < 56 ? (Math.sign(rb.x - near.x) || 1) : (Math.sign(rb.vx) || 1);
  if (rb.clean) {
    for (const d of g.defenders) {
      if (Math.hypot(rb.x - d.x, rb.y - d.y) < CONTACT + 10) d.stumble = 95;
    }
  }
}
canvas.addEventListener('pointerdown', (e) => {
  pStart = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', (e) => {
  if (!pStart) return;
  const dx = e.clientX - pStart.x;
  if (Math.abs(dx) > 18) nudge(Math.sign(dx));
  else spin();
  pStart = null;
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') nudge(-1);
  else if (e.key === 'ArrowRight') nudge(1);
  else if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); spin(); }
});

// ---- simulation ----------------------------------------------------------
function step() {
  const g = game;
  if (g.state !== 'live') return;
  const rb = g.rb;
  if (rb.spinCd > 0) rb.spinCd--;

  if (rb.spin > 0) {
    const p = rb.spin / SPIN_LEN;
    rb.x += rb.spinDir * 3.4 * p;
    rb.y -= rb.clean ? FORWARD : FORWARD * 0.45;
    rb.vx *= 0.7;
    rb.spin--;
  } else {
    rb.y -= FORWARD;
    rb.x += rb.vx;
    rb.vx *= 0.86;
    rb.frame += 0.22;
  }
  rb.x = Math.max(HALF - 4, Math.min(VW - HALF + 4, rb.x));

  for (const d of g.defenders) {
    if (d.stumble > 0) { d.stumble--; continue; }
    const dx = (rb.x + rb.vx * 8) - d.x;
    const dy = rb.y - d.y;
    const dist = Math.hypot(dx, dy) || 1;
    d.x += (dx / dist) * d.lateral;
    d.y += (dy / dist) * d.speed;
    d.frame += 0.2;
    const spinning = rb.spin > SPIN_IFRAMES;
    if (!spinning && Math.hypot(rb.x - d.x, rb.y - d.y) < TACKLE_R) { endPlay('tackled'); return; }
  }

  if (rb.y <= ENDZONE_Y + 12) { endPlay('td'); return; }
  g.camY = Math.max(0, Math.min(WORLD_H - VH, rb.y - VH * 0.62));
}

// ---- render --------------------------------------------------------------
function drawField(camY) {
  ctx.fillStyle = '#08090b';
  ctx.fillRect(0, 0, VW, VH);
  for (let yd = 0; yd <= DRIVE_YARDS; yd++) {
    const sy = Math.round(WORLD_H - yd * YARD - camY);
    if (sy < -2 || sy > VH + 2) continue;
    if (yd % 5 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.20)';
      ctx.fillRect(0, sy, VW, 1);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(VW / 2 - 14, sy, 5, 1);
      ctx.fillRect(VW / 2 + 9, sy, 5, 1);
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(2, 0, 1, VH);
  ctx.fillRect(VW - 3, 0, 1, VH);

  // line of scrimmage — a dashed marker, so the down has a visible anchor
  const ly = Math.round(game.los - camY);
  if (ly > -2 && ly < VH + 2) {
    ctx.fillStyle = 'rgba(232,197,97,0.45)';
    for (let x = 0; x < VW; x += 6) ctx.fillRect(x, ly, 3, 1);
  }

  const gy = Math.round(ENDZONE_Y + 12 - camY);
  if (gy > -SPR && gy < VH + SPR) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(0, gy, VW, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    ctx.fillRect(0, Math.max(0, gy - 40), VW, Math.min(40, gy));
  }
}

function render() {
  const g = game;
  drawField(g.camY);

  for (const d of g.defenders) {
    const sy = Math.round(d.y - g.camY);
    if (sy > -SPR && sy < VH + SPR) {
      const f = DEF_FRAMES[Math.floor(d.stumble > 0 ? 1 : d.frame) % 3];
      drawSprite(f, Math.round(d.x) - HALF, sy - HALF, false);
    }
  }

  const rb = g.rb;
  const rby = Math.round(rb.y - g.camY);
  if (rb.spin > 0) {
    const s4 = Math.floor((SPIN_LEN - rb.spin) / (SPIN_LEN / 4)) % 4;
    ctx.globalAlpha = 0.22;
    drawSprite(SPIN_FRAMES[(s4 + 3) % 4], Math.round(rb.x - rb.spinDir * 7) - HALF, rby - HALF, false);
    ctx.globalAlpha = 1;
    drawSprite(SPIN_FRAMES[s4], Math.round(rb.x) - HALF, rby - HALF, true, SPIN_BALL_DX[s4]);
  } else {
    drawSprite(RUN_FRAMES[Math.floor(rb.frame) % 3], Math.round(rb.x) - HALF, rby - HALF, true, 0);
  }
}

// ---- DOM type ------------------------------------------------------------
const overlay = document.getElementById('overlay');
const ttl = document.getElementById('ttl');
const sub = document.getElementById('sub');
const tap = document.getElementById('tap');
const status = document.getElementById('status');
const ORD = ['', '1ST', '2ND', '3RD', '4TH'];

function toGo(g) { return Math.max(1, Math.round((g.los - ENDZONE_Y - 12) / YARD)); }

function paintUI() {
  const g = game;
  status.innerHTML =
    `<span>DRIVE <b>${g.drive + 1}</b></span>` +
    `<span>DOWN <b>${g.down}</b></span>` +
    `<span>TO GO <b>${toGo(g)}</b></span>` +
    `<span class="sc">${g.touchdowns} TD</span>`;

  ttl.classList.remove('gold');
  if (g.state === 'ready') {
    ttl.textContent = 'Opening Drive';
    sub.textContent = `1st & ${toGo(g)}`;
    tap.textContent = 'tap to start';
  } else if (g.state === 'between') {
    ttl.textContent = `Tackled`;
    sub.textContent = `${g.yards} yd gain · ${ORD[g.down]} & ${toGo(g)}`;
    tap.textContent = 'tap for next down';
  } else if (g.state === 'td') {
    ttl.textContent = 'Touchdown';
    ttl.classList.add('gold');
    sub.textContent = `${g.touchdowns} on the day · drive ${g.drive + 1} up next`;
    tap.textContent = 'tap to continue';
  } else if (g.state === 'gameover') {
    ttl.textContent = 'Turnover on Downs';
    sub.textContent = `${g.touchdowns} TD · ${g.totalYards} total yards`;
    tap.textContent = 'tap to play again';
  }
  overlay.classList.toggle('show', g.state !== 'live');
}
paintUI();

document.getElementById('build').textContent = `sprites ${SPR}×${SPR} · build ${BUILD}`;

// ---- loop ----------------------------------------------------------------
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last);
  last = now;
  const wasLive = game.state === 'live';
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  if (wasLive && game.state !== 'live') paintUI();
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__game = () => game;
</script>
</body>
</html>
