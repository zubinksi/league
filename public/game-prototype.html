<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Goal Line — prototype</title>
<style>
  :root {
    --gold: #e8c561;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #08090b; color: #e9e9ec;
    font-family: var(--mono);
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  #wrap {
    height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
  }
  canvas {
    image-rendering: pixelated;          /* the whole trick: low-res, integer-scaled */
    image-rendering: crisp-edges;
    touch-action: none;                  /* we own every gesture on the field */
    background: #08090b;
    border: 1px solid rgba(255,255,255,0.08);
  }
  #hint {
    font-size: 9.5px; letter-spacing: 0.16em; color: #55575e; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hint">swipe ← → · double-tap to juke · (desktop: arrows + space)</div>
</div>
<script>
// ---------------------------------------------------------------------------
// GOAL LINE — playable prototype
// Canvas 2D at a fixed low resolution, integer-scaled up. No engine, no assets:
// sprites are string arrays, so the whole game is a few KB of code.
// ---------------------------------------------------------------------------

const VW = 180, VH = 260;              // logical (pixel-art) viewport
const YARD = 16;                       // logical px per yard
const FIELD_YARDS = 25;
const WORLD_H = FIELD_YARDS * YARD;    // total run length
const ENDZONE_Y = 0;

// ---- palette -------------------------------------------------------------
const PAL = {
  '.': null,
  W: '#ffffff',   // ball carrier
  L: '#c9c9cf',   // carrier shading
  G: '#6d6f76',   // defenders
  D: '#26282d',   // outline
  O: '#e8c561',   // the football
};

// ---- sprites: 16x16, three-frame run cycle -------------------------------
const BODY = [
  '................',
  '.....DDDDDD.....',
  '....DWWWWWWD....',
  '....DWWWWWWD....',
  '....DWWWWWWD....',
  '.....DLLLLD.....',
  '...DDWWWWWWDD...',
  '..DWWWWWWWWWWD..',
  '..DWWWWWWWWWWD..',
  '..DWWWWWWWWWWD..',
  '..DWWWWWWWWWWD..',
  '...DWWWWWWWWD...',
  '....DWWWWWWD....',
];
const LEGS = [
  ['...DLLD..DLLD...', '...DLLD..DLLD...', '...DDD....DDD...'],
  ['....DLLDLLD.....', '....DLLDLLD.....', '....DDDDDD......'],
  ['....DLLDDLLD....', '...DLLD..DLLD...', '...DDD....DDD...'],
];
const RUN_FRAMES = LEGS.map((legs) => [...BODY, ...legs]);

// Defender: same silhouette, recessive gray so the carrier stays the hero.
const toDefender = (rows) => rows.map((r) => r.replace(/W/g, 'G').replace(/L/g, 'G'));
const DEF_FRAMES = RUN_FRAMES.map(toDefender);

// Ball tucked under the right arm — the only gold on screen.
const BALL = [[8, 12], [8, 13], [9, 12], [9, 13], [10, 13]];

// ---- deterministic RNG so both managers face the same defense -------------
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- canvas setup --------------------------------------------------------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 2;
function fit() {
  const maxW = Math.min(window.innerWidth - 24, 420);
  const maxH = window.innerHeight - 90;
  scale = Math.max(1, Math.floor(Math.min(maxW / VW, maxH / VH)));
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW * scale + 'px';
  canvas.style.height = VH * scale + 'px';
}
window.addEventListener('resize', fit);
fit();
ctx.imageSmoothingEnabled = false;

function drawSprite(rows, px, py, ballTint) {
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const c = PAL[row[x]];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(px + x, py + y, 1, 1);
    }
  }
  if (ballTint) {
    ctx.fillStyle = PAL.O;
    for (const [y, x] of BALL) ctx.fillRect(px + x, py + y, 1, 1);
  }
}

// ---- game state ----------------------------------------------------------
const SEED = new URLSearchParams(location.search).get('seed') || 'WK15-M1';
let game;

function reset() {
  const rnd = mulberry32(hashSeed(SEED));
  const defenders = [];
  for (let i = 0; i < 3; i++) {
    defenders.push({
      x: 30 + i * 55 + Math.floor(rnd() * 18) - 9,
      y: WORLD_H - 90 - i * 62 - Math.floor(rnd() * 30),
      speed: 0.62 + rnd() * 0.3,
      lateral: 0.5 + rnd() * 0.35,
      stumble: 0,
      frame: rnd() * 3,
    });
  }
  game = {
    rb: { x: VW / 2 - 8, y: WORLD_H - 26, vx: 0, frame: 0, juke: 0 },
    defenders,
    startY: WORLD_H - 26,
    camY: 0,
    state: 'ready',      // ready | live | tackled | touchdown
    t: 0,
    titleT: 0,
    yards: 0,
  };
}
reset();

// ---- input: swipe + double tap -------------------------------------------
let pStart = null, lastTap = 0;
function nudge(dir) {
  if (game.state === 'ready') game.state = 'live';
  if (game.state !== 'live') return;
  game.rb.vx += dir * 1.85;
}
function juke() {
  if (game.state === 'ready') game.state = 'live';
  if (game.state !== 'live' || game.rb.juke > 0) return;
  game.rb.juke = 26;                                  // ~0.43s of juke
  for (const d of game.defenders) {
    const dx = d.x - game.rb.x, dy = d.y - game.rb.y;
    if (Math.hypot(dx, dy) < 34) d.stumble = 70;      // beaten defenders stall
  }
}
canvas.addEventListener('pointerdown', (e) => {
  if (game.state === 'tackled' || game.state === 'touchdown') { reset(); return; }
  pStart = { x: e.clientX, y: e.clientY, t: performance.now() };
});
canvas.addEventListener('pointerup', (e) => {
  if (!pStart) return;
  const dx = e.clientX - pStart.x;
  const dt = performance.now() - pStart.t;
  if (Math.abs(dx) > 18) {
    nudge(Math.sign(dx));
  } else if (dt < 260) {
    const now = performance.now();
    if (now - lastTap < 300) { juke(); lastTap = 0; }
    else { lastTap = now; if (game.state === 'ready') game.state = 'live'; }
  }
  pStart = null;
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') nudge(-1);
  else if (e.key === 'ArrowRight') nudge(1);
  else if (e.code === 'Space') { e.preventDefault(); juke(); }
  else if (e.key === 'Enter' && game.state !== 'live') reset();
});

// ---- simulation ----------------------------------------------------------
const FORWARD = 0.92;

function step() {
  const g = game;
  g.t++;
  if (g.state !== 'live') { if (g.state === 'ready') g.titleT++; return; }

  const rb = g.rb;
  rb.y -= FORWARD;
  rb.x += rb.vx;
  rb.vx *= 0.86;                                    // easing, not stopping dead
  rb.x = Math.max(6, Math.min(VW - 22, rb.x));
  rb.frame += 0.22;
  if (rb.juke > 0) rb.juke--;

  for (const d of g.defenders) {
    if (d.stumble > 0) { d.stumble--; continue; }
    const dx = (rb.x + rb.vx * 8) - d.x;
    const dy = rb.y - d.y;
    const dist = Math.hypot(dx, dy) || 1;
    d.x += (dx / dist) * d.lateral;
    d.y += (dy / dist) * d.speed;
    d.frame += 0.2;
    if (Math.hypot(rb.x - d.x, rb.y - d.y) < 9) {
      g.state = 'tackled';
      g.yards = Math.max(0, Math.round((g.startY - rb.y) / YARD));
    }
  }

  if (rb.y <= ENDZONE_Y + 12) {
    g.state = 'touchdown';
    g.yards = Math.round((g.startY - rb.y) / YARD);
  }

  // camera follows, carrier sits ~62% down the viewport
  g.camY = Math.max(0, Math.min(WORLD_H - VH, rb.y - VH * 0.62));
}

// ---- render --------------------------------------------------------------
function drawField(camY) {
  ctx.fillStyle = '#08090b';
  ctx.fillRect(0, 0, VW, VH);

  // yard lines every 5 yards, hash marks every yard
  for (let yd = 0; yd <= FIELD_YARDS; yd++) {
    const wy = WORLD_H - yd * YARD;
    const sy = Math.round(wy - camY);
    if (sy < -2 || sy > VH + 2) continue;
    if (yd % 5 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.20)';
      ctx.fillRect(0, sy, VW, 1);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(VW / 2 - 14, sy, 5, 1);
      ctx.fillRect(VW / 2 + 9, sy, 5, 1);
    }
  }
  // sidelines
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(2, 0, 1, VH);
  ctx.fillRect(VW - 3, 0, 1, VH);

  // goal line + end zone
  const gy = Math.round(ENDZONE_Y + 12 - camY);
  if (gy > -20 && gy < VH + 20) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(0, gy, VW, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    ctx.fillRect(0, Math.max(0, gy - 40), VW, Math.min(40, gy));
  }
}

function text(str, y, color, size) {
  ctx.font = `${size || 8}px ui-monospace, monospace`;
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(str, VW / 2, y);
}

function render() {
  const g = game;
  drawField(g.camY);

  for (const d of g.defenders) {
    const sy = Math.round(d.y - g.camY);
    if (sy > -20 && sy < VH + 20) {
      const f = DEF_FRAMES[Math.floor(d.stumble > 0 ? 1 : d.frame) % 3];
      drawSprite(f, Math.round(d.x) - 8, sy - 8, false);
    }
  }

  const rb = g.rb;
  const rby = Math.round(rb.y - g.camY);
  // juke reads as a one-frame ghost trail, no particles, no color
  if (rb.juke > 14) {
    ctx.globalAlpha = 0.25;
    drawSprite(RUN_FRAMES[1], Math.round(rb.x - rb.vx * 3) - 8, rby - 8, false);
    ctx.globalAlpha = 1;
  }
  drawSprite(RUN_FRAMES[Math.floor(rb.frame) % 3], Math.round(rb.x) - 8, rby - 8, true);

  if (g.state === 'ready') {
    const a = Math.min(1, g.titleT / 20);
    ctx.globalAlpha = a;
    text('OPENING DRIVE', VH / 2 - 10, 'rgba(255,255,255,0.92)', 9);
    ctx.globalAlpha = a * 0.5;
    text('1ST & GOAL', VH / 2 + 6, '#8a8c92', 7);
    ctx.globalAlpha = 1;
  } else if (g.state === 'tackled') {
    text('TACKLED', VH / 2 - 8, 'rgba(255,255,255,0.92)', 9);
    text(`${g.yards} YD GAIN`, VH / 2 + 8, '#8a8c92', 7);
  } else if (g.state === 'touchdown') {
    text('TOUCHDOWN', VH / 2 - 8, PAL.O, 10);
    text(`${g.yards} YD RUN`, VH / 2 + 8, '#8a8c92', 7);
  }
}

// fixed-timestep loop
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last);
  last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// expose for screenshots/tests
window.__game = () => game;
window.__sim = (frames, fn) => { for (let i = 0; i < frames; i++) { fn && fn(i); step(); } render(); };
</script>
</body>
</html>
