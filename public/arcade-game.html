<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Arcade — mini games</title>
<style>
  :root { --gold: #e8c561; --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    /* The layout always fits the viewport, so nothing here needs to scroll or
       zoom. touch-action:none is absolute where `manipulation` still let iOS
       sneak a double-tap zoom through on fast repeated taps. */
    touch-action: none;
    height: 100%; overflow: hidden; background: #08090b; color: #e9e9ec;
    font-family: var(--mono);
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  /* Three rows: the readout, the stage, the footer. The stage takes whatever
     is left, which is what lets the call panel sit over the top of the field
     without eating it — on a short screen the field is centred in a taller
     stage rather than being the whole of one. */
  /*
   * 100% of the body, not 100dvh.
   *
   * This document is always in an iframe, and a dynamic viewport unit inside
   * one is two kinds of wrong on iOS: it can resolve against the top-level
   * viewport rather than the frame — which on an installed phone is the frame
   * plus both safe-area insets, about 90px of footer pushed below the fold —
   * and the "dynamic" half means it re-resolves mid-gesture and does not
   * always come back. fit() has always measured the frame itself, so the two
   * disagreed and the canvas was sized for a box the layout did not believe
   * in. html and body are both height:100%, so this is the frame, exactly,
   * and it cannot move.
   */
  #wrap {
    height: 100%; display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    align-items: center; justify-items: center; gap: 7px; padding: 8px 0;
  }
  /* Pinned, not auto-placed. The readout is display:none on the lineup screen,
     which takes it out of grid placement altogether — so the stage slid up
     into the auto row and the footer inherited the 1fr. That is why the lineup
     was cut off with a hundred pixels of nothing under it. */
  #hud { grid-row: 1; }
  #stage { grid-row: 2; }
  #foot { grid-row: 3; }
  /* The field can only take a whole multiple of 180 logical pixels, but the
     lineup and the play call are DOM and have no such rule — so the stage is
     as wide as the screen allows and the canvas sits centred inside it. Below
     390px that is the difference between four readable play cards and four
     36px ones. */
  #stage {
    /* align-self, not height: 100%. The wrap centres its items, and a
       percentage height against a 1fr track is not something you can rely on —
       the stage was quietly collapsing to the canvas, which on a phone left
       the lineup 90px short of the room it had and the call panel eating a
       proportionally bigger share of a smaller field. */
    position: relative; align-self: stretch; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;                   /* the field owns every gesture */
    background: #08090b; border: 0; display: block;
  }
  /* Type lives in the DOM so it renders at device resolution, not upscaled. */
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    pointer-events: none; text-align: center; padding: 0 18px;
    opacity: 0; transition: opacity .24s ease;
    background: radial-gradient(ellipse 72% 30% at 50% 50%,
      rgba(8,9,11,0.9) 0%, rgba(8,9,11,0.74) 45%, rgba(8,9,11,0) 100%);
  }
  #overlay.show { opacity: 1; }
  /* Pre-snap the scrim must sit behind the TEXT only — a tall gradient washes
     out the downfield players, which is most of what you need to read. */
  #overlay.presnap {
    justify-content: flex-start; padding-top: 12px;
    background: linear-gradient(180deg,
      rgba(8,9,11,0.95) 0%, rgba(8,9,11,0.86) 16%, rgba(8,9,11,0) 30%);
  }
  #overlay.presnap #ttl { font-size: 15px; }
  #ttl { font-size: 18px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #fbfbfd; }
  #ttl.gold { color: var(--gold); }
  #ttl.bad { color: #c96f6f; }
  #sub { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a8c92; }
  #tap { font-size: 8.5px; letter-spacing: 0.24em; text-transform: uppercase; color: #4a4c52; margin-top: 5px; }
  #attrs { display: none; flex-direction: column; gap: 5px; margin-top: 9px; }
  #attrs.show { display: flex; }
  .attr { display: flex; align-items: center; gap: 9px; }
  .attr .k { width: 62px; text-align: right; font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: #6d6f76; }
  .attr .bar { display: flex; gap: 2px; }
  .attr .seg { width: 7px; height: 7px; background: rgba(255,255,255,0.10); }
  .attr .seg.on { background: #e9e9ec; }
  .attr .lv {
    min-width: 84px; text-align: left; font-size: 8px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold);
  }

  /*
   * The play call. It used to be eight small text buttons under a scrim thin
   * enough to read the live alignment through, which asked the screen to be a
   * menu and a picture at once and left both cramped. It is a full menu now,
   * and the read moved into the cards: every diagram draws the front you are
   * actually facing, with that play's path over it, so choosing a gap is still
   * choosing the empty one.
   */
  /* A panel over the top of the field, not a screen instead of it. The plays
     and the alignment they are called against belong to the same glance: the
     camera drops the line of scrimmage to 80% while this is open, so what the
     panel covers is empty grass and what it leaves is the whole defense, the
     line to gain and your backfield.

     The panel itself has no background at all — the tint moved onto the
     controls, so the only thing between you and the grass is the buttons you
     are choosing between. Everything else up there is field. */
  #prompt {
    position: absolute; left: 0; right: 0; top: 0; bottom: auto;
    max-height: 74%; display: none; flex-direction: column;
    align-items: center; gap: 7px;
    padding: 9px 10px 10px; text-align: center;
    touch-action: pan-y; overflow-y: auto;
  }
  #prompt.show { display: flex; }
  .prdef {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #c9c9cf;
  }
  .prdef i { font-style: normal; color: var(--gold); }
  /* Down, distance, field position, drives left, points — the whole situation
     in one card, whether you are choosing a play or watching one. */
  .prsit {
    display: flex; align-items: center; width: 100%; max-width: 330px;
    border: 1px solid rgba(255,255,255,0.13); border-radius: 9px;
    padding: 9px 6px;
  }
  .prcell {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;
    align-items: center; border-right: 1px solid rgba(255,255,255,0.10);
  }
  /* The situation still leads — it is gold and a size up — but it is the same
     shape as the three beside it. A label-less two-line block next to three
     label-over-value cells read as two different cards in one border, and
     "1st & Goal" was the only value long enough to wrap. */
  .prcell.dd { flex: 1.5; }
  .prcell.dd b { font-size: 14px; color: var(--gold); }
  .prcell:last-child { border-right: 0; }
  .prcell i {
    font-style: normal; font-size: 7.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: #6d6f76;
  }
  .prcell b {
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #ececed;
    white-space: nowrap;
  }
  /* Only drawn when it has something to say. "Choose a play" over a row that
     says RUN and PASS was 21px of the field spent on a caption. */
  .prsub {
    padding: 4px 10px; border-radius: 999px; background: rgba(8,9,11,0.82);
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: #8f9199;
  }
  .prsub:empty { display: none; }
  /* Run or pass first, plays second. Two taps for a pass where there used to be
     one, bought with targets four times the size and a diagram on every card —
     and the choice is sticky, so a preference only costs the first call. */
  #prtabs { display: flex; flex-wrap: wrap; gap: 9px; width: 100%; max-width: 330px; }
  .prtab {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 9px 4px; border: 1px solid rgba(255,255,255,0.16); border-radius: 9px;
    background: rgba(8,9,11,0.82);
    font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: #8f9199; cursor: pointer; touch-action: manipulation;
  }
  .prtab.on { border-color: rgba(232,197,97,0.62); color: var(--gold); }
  .prtab:active { background: rgba(28,30,34,0.86); }
  #propts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; max-width: 330px; }
  .prcard {
    /* Capped, so the one card a field goal offers is the same object as one of
       four and not a billboard. */
    /* Four across wherever four fit — the basis is under a quarter of the
       narrowest track that still holds them — and two rows of two below that. */
    flex: 1 1 62px; min-width: 62px; max-width: 92px;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 6px 3px 5px;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 9px;
    /* Opaque enough for a hairline diagram to hold its own over yard lines and
       a sprite, which is what sets this a touch darker than the tabs. */
    background: rgba(8,9,11,0.86);
    cursor: pointer; touch-action: manipulation;
  }
  .prcard:active { background: rgba(28,30,34,0.9); border-color: rgba(255,255,255,0.34); }
  .prname {
    font-size: 8.5px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: #ececed; white-space: nowrap;
  }
  .prdiag { width: 100%; height: auto; display: block; }
  /* The line under the diagram, and what the play asks of your man. */
  /* The key that picks this play. Only drawn where there is a keyboard. */
  .prkey {
    font-style: normal; font-size: 7px; letter-spacing: 0.1em;
    color: #55575d; margin-right: 4px;
  }
  .prdiag .mine { fill: #ececed; }
  .prdiag .los { stroke: rgba(255,255,255,0.22); stroke-width: 1; stroke-dasharray: 3 3; }
  .prdiag .post { stroke: #9a9ca3; stroke-width: 1.6; }
  .prdiag .path {
    fill: none; stroke: #ececed; stroke-width: 1.4; stroke-dasharray: 2.5 2.5;
    stroke-linejoin: round; stroke-linecap: round;
  }
  .prdiag .tip { fill: var(--gold); }


  #picker {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; gap: 7px; padding: 0 14px;
    background: #08090b; touch-action: pan-y; overflow-y: auto;
  }
  #picker.show { display: flex; }
  /* Centred when it fits, scrolled from the top when it does not. Auto margins
     on a pair of struts do both; justify-content: center would centre it and
     then put the first row out of reach above the scroll origin. */
  #picker::before, #picker::after { content: ''; margin: auto; }
  /* How-to-play, shown once you've picked and before the first snap. */
  #brief {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 0 18px;
    background: #08090b;
  }
  #brief.show { display: flex; }
  #blist { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
  .brow { display: flex; align-items: baseline; gap: 11px; }
  .brow .bk {
    min-width: 92px; text-align: right; font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold);
  }
  .brow .bv { font-size: 9.5px; letter-spacing: 0.1em; color: #b6b8be; }
  .brow.blv { margin-bottom: 4px; }
  .brow.blv .bk { color: #ececed; }
  .brow.blv .bv { color: var(--gold); font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; }
  .bstart {
    margin-top: 12px; font-size: 8.5px; letter-spacing: 0.24em;
    text-transform: uppercase; color: #4a4c52;
  }
  .ptitle { font-size: 15px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #fbfbfd; }
  .pfront { font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  #plist { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 318px; }
  /* A container, not a control. Everything tappable is a child of it, so no
     button is ever nested inside another one. */
  .pick {
    display: flex; align-items: stretch;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; overflow: hidden;
  }
  .pick button {
    appearance: none; background: none; border: 0; font: inherit; color: inherit;
    text-align: left; cursor: pointer; touch-action: manipulation;
  }
  .pick button:disabled { cursor: default; }
  /* The player: who he is, and a tap for his card. */
  .pick .pwho {
    flex: 1; min-width: 0; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; padding: 11px 12px;
  }
  .pick .pwho:hover:not(:disabled), .pick .pwho:active:not(:disabled) { background: rgba(255,255,255,0.05); }
  .pick .pn { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: 0.04em; color: #ececed; }
  .pick .ptrend {
    margin-left: 7px; font-size: 8px; font-weight: 400; letter-spacing: 0;
  }
  .pick .ptrend.up { color: #c9c9cf; }
  .pick .ptrend.down { color: #55575d; }
  .pick .pchip {
    display: inline-block; width: 7px; height: 7px; border-radius: 1px;
    margin-right: 7px; vertical-align: middle;
  }
  .pick .pt { display: block; font-size: 9.5px; letter-spacing: 0.18em; color: #6d6f76; text-transform: uppercase; margin-top: 5px; }
  .pick.chem { border-color: rgba(232,197,97,0.44); }
  /* Still listed, so you can see who you have not got this week. */
  .pick.off { opacity: 0.34; border-style: dashed; }
  .pick .pout, .pick .prisk {
    margin-left: 7px; font-size: 7.5px; font-weight: 600; letter-spacing: 0.14em;
  }
  .pick .pout { color: #b0555f; }
  /* Mileage. Worn is a shrug, gassed is a reason to sit him. */
  .pick .pwear {
    margin-left: 7px; font-size: 7.5px; font-weight: 600; letter-spacing: 0.14em;
    color: #b08a4a;
  }
  .pick .prisk { color: #b08a4a; }
  .pick .pchem {
    margin-left: 7px; font-size: 7.5px; font-weight: 600; letter-spacing: 0.14em;
    color: var(--gold);
  }
  .pick .pmain { flex: 1; min-width: 0; }
  /* The position is the control that changes who fills it — the same move as
     tapping a slot on a real roster page. It was dead label text before. */
  .pick .pslot {
    flex: none; width: 70px; display: flex; align-items: center; gap: 3px;
    padding: 11px 0 11px 12px; border-right: 1px solid rgba(255,255,255,0.09);
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: #8f9199;
  }
  .pick .pslot i { font-style: normal; font-size: 12px; line-height: 1; color: #55575d; }
  .pick .pslot:hover, .pick .pslot:active { background: rgba(255,255,255,0.06); color: #ececed; }
  .pick .pslot:hover i, .pick .pslot:active i { color: #b6b8be; }
  /* Beside the row, never inside it. */
  .pick .pinfo {
    flex: none; width: 38px; display: flex; align-items: center; justify-content: center;
    border-left: 1px solid rgba(255,255,255,0.09);
    font-size: 11px; font-style: italic; font-weight: 600; color: #8f9199;
  }
  .pick .pinfo:hover, .pick .pinfo:active { background: rgba(255,255,255,0.06); color: #ececed; }
  .phint {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #55575d;
  }
  .pchemline {
    min-height: 12px; font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold);
  }
  .pstart {
    /* Real buttons now, so the agent stylesheet has to be turned off first. */
    appearance: none; -webkit-appearance: none; background: none; font: inherit;
    padding: 13px 20px; border: 1px solid rgba(255,255,255,0.32);
    border-radius: 9px; font-size: 12px; font-weight: 600; letter-spacing: 0.2em;
    text-transform: uppercase; color: #ececed; cursor: pointer; touch-action: manipulation;
  }
  .pstart:hover, .pstart:active { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.06); }
  /* Stacked, not side by side: two half-width buttons could not hold "matchup
     vs the zooks" and were the smallest targets on a screen whose whole job is
     to be tapped. */
  .pmodes { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 318px; }
  /* The one that spends the week. Gold is the app's live-and-scoring colour and
     this is the only scoring run there is. */
  .pstart.live {
    border-color: rgba(232,197,97,0.55); color: var(--gold);
    background: rgba(232,197,97,0.07);
  }
  .pstart.live:hover, .pstart.live:active {
    border-color: var(--gold); background: rgba(232,197,97,0.14);
  }
  .pstart.live i {
    font-style: normal; font-weight: 400; letter-spacing: 0.14em; color: #b09a55;
  }
  /* Practice is the safe one, so it reads as the quieter of the two. */
  .pstart.ghost { border-color: rgba(255,255,255,0.16); color: #8f9199; }
  .pstart.ghost:hover, .pstart.ghost:active { color: #ececed; }
  .pstart:disabled {
    border-color: rgba(255,255,255,0.10); color: #55575d;
    cursor: default; background: none;
  }
  .pstart:disabled:hover { background: none; border-color: rgba(255,255,255,0.10); }
  #picker.swapping .pmodes { display: none; }
  .phow, .pback {
    margin-top: 7px; font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #6d6f76; cursor: pointer; touch-action: manipulation;
  }
  /* A chevron is the cheapest way to say the line is a door. */
  .phow i { font-style: normal; font-size: 12px; line-height: 1; color: #4a4c52; }
  .phow:hover, .phow:active { color: #ececed; }
  .phow:hover i, .phow:active i { color: #8f9199; }
  /* Swapping one spot: the lineup chrome steps aside for the position's list. */
  #picker.swapping .pchemline, #picker.swapping .phow { display: none; }
  #picker:not(.swapping) .pback { display: none; }
  .pick .pbars { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .pick .pbar { display: flex; gap: 2px; }
  .pick .pseg { width: 8px; height: 7px; background: rgba(255,255,255,0.10); }
  .pick .pseg.on { background: #c9c9cf; }
  /* What last weekend did. Gold for ground gained, red for ground given back. */
  .pick .pseg.up { background: var(--gold); }
  .pick .pseg.down { background: rgba(176,85,95,0.55); }

  /* The readout. It used to be a line of mono text above the field that the
     call screen replaced with a card saying the same numbers — two designs for
     one fact, swapping as you played. The card won and moved out here, where it
     belongs to the frame and never changes. */
  #hud {
    display: none; flex-direction: column; align-items: center; gap: 8px;
    width: 100%; padding: 0 10px;
  }
  #hud.show { display: flex; }
  #foot {
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; justify-content: center;
    font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  #hint { color: #46484e; }
  #sound { color: #46484e; cursor: pointer; letter-spacing: 0.18em; }
  #sound:active { color: #8f9199; }
  #build { color: #2e3035; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="prdef"><i>Defense</i> <span id="prdef"></span></div>
    <div class="prsit">
      <span class="prcell dd"><i>Down</i><b id="prdd"></b></span>
      <span class="prcell"><i>Ball on</i><b id="pron"></b></span>
      <span class="prcell"><i>Drive</i><b id="prdrive"></b></span>
      <span class="prcell"><i>Pts</i><b id="prpts"></b></span>
    </div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="picker">
      <div class="ptitle" id="ptitle"></div>
      <div class="pfront" id="pfront"></div>
      <div class="phint" id="phint"></div>
      <div id="plist"></div>
      <div class="pchemline" id="pchem"></div>
      <div class="pmodes">
        <button class="pstart" id="pmatch">Sunday Run</button>
        <button class="pstart ghost" id="ppract">Practice</button>
      </div>
      <div class="phow" id="phow" role="button">how to play <i>›</i></div>
      <div class="pback" id="pback" role="button">← lineup</div>
    </div>
    <div id="brief">
      <div class="ptitle" id="btitle"></div>
      <div id="blist"></div>
      <div class="bstart">tap to begin</div>
    </div>
    <div id="prompt">
      <div class="prsub" id="prsub"></div>
      <div id="prtabs"></div>
      <div id="propts"></div>
    </div>
    <div id="overlay">
      <div id="ttl"></div><div id="sub"></div><div id="attrs"></div><div id="tap"></div>
    </div>
  </div>
  <div id="foot"><span id="sound" role="button" tabindex="0"></span><span id="hint"></span><span id="build"></span></div>
</div>
<script>
// ===========================================================================
// ARCADE — three mini games on one page.
// Shared: palette, sprites, seeded RNG, canvas fit, overlay/picker chrome.
// Each game supplies its own sim, render, input, and copy.
// ===========================================================================

const BUILD = 'arcade77-sprites';
const VW = 180;
let VH = 260;
const SEED = new URLSearchParams(location.search).get('seed') || 'WK15';

/**
 * Empty on the run that counts, so every roster in the league faces the same
 * alignments in the same order off the same seed. Practice re-salts on every
 * attempt: you rehearse this week's front, coverage and wind — those come off
 * SEED and stay put — without learning which gap opens on the third snap.
 */
let SALT = '';
/** 'matchup' once, then practice. Set when the run starts. */
let MODE = 'practice';
let sundayOpen = false;
/** What the host says about this week's matchup slot. */
let matchupDone = false, matchupValue = 0;

const PAL = {
  '.': null,
  W: '#ffffff', L: '#c9c9cf', M: '#8f9199',
  G: '#7d8089', D: '#26282d', O: '#e8c561',
};

// ---- team jerseys --------------------------------------------------------
// Only the player you picked is coloured; defenders are the same sprite with
// W/L/M flattened to G, so they stay monochrome for free and your guy is the
// one coloured thing on the field.
//
// These are recognisable rather than accurate. Real primaries are frequently
// unusable here: the field is #08090b, so Raiders black, Ravens #241773 and

function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- sound ---------------------------------------------------------------
/**
 * Warm-synth cues on the moments that matter, and silence everywhere else.
 * Everything is generated — no files, in keeping with the rest of the page.
 *
 * The four numbers in TUNE are the ones that decide whether a chord lands as
 * music or as a doorbell, and they were set by ear in /audio-lab.html: dark,
 * dry and quick. Extensions rather than triads, and a few cents of detune per
 * note, do the rest. Nothing here fires on a routine play — a sound that
 * happens every down is a sound you turn off.
 */
const SOUND = (() => {
  const TUNE = { detune: 4, cutoff: 1300, attack: 86, reverb: 0.22 };
  const KEY = 'arcade:sound';
  const read = () => { try { return localStorage.getItem(KEY) !== 'off'; } catch { return true; } };
  let ctx = null, dry = null, send = null, on = read(), last = '';

  /** Reverb without an impulse file: decaying noise is a perfectly good room. */
  function impulse(seconds, decay) {
    const n = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** decay;
    }
    return buf;
  }

  /** Built on the first touch, never before: a context made without a gesture
   *  starts suspended and the first cue is lost. */
  function wake() {
    if (ctx || !on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch { return; }
    const master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    const verb = ctx.createConvolver(); verb.buffer = impulse(2.8, 2.4); verb.connect(master);
    dry = ctx.createGain(); dry.connect(master);
    send = ctx.createGain(); send.connect(verb);
  }

  function voice(freq, t0, dur, level, o = {}) {
    const cut = o.cutoff ?? TUNE.cutoff, atk = (o.attack ?? TUNE.attack) / 1000;
    const det = o.detune ?? TUNE.detune;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 0.6;
    lp.frequency.setValueAtTime(cut * 0.45, t0);
    lp.frequency.linearRampToValueAtTime(cut, t0 + atk + 0.15);
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(level, t0 + Math.max(0.005, atk));
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    lp.connect(amp);
    const wet = ctx.createGain(); wet.gain.value = o.reverb ?? TUNE.reverb;
    amp.connect(dry); amp.connect(wet); wet.connect(send);
    for (const cents of det === 0 ? [0] : [-det, 0, det]) {
      const osc = ctx.createOscillator();
      osc.type = o.wave || 'sawtooth'; osc.frequency.value = freq; osc.detune.value = cents;
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(freq * o.slide, t0 + dur * 0.9);
      osc.connect(lp); osc.start(t0); osc.stop(t0 + dur + 0.1);
    }
  }

  /** The top of a chord, struck — a vibraphone, near enough. */
  function bell(freq, t0, dur, level) {
    const osc = ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = freq;
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(level, t0 + 0.012);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const trem = ctx.createGain(); trem.gain.value = 0.84;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 5.2;
    const amt = ctx.createGain(); amt.gain.value = 0.16;
    lfo.connect(amt); amt.connect(trem.gain);
    osc.connect(amp); amp.connect(trem);
    const wet = ctx.createGain(); wet.gain.value = TUNE.reverb;
    trem.connect(dry); trem.connect(wet); wet.connect(send);
    osc.start(t0); osc.stop(t0 + dur + 0.1);
    lfo.start(t0); lfo.stop(t0 + dur + 0.1);
  }

  const hz = (semi) => 440 * Math.pow(2, semi / 12);
  // Extensions, not triads. This table is the taste.
  const CHORD = {
    maj9: [0, 4, 7, 11, 14], add9: [0, 4, 7, 14], sus: [0, 5, 7, 14],
    min9: [0, 3, 7, 10, 14], minMaj7: [0, 3, 7, 11],
  };
  function chord(root, name, t0, dur, level, o = {}) {
    const ivs = CHORD[name];
    ivs.forEach((iv, i) => voice(hz(root + iv), t0 + i * (o.roll ?? 0.045), dur - i * 0.02, level, o));
    if (o.top) bell(hz(root + ivs[ivs.length - 1] + 12), t0 + 0.16, 1.6, 0.16);
  }

  const CUES = {
    td:    (t) => chord(-8, 'maj9', t, 3.4, 0.085, { top: true }),
    first: (t) => chord(-8, 'add9', t, 0.9, 0.05, { roll: 0.02, attack: 60 }),
    fg:    (t) => { chord(-10, 'sus', t, 1.1, 0.06, { roll: 0.03, attack: 90 });
                    chord(-8, 'add9', t + 0.42, 2.0, 0.07, { roll: 0.03 }); },
    xp:    (t) => chord(-8, 'add9', t, 0.6, 0.04, { roll: 0.015, attack: 40 }),
    int:   (t) => chord(-13, 'minMaj7', t, 2.6, 0.08, { slide: 0.94, roll: 0.02, cutoff: 1100 }),
    over:  (t) => chord(-20, 'min9', t, 3.0, 0.07, { roll: 0.06, attack: 300, cutoff: 900 }),
    // The one thing that fires every down, so it is a single dry triangle and
    // ninety milliseconds — closer to a click with a pitch than to a note.
    snap:  (t) => voice(hz(16), t, 0.09, 0.05,
                        { wave: 'triangle', attack: 2, reverb: 0.08, cutoff: 3200, detune: 0 }),
  };

  return {
    wake,
    get on() { return on; },
    toggle() {
      on = !on;
      try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch { /* private mode */ }
      if (on) wake();
      return on;
    },
    /** `tag` guards against the same finish being sounded twice by a repaint,
     *  the way reportScore already has to. */
    cue(name, tag) {
      if (!on || !CUES[name]) return;
      if (tag && tag === last) return;
      last = tag || '';
      wake();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      CUES[name](ctx.currentTime + 0.02);
    },
  };
})();

// ---- the field -----------------------------------------------------------
// One world, whatever the play. A ten-yard end zone so a throw has somewhere
// to land, twenty-one yards of drive in front of it, and room behind the line
// for a backfield. Both play types measure in the same yards from the same
// stripe, so the field looks identical however the ball moves.
const YARD = 16, EZ = 10 * YARD, DRIVE_YARDS = 21;
const WORLD_H = EZ + DRIVE_YARDS * YARD + 64;
const SNAP = WORLD_H - 64;              // the line on a fresh set of downs
const BACKFIELD = 44;                   // how far behind it the back sets up
const QB_DROP = 26;                     // and how deep the passer sets up

/** The grass, the stripes, the line and the chains — drawn once for everyone. */
function drawField(camY, los, marker) {
  yardLines(camY, WORLD_H, DRIVE_YARDS + 10, YARD);
  const goalRaw = EZ - camY, goalP = projectPoint(VW / 2, goalRaw);
  const gy = Math.round(goalP.y);
  if (gy > -WORLD_H && gy < VH + 40) {
    const l = projectPoint(0, goalRaw), r = projectPoint(VW, goalRaw);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(l.x, gy, r.x - l.x, 1);
    const tl = projectPoint(0, goalRaw - EZ), tr = projectPoint(VW, goalRaw - EZ);
    // The end zone is field geometry, not a screen-space rectangle. Its four
    // projected corners keep both edges on the same vanishing lines as the
    // sidelines.
    ctx.fillStyle = 'rgba(255,255,255,0.018)';
    ctx.beginPath(); ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
    ctx.lineTo(r.x, r.y); ctx.lineTo(l.x, l.y); ctx.closePath(); ctx.fill();
  }
  if (marker && marker > EZ) {
    const raw = marker - camY, p = projectPoint(VW / 2, raw), my = Math.round(p.y);
    if (my > -2 && my < VH + 2) {
      ctx.fillStyle = 'rgba(232,197,97,0.72)';
      const l = projectPoint(0, raw), r = projectPoint(VW, raw); ctx.fillRect(l.x, my, r.x - l.x, 1);
    }
  }
  const losRaw = los - camY, losP = projectPoint(VW / 2, losRaw), ly = Math.round(losP.y);
  if (ly > -2 && ly < VH + 2) {
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    const l = projectPoint(0, losRaw), r = projectPoint(VW, losRaw);
    for (let x = l.x; x < r.x; x += 6 * losP.scale) ctx.fillRect(x, ly, 3 * losP.scale, 1);
  }
  return ly;
}

// ---- canvas --------------------------------------------------------------
const canvas = document.getElementById('c');
const stage = document.getElementById('stage');
const ctx = canvas.getContext('2d');
/**
 * A 2.5D camera over the existing simulation. Physics stay in the flat,
 * deterministic field coordinates; only the final pixels are projected.
 * Near players grow, distant players tighten toward the vanishing point, and
 * input is unprojected before it reaches the game.
 */
const CAMERA = {
  enabled: true,
  horizon: 0.055,
  depth: 1.20,
  nearWidth: 1,
  farWidth: 0.68,
  panX: 0,
  goal: 0,
  frame(focusX, los) {
    const targetPan = Math.max(-VW * .08, Math.min(VW * .08, (VW / 2 - focusX) * .16));
    const goalYards = Math.max(0, (los - EZ) / YARD);
    const targetGoal = Math.max(0, Math.min(1, (12 - goalYards) / 8));
    this.panX += (targetPan - this.panX) * .10;
    this.goal += (targetGoal - this.goal) * .08;
  },
};
function projectPoint(x, y) {
  if (!CAMERA.enabled) return { x, y, scale: 1 };
  const raw = y / VH, t = Math.max(0, Math.min(1, raw));
  const horizon = Math.max(.018, CAMERA.horizon - CAMERA.goal * .032);
  const py = raw < 0 ? VH * horizon + y * CAMERA.farWidth
    : raw > 1 ? VH + (y - VH) : VH * (horizon + (1 - horizon) * Math.pow(t, CAMERA.depth));
  const width = CAMERA.farWidth + (CAMERA.nearWidth - CAMERA.farWidth) * Math.pow(t, 0.72);
  const pan = CAMERA.panX * (.42 + .58 * t);
  return { x: VW / 2 + (x - VW / 2) * width + pan, y: py, scale: 0.72 + 0.28 * t };
}
function unprojectPoint(x, y) {
  if (!CAMERA.enabled) return { x, y };
  const horizon = Math.max(.018, CAMERA.horizon - CAMERA.goal * .032);
  const normalized = (y / VH - horizon) / (1 - horizon);
  const t = normalized < 0 ? normalized * (1 - horizon) / CAMERA.farWidth
    : Math.pow(Math.max(0, Math.min(1, normalized)), 1 / CAMERA.depth);
  const width = CAMERA.farWidth + (CAMERA.nearWidth - CAMERA.farWidth) * Math.pow(t, 0.72);
  const pan = CAMERA.panX * (.42 + .58 * t);
  return { x: VW / 2 + (x - pan - VW / 2) / width, y: t * VH };
}
// Nav, readout, footer and the gaps between them. The readout is a card now
// rather than a line of text, which is most of this number.
const CHROME = 152;
const RENDER_SCALE = 2;
function fit() {
  // The frame's own box, from the same source the layout uses.
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const vh = document.documentElement.clientHeight || window.innerHeight;
  const availW = Math.min(vw - 12, 520);
  const availH = Math.max(220, vh - CHROME);
  const scale = Math.max(1, Math.min(5, Math.floor(availW / VW)));
  VH = Math.max(180, Math.min(340, Math.floor(availH / scale)));
  canvas.width = VW * RENDER_SCALE; canvas.height = VH * RENDER_SCALE;
  canvas.style.width = VW * scale + 'px';
  canvas.style.height = VH * scale + 'px';
  stage.style.width = Math.max(VW * scale, availW) + 'px';
  ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fit);
fit();

/** A 40×48 master character drawn at half-logical-pixel resolution. The game
 *  canvas is 2× internally, so every art pixel still lands on a physical
 *  pixel while the character keeps the same footprint as the old 20px man. */
function detailedSprite(rows, base, scale, ballPts, tint, meta = {}) {
  const defender = rows.some((row) => row.includes('G'));
  const u = scale / 2;
  const ox = base.x - 20 * u, oy = base.y - 48 * u;
  const dir = meta.dir || 0, pose = meta.pose || 'run', frame = Math.abs(meta.frame || 0) % 4;
  const C = tint || (defender ? PAL.G : PAL.L);
  const HI = tint || (defender ? mix(PAL.G, '#ffffff', .18) : PAL.W);
  const SH = tint || (defender ? mix(PAL.G, '#111317', .34) : PAL.M);
  const SKIN = tint || (defender ? '#8b6b58' : '#b77955');
  const D = tint || PAL.D;
  const rect = (x, y, w, h, color) => {
    const rx = dir < 0 ? 40 - x - w : x;
    ctx.fillStyle = color; ctx.fillRect(ox + rx * u, oy + y * u, w * u, h * u);
  };
  if (!tint && ctx.globalAlpha > .9) {
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.30)'; ctx.beginPath();
    ctx.ellipse(base.x, base.y - .4, 6.2 * scale, 1.25 * scale, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  // Helmet, face and mask. These are the pixels the old silhouette did not
  // have room for, and the part that makes the player feel like a character.
  rect(11, 2, 18, 2, D); rect(9, 4, 22, 8, D);
  rect(11, 4, 18, 7, HI); rect(19, 4, 3, 7, C);
  rect(12, 10, 16, 7, D); rect(14, 10, 12, 6, SKIN);
  rect(15, 11, 3, 2, D); rect(23, 11, 3, 2, D);
  rect(14, 14, 12, 2, D); rect(27, 11, 3, 6, HI);

  // Pads and jersey.
  rect(8, 17, 24, 4, D); rect(6, 20, 28, 13, D);
  rect(8, 19, 24, 13, C); rect(10, 19, 20, 3, HI);
  rect(18, 23, 4, 7, HI); rect(15, 25, 10, 2, HI);

  // Arms change silhouette by action. Contact leans both shoulders forward;
  // catch raises the hands; run alternates a compact pump.
  if (pose === 'hero') {
    rect(3, 21, 9, 7, D); rect(28, 21, 9, 7, D);
    rect(4, 22, 7, 5, SKIN); rect(29, 22, 7, 5, SKIN);
    rect(9, 27, 5, 4, SKIN); rect(26, 27, 5, 4, SKIN);
  } else if (pose === 'catch') {
    rect(4, 14, 5, 13, D); rect(31, 14, 5, 13, D);
    rect(5, 15, 3, 10, SKIN); rect(32, 15, 3, 10, SKIN);
    rect(6, 12, 4, 4, SKIN); rect(30, 12, 4, 4, SKIN);
  } else if (pose === 'contact' || pose === 'truck') {
    rect(3, 20, 8, 9, D); rect(29, 20, 8, 9, D);
    rect(4, 21, 6, 7, SKIN); rect(30, 21, 6, 7, SKIN);
  } else if (pose === 'fall') {
    rect(3, 24, 9, 6, D); rect(4, 25, 7, 4, SKIN);
    rect(29, 17, 7, 12, D); rect(30, 18, 5, 10, SKIN);
  } else {
    const swing = frame % 2 ? 3 : -2;
    rect(4, 20 + Math.max(0, swing), 7, 12, D); rect(5, 21 + Math.max(0, swing), 5, 9, SKIN);
    rect(29, 20 + Math.max(0, -swing), 7, 12, D); rect(30, 21 + Math.max(0, -swing), 5, 9, SKIN);
  }

  // Pants, directional stride, socks and shoes.
  rect(10, 32, 20, 5, D); rect(11, 32, 18, 4, HI);
  const stride = pose === 'fall' ? 0 : frame % 2 ? 4 : -4;
  rect(11 + Math.max(0, -stride), 36, 7, pose === 'fall' ? 5 : 8, D);
  rect(22 + Math.max(0, stride), 36, 7, pose === 'fall' ? 5 : 8, D);
  rect(12 + Math.max(0, -stride), 37, 5, pose === 'fall' ? 4 : 6, SH);
  rect(23 + Math.max(0, stride), 37, 5, pose === 'fall' ? 4 : 6, SH);
  rect(10 + Math.max(0, -stride), 43, 9, 3, HI);
  rect(21 + Math.max(0, stride), 43, 9, 3, HI);
  rect(9 + Math.max(0, -stride), 46, 10, 2, D);
  rect(21 + Math.max(0, stride), 46, 10, 2, D);

  if (ballPts || meta.ball) {
    rect(dir < 0 ? 7 : 29, pose === 'catch' ? 15 : 26, 6, 5, D);
    rect(dir < 0 ? 8 : 30, pose === 'catch' ? 16 : 27, 4, 3, PAL.O);
  }
}

function sprite(rows, px, py, ballPts, ballDx, tint, meta) {
  const h = rows.length, w = rows[0] ? rows[0].length : 20;
  const base = projectPoint(px + w / 2, py + h);
  const s = base.scale;
  // Distant figures deliberately keep the simpler silhouette. At that size
  // face masks and fingers become noise; the detail returns smoothly as the
  // player approaches the camera.
  if (s > .84 && ctx.globalAlpha > .16) {
    detailedSprite(rows, base, s, ballPts, tint, meta);
    return;
  }
  px = base.x - w * s / 2;
  py = base.y - h * s;
  if (!tint && ctx.globalAlpha > 0.9) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath();
    ctx.ellipse(base.x, base.y - .5, w * s * 0.27, Math.max(.7, 1.55 * s), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const code = row[x], c = PAL[code];
      if (!c) continue;
      // At distance the one-pixel outline is most of the character. Lift it
      // slightly so defenders remain bodies rather than grey noise.
      const ink = code === 'D' && s < .84 ? mix(c, '#74777e', (.84 - s) * 1.8) : c;
      ctx.fillStyle = tint || ink; ctx.fillRect(px + x * s, py + y * s, Math.max(.72, s), Math.max(.72, s));
    }
  }
  if (ballPts) {
    // Dark halo first: gold on a gold-ish jersey would otherwise disappear.
    ctx.fillStyle = PAL.D;
    for (const [y, x] of ballPts) {
      const bx = px + (x + (ballDx || 0)) * s, by = py + y * s;
      ctx.fillRect(bx - s, by, s, s); ctx.fillRect(bx + s, by, s, s);
      ctx.fillRect(bx, by - s, s, s); ctx.fillRect(bx, by + s, s, s);
    }
    ctx.fillStyle = PAL.O;
    for (const [y, x] of ballPts) ctx.fillRect(px + (x + (ballDx || 0)) * s, py + y * s, s, s);
  }
}
/**
 * Weight, without touching the simulation.
 *
 * Every random number in here comes from Math.random and not from the game's
 * seeded stream. That stream is why the whole league faces the same fronts and
 * the same wind: it is consumed in exactly the same order by every player, so
 * a single dust mote drawn from it would hand you a different defense to
 * everyone else. Nothing below may ever move a body or decide an outcome — it
 * reacts to what already happened.
 */
const FX = {
  dust: [],
  /** Screen kick, in logical pixels, decaying to nothing. */
  shake: 0,
  /** Frames of hitstop still owed. The loop holds the sim while this burns. */
  stop: 0,
  reset() { FX.dust.length = 0; FX.shake = 0; FX.stop = 0; },
  /** Turf, thrown up from a point of contact. */
  kick(x, y, n, spread) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 0.35 + Math.random() * (spread || 1);
      FX.dust.push({
        x, y,
        vx: Math.cos(a) * s,
        // Squashed vertically and biased downfield: the camera is overhead,
        // so a puff spreads across the grass rather than up into the air.
        vy: Math.sin(a) * s * 0.55 - 0.25,
        life: 11 + Math.random() * 13,
      });
    }
  },
  /** A collision worth feeling: turf, a kick of the screen, and two frames
   *  where nothing moves at all. */
  hit(x, y, mag) {
    FX.kick(x, y, 9 + Math.round(mag * 5), 1.5);
    FX.shake = Math.max(FX.shake, mag);
    FX.stop = Math.max(FX.stop, 2);
  },
  step() {
    if (FX.shake > 0) FX.shake = Math.max(0, FX.shake - 0.32);
    for (let i = FX.dust.length - 1; i >= 0; i--) {
      const p = FX.dust[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.9; p.vy = p.vy * 0.9 + 0.05;
      if (--p.life <= 0) FX.dust.splice(i, 1);
    }
  },
  draw(camY) {
    if (!FX.dust.length) return;
    ctx.fillStyle = '#c9c9cf';
    for (const p of FX.dust) {
      const sy = Math.round(p.y - camY);
      if (sy < -1 || sy > VH + 1) continue;
      const at = projectPoint(p.x, sy);
      ctx.globalAlpha = Math.min(0.44, p.life / 30);
      ctx.fillRect(Math.round(at.x), Math.round(at.y), Math.max(.75, at.scale), Math.max(.75, at.scale));
    }
    ctx.globalAlpha = 1;
  },
};

/**
 * The man with the ball, with a light along his leading edge.
 *
 * The same sprite drawn a pixel downfield in one flat tone, then the real one
 * over the top of it — only the edge survives being covered, which is exactly
 * the rim. It costs one extra pass over a 20x20 sprite and it is the whole
 * difference between the carrier and another silhouette in the same kit.
 */
function rimmed(rows, px, py, ballPts, ballDx, glow, meta) {
  ctx.globalAlpha = glow;
  sprite(rows, px, py - 1, null, 0, '#f2f2f4', meta);
  ctx.globalAlpha = 1;
  sprite(rows, px, py, ballPts, ballDx, null, meta);
}

function yardLines(camY, worldH, yards, yard) {
  CAMERA.enabled = true;
  ctx.fillStyle = '#08090b'; ctx.fillRect(0, 0, VW, VH);
  const topL = projectPoint(0, 0), topR = projectPoint(VW, 0);
  const bottomL = projectPoint(0, VH), bottomR = projectPoint(VW, VH);
  for (let i = 0; i <= yards; i++) {
    const rawY = worldH - i * yard - camY;
    const p = projectPoint(VW / 2, rawY);
    const sy = Math.round(p.y);
    if (sy < -2 || sy > VH + 2) continue;
    const half = (VW / 2) * (CAMERA.farWidth + (CAMERA.nearWidth - CAMERA.farWidth) * Math.pow(Math.max(0, Math.min(1, rawY / VH)), .72));
    if (i % 5 === 0) {
      ctx.fillStyle = `rgba(255,255,255,${(0.07 + p.scale * 0.10).toFixed(3)})`;
      ctx.fillRect(VW / 2 - half + CAMERA.panX * (.42 + .58 * Math.max(0, Math.min(1, rawY / VH))), sy, half * 2, 1);
    }
    else {
      ctx.fillStyle = `rgba(255,255,255,${(0.018 + p.scale * 0.035).toFixed(3)})`;
      const hash = 14 * p.scale;
      ctx.fillRect(p.x - hash, sy, 5 * p.scale, 1); ctx.fillRect(p.x + hash - 5 * p.scale, sy, 5 * p.scale, 1);
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.moveTo(topL.x, topL.y); ctx.lineTo(bottomL.x, bottomL.y); ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(topR.x, topR.y); ctx.lineTo(bottomR.x, bottomR.y); ctx.stroke();
}

// ---- the defense ---------------------------------------------------------
// One alignment, read once, whatever you call against it. The box is the run
// front and the pass rush; the corner is over the receiver and also sets that
// edge; the safety is the last man on both. Which of them can hurt you is the
// difference between the eight plays.
const FRONT = mulberry32(hashSeed(SEED + '|front'))() < 0.5
  ? { label: 'Stacked front', spread: 0.64 } : { label: 'Spread front', spread: 1.32 };

/**
 * The defense speeds up with every score, and stops.
 *
 * It counts scores, never possessions, and that is what makes it safe to be
 * this steep: it only ever bites a player who is already scoring. A roster
 * having a bad day never reaches the top of it.
 *
 * The ceiling used to be held at 1.25 because the ramp was the only thing that
 * ended a run, and past about 1.36 nothing breaks free at all. The possession
 * limit ends runs now, so that reason is gone — an eighth score puts the box at
 * 1.64, where the quickest defender is faster than any back alive and the last
 * drives of a good game are meant to feel desperate.
 *
 * A box defender's base pursuit is 0.58–0.86 and a good back runs about 1.04,
 * for scale.
 */
const RAMP_STEP = 0.08, RAMP_CAP = 8;
const rampAt = (drive) => 1 + Math.min(drive, RAMP_CAP) * RAMP_STEP;

function defenders(rnd, drive, los) {
  const ramp = rampAt(drive), out = [];
  // The front used to be spaced purely off the line of scrimmage, which only
  // works with a whole field behind it: inside about five yards every
  // defender spawned past the end line and short yardage was an untouched
  // walk-in. Line up in the room that actually exists instead — the deep
  // help thins out, because getting to the stripe already beat it.
  const room = Math.max(26, los - EZ + 4);
  const standoff = Math.max(26, Math.min(74, room * 0.45));
  // Three deep, always. A fourth used to arrive on the third scoring drive and
  // it was not difficulty, it was a lid: the longest run in a sample fell from
  // twenty-one yards to six the moment he showed up, explosive runs went from
  // eight per cent to zero, and neither ever came back. Twenty-one yards of
  // field cannot hold four layers — that is a man every five yards, so there is
  // no room left for a breakaway by construction. Delaying him to the fifth
  // score just moves the same cliff. The speed ramp carries the difficulty
  // instead, which shades the odds rather than removing a whole play type.
  //
  // (Thinning below three does the opposite of what it sounds like: lane
  // spacing is VW / (n + 0.6), so fewer men stand wider and cover the gaps more
  // evenly — the interior went from 18% to 32% stuffed at two.)
  const n = Math.max(1, Math.min(3, 1 + Math.floor((room - standoff) / 44)));
  const gap = n > 1 ? Math.min(58, (room - standoff) / (n - 1)) : 0;
  // As the layers tighten the front also flattens across the width, so a
  // goal-line stand is a gap to find rather than a wall or a walk-in.
  const tight = Math.min(1, gap / 58);
  const lane = 52 * FRONT.spread * tight + (VW / (n + 0.6)) * (1 - tight);
  for (let i = 0; i < n; i++) {
    const x = VW / 2 + (i - (n - 1) / 2) * lane + Math.floor(rnd() * 14) - 7;
    // Someone is always on the ball. Without a man at the line every layer
    // was linebacker depth, first contact always happened past the stripe,
    // and a carry could not lose yardage no matter how badly it was read.
    const back = i === 0
      ? 6 + Math.floor(rnd() * 10)
      : standoff + (i - 1) * gap + Math.floor(rnd() * 26) * tight;
    out.push({
      x, y: Math.max(4, los - back),
      speed: (0.58 + rnd() * 0.28) * ramp, lateral: (0.46 + rnd() * 0.32) * ramp,
      stumble: 0, frame: rnd() * 3,
    });
  }
  return out;
}

/** The whole picture: box, corner over the receiver, safety over the top. */
/**
 * Where the camera sits.
 *
 * Two framings, because the screen is two different sizes. Playing, the whole
 * canvas is yours and the carrier rides at PLAY_EYE. Choosing, the call panel
 * owns the top of it, so the line drops to PRESNAP_EYE — far enough down that
 * the free safety, ten yards off the ball, still lands under the panel instead
 * of behind it. He is in the run game's pursuit and shades across to the
 * receiver on every deep route, so reading him is not optional.
 *
 * Out past the 21 the clamp already puts the line at 81% and neither number
 * changes anything; this only bites inside it, which is where the problem was.
 */
const PLAY_EYE = 0.66, PRESNAP_EYE = 0.80;
const eyeAt = (y, eye) => Math.max(0, Math.min(WORLD_H - VH, y - VH * eye));
/**
 * The pre-snap frame, but never so low that the man you are about to hand the
 * ball to falls off the bottom of it.
 *
 * 0.80 only fits when the canvas has room for the backfield underneath it —
 * VH has to be at least 270 rows, and every phone lands between 180 and 267.
 * On those the ideal framing loses to the back being on screen at all.
 */
const presnapAt = (los) =>
  eyeAt(los, Math.min(PRESNAP_EYE, (VH - (BACKFIELD + 12)) / VH));
/** Frames spent gliding from the pre-snap frame to the playing one. Cutting
 *  between them at the snap is a jump at the worst possible moment. */
const CAM_EASE = 16;

function alignDefense(rnd, drive, los, wrX) {
  const ramp = rampAt(drive);
  return {
    front: defenders(rnd, drive, los),
    cb: { x: wrX + (rnd() * 6 - 3), y: los - 15 - rnd() * 5, frame: rnd() * 3, contain: true,
          speed: (0.54 + rnd() * 0.24) * ramp, lateral: (0.44 + rnd() * 0.28) * ramp, stumble: 0 },
    // A free safety plays deep. At six yards he was a fourth linebacker on
    // runs and a man every deep throw simply flew over.
    safety: { x: VW / 2 + (rnd() * 34 - 17), y: Math.max(EZ + 8, los - 160), frame: 0, deep: true,
              speed: (0.50 + rnd() * 0.22) * ramp, lateral: (0.40 + rnd() * 0.24) * ramp, stumble: 0 },
  };
}

/** Where the eleven of them line up. The receiver's side is information: the
 *  corner is over there, so that edge is the harder one to get to. */
function alignOffense(rnd, los) {
  // The passer takes a drop and the back sets up alongside him. Both numbers
  // are pocket depth, not decoration: with a man on the ball, a passer at
  // los + 6 is inside the sack radius before the play has started.
  return { wrX: rnd() < 0.5 ? 44 : VW - 44, qb: { x: VW / 2, y: los + QB_DROP } };
}

// ===========================================================================
// GAME 1 — RUN
// ===========================================================================
const RUN_GAME = (() => {
  // Small scale, matching the pass game — one camera for the whole sport.
  // Field distances (tackle radius, contact, the front's spacing) are in
  // yards, not sprite widths, so they do not scale with the artwork: at 32px
  // a tackle at 17px looked like the defender standing inside the runner, and
  // at 20px it reads as the collision it always was.
  const SPR = 20, HALF = 10;
  const SPIN_LEN = 30, SPIN_CD = 74, TACKLE_R = 17;
  /** Daylight. Two and a half tackle radii from the nearest man is the point
   *  where a carry stops being a collision waiting to happen. */
  const CLEAR = 42;
  const TRUCK_LEN = 24, TRUCK_CD = 46;
  const SAMPLE = 'J. Gibbs:DET:0.86:0.38:0.90|D. Henry:BAL:0.62:0.96:0.18|'
    + 'B. Robinson:ATL:0.78:0.70:0.62|T. Bigsby:JAX:0.66:0.58:0.34';
  /**
   * The pre-snap read. The front is already drawn before the play starts —
   * this just lets you aim at the part of it that is empty. Two widths of
   * gap: the interior is a short trip into likely contact, the edge is a
   * long one that pays if you get there. Which suits you is the second half
   * of the read, and that half is your back.
   */
  const LANE_W = VW / 4;
  const LANES = [
    { key: 'el', label: 'Edge left', cx: Math.round(VW * 0.17), edge: true },
    { key: 'il', label: 'Mid left', cx: Math.round(VW * 0.40), edge: false },
    { key: 'ir', label: 'Mid right', cx: Math.round(VW * 0.60), edge: false },
    { key: 'er', label: 'Edge right', cx: Math.round(VW * 0.83), edge: true },
  ];

  let A = {}, g = null;
  function setAttrs(p) {
    A = {
      FWD: 0.82 + 0.24 * p.a, BREAK: 0.05 + 0.30 * p.b,
      CONTACT: 32 + 18 * p.c, STUMBLE: 78 + 46 * p.c,
      // Trucking is POWER made active: a bruiser runs through people, a
      // scatback who tries it gets stopped cold.
      TRUCK: 0.40 + 0.55 * p.b,
      SPD: p.a, PWR: p.b, ELU: p.c,
    };
  }
  return {
    key: 'run', label: 'Run', pickTitle: 'Choose your back',
    shell: FRONT.label, attrLabels: ['Speed', 'Power', 'Elusive'],
    hint: 'pick a gap · swipe ← → cut · ↑ truck · tap spin',
    controls: [['Pick a gap', 'read the front before the snap'],
               ['Edge', 'a burner’s gap — big if you get there'],
               ['Mid', 'a bruiser’s gap — short trip, expect contact'],
               ['Swipe ← →', 'cut left or right'], ['Tap', 'spin — time it into contact'],
               ['Swipe ↑', 'truck — power runs through, speed gets stopped'],
               ['Goal', 'four downs to reach the end zone']],
    roster: parseRoster('run', SAMPLE),
    reset() {
      g = { rnd: mulberry32(hashSeed(SEED + SALT)), roll: mulberry32(hashSeed(SEED + SALT + '|r')),
            drive: 0, down: 1, los: SNAP, tds: 0, yards: 0, gain: 0, state: 'select' };
      this.g = g;
    },
    // Attributes without a play. A drive sets these once and then asks for
    // carries one at a time.
    attach(p) { setAttrs(p); g.backTeam = p.team; },
    /** A drive tells the run engine who else is on the field, so the kits are
     *  right when the whole huddle is drawn. */
    mates(qbTeam, wrTeam) { g.qbTeam = qbTeam; g.wrTeam = wrTeam; },
    choose(p) { this.attach(p); this.startDown(); },
    /** Line up a single carry this many yards from the goal line. A drive
     *  hands over the alignment it already showed you; standalone play makes
     *  its own. */
    startAt(losYards, driveNo, set, marker) {
      g.los = EZ + Math.round(losYards * YARD);
      g.drive = driveNo || 0;
      // Handed down rather than worked out here: the drive owns the chains.
      g.marker = marker || null;
      this.startDown(set);
    },
    outcome() { return { kind: g.how, gain: g.gain }; },
    startDown(set) {
      const off = (set && set.off) || alignOffense(g.rnd, g.los);
      const D = (set && set.def) || alignDefense(g.rnd, g.drive, g.los, off.wrX);
      g.rb = { x: VW / 2, y: g.los + BACKFIELD, vx: 0, frame: 0, spin: 0, spinCd: 0, spinDir: 1,
               clean: false, breakCd: 0, stagger: 0, truck: 0, truckCd: 0, evade: 0,
               burst: 0, pace: 1 };
      g.qb = off.qb; g.wrX = off.wrX;
      g.wr = { x: off.wrX, y: g.los - 2, frame: 0 };   // on the line, clear of the corner
      // Everyone pursues, including the corner — so the side the receiver is
      // lined up on is the harder edge to take.
      g.defenders = [...D.front, D.cb, D.safety];
      // Gains are measured from the line, not from where he lined up, so
      // getting caught in the backfield is a loss.
      g.startY = g.los;
      g.lane = null; g.flow = 1; g.truckLane = 1;
      FX.reset();
      g.camY = presnapAt(g.los); g.camEase = CAM_EASE;
      // The front is set but frozen: this is where you get to look at it.
      g.state = 'presnap';
    },
    /** Pre-snap: the gap choice is the snap. */
    prompt() {
      if (g.state !== 'presnap') return null;
      return {
        title: FRONT.label,
        sub: 'pick your gap',
        // `best` is not a hint bolted on: it is the same fork pickOption takes,
        // where the edge scales off SPD and the interior off PWR.
        options: LANES.map((l) => ({
          key: l.key, label: l.label, cx: l.cx, edge: l.edge,
          best: l.edge ? 'Speed' : 'Power',
        })),
      };
    },
    pickOption(key) {
      const lane = LANES.find((l) => l.key === key) || LANES[1];
      const rb = g.rb;
      g.lane = lane;
      // How much of the front is sitting in the gap you asked for. Shallow
      // defenders count for more — a man on the line kills the play long
      // before the deep help ever has to make a decision.
      let load = 0;
      for (const d of g.defenders) {
        const dx = Math.abs(d.x - lane.cx);
        if (dx >= LANE_W) continue;
        const shallow = 1 - Math.min(1, (g.los - d.y) / 90);
        load += (1 - dx / LANE_W) * (0.55 + 0.75 * shallow);
      }
      // Elusiveness softens a bad read. That is what elusive means: you are
      // the back who survives running into the wrong gap.
      const clean = Math.max(0, Math.min(1, 1 - load * (1 - 0.30 * A.ELU)));
      // The gap has to suit the carrier too — the edge belongs to a burner,
      // the interior to whoever can live in there.
      const fit = lane.edge ? A.SPD : A.PWR;
      // Beat them to the spot and they cannot flow to it: pursuit loses its
      // lateral bite for as long as the burst lasts.
      g.flow = 1 - 0.26 * clean * (0.5 + 0.5 * fit);
      // Trucking is for a man you chose to meet. Out on the edge you have no
      // leverage, and in a gap you misread you are not running through one
      // defender, you are running into three — so the read decides whether
      // your best tool is available at all.
      // The floor is higher inside than it was. With a corner and a safety
      // on the field every lane reads busier, and a truck rate scaled off
      // that was quietly taking the bruiser's only tool away from him.
      g.truckLane = lane.edge ? 0.45 * (0.5 + 0.5 * clean) : 0.68 + 0.32 * clean;
      rb.burst = Math.round((lane.edge ? 34 : 30) * (0.45 + 0.55 * clean) * (0.35 + 0.95 * fit));
      // Working east-west costs you downfield, and costs a slow back more.
      // Straight ahead is the opposite trade: from the backfield an interior
      // run is downhill by the time it reaches the line, and the man who can
      // carry that speed into contact is the one built for it.
      rb.pace = lane.edge ? 0.66 + 0.26 * A.SPD : 1 + 0.16 * A.PWR;
      g.state = 'live';
    },
    end(kind) {
      g.how = kind;
      g.visual = { kind, frames: kind === 'td' ? 72 : 24 };
      g.gain = Math.round((g.startY - g.rb.y) / YARD);
      g.yards += g.gain;
      if (kind === 'td') { g.tds++; g.drive++; g.down = 1; g.los = SNAP; g.state = 'td'; }
      else if (g.down >= 4) g.state = 'gameover';
      else { g.down++; g.los = g.rb.y; g.state = 'between'; }
    },
    step() {
      if (g.state !== 'live') return;
      const rb = g.rb;
      if (rb.spinCd > 0) rb.spinCd--;
      if (rb.evade > 0) rb.evade--;
      if (rb.breakCd > 0) rb.breakCd--;
      if (rb.stagger > 0) rb.stagger--;
      if (rb.truckCd > 0) rb.truckCd--;
      // Getting to the gap you called. Steering, not teleporting — you can
      // still cut out of it, and a long edge run is visibly a long trip.
      if (rb.burst > 0) {
        rb.burst--;
        const dx = g.lane.cx - rb.x;
        if (Math.abs(dx) > 3) rb.vx += Math.sign(dx) * 0.34;
      }
      if (rb.truck > 0) {
        rb.y -= A.FWD * 1.42;                    // lowered shoulder, straight ahead
        rb.x += rb.vx * 0.4;
        rb.vx *= 0.6;
        rb.frame += 0.3;
        rb.truck--;
        if (rb.truck === 0) rb.stagger = 14;     // and it costs you afterwards
      } else if (rb.spin > 0) {
        const p = rb.spin / SPIN_LEN;
        rb.x += rb.spinDir * 2.9 * p;
        rb.y -= rb.clean ? A.FWD : A.FWD * 0.45;
        rb.vx *= 0.7; rb.spin--;
      } else {
        const pace = rb.burst > 0 ? rb.pace : 1;
        rb.y -= (rb.stagger > 0 ? A.FWD * 0.42 : A.FWD) * pace;
        rb.x += rb.vx; rb.vx *= 0.86;
        rb.frame += rb.stagger > 0 ? 0.12 : 0.22;
      }
      rb.x = Math.max(12, Math.min(VW - 12, rb.x));
      for (const d of g.defenders) {
        if (d.stumble > 0) { d.stumble--; continue; }
        // A corner plays his side. He is in the picture you read either way,
        // which is what makes the receiver's edge the harder one — but he
        // does not come chasing a carry to the far hash.
        if (d.contain && Math.sign(rb.x - VW / 2) !== Math.sign(d.x - VW / 2)) {
          d.frame += 0.08; continue;
        }
        // The last man takes an angle rather than a chase. Aiming at where
        // the carrier is standing means arriving where he was — and because
        // the pursuit vector is normalised, a defender who needs to travel
        // mostly sideways travels sideways slowly. He is moving downfield at
        // a rate we know, so the cut-off point is solvable; solving it is the
        // difference between a safety in front of the play and one trailing
        // it into the end zone.
        let tx = rb.x + rb.vx * 8, ty = rb.y;
        if (d.deep) {
          const fwd = A.FWD * (rb.burst > 0 ? rb.pace : 1);
          const rate = Math.max(0.25, (d.speed + d.lateral) / 2);
          let t = Math.hypot(rb.x - d.x, rb.y - d.y) / rate;
          for (let i = 0; i < 2; i++) {
            tx = rb.x + rb.vx * Math.min(t, 20);      // his drift decays; cap the lead
            ty = Math.max(EZ, rb.y - fwd * t);
            t = Math.hypot(tx - d.x, ty - d.y) / rate;
          }
        }
        const dx = tx - d.x, dy = ty - d.y;
        const dist = Math.hypot(dx, dy) || 1;
        // While the burst is on they are still flowing to their own read.
        const flow = rb.burst > 0 ? g.flow : 1;
        d.x += (dx / dist) * d.lateral * flow; d.y += (dy / dist) * d.speed; d.frame += 0.2;
        if (rb.evade <= 0 && Math.hypot(rb.x - d.x, rb.y - d.y) < TACKLE_R) {
          if (rb.truck > 0) {
            // Committed to contact: run him over, or get stood up for a loss.
            // Trucking is for defenders in front of you — a man on your hip
            // is a spin, and taking him on squares you up badly.
            const square = 1 - Math.min(1, Math.abs(rb.x - d.x) / TACKLE_R);
            // Trucking is an interior move. Out on the edge you have no
            // leverage and nowhere to fall forward, so a bruiser who bounces
            // it outside has left his best tool at the hash — which is what
            // makes the gap a real choice for him and not just a formality.
            if (g.roll() < A.TRUCK * g.truckLane * (0.45 + 0.55 * square)) {
              d.stumble = A.STUMBLE * 1.5;
              rb.truck = 0; rb.stagger = 26;
              // You ran a man over. Of everything that happens out here this
              // is the one that has earned two frames of nothing.
              FX.hit((rb.x + d.x) / 2, (rb.y + d.y) / 2, 2.6);
              continue;
            }
            FX.hit((rb.x + d.x) / 2, (rb.y + d.y) / 2, 2.2);
            this.end('stuffed'); return;
          }
          if (rb.breakCd <= 0 && g.roll() < A.BREAK) {
            rb.breakCd = 80; rb.stagger = 22; d.stumble = A.STUMBLE;
            // Broken, not stopped: turf but no hold, or every play would stutter.
            FX.kick((rb.x + d.x) / 2, (rb.y + d.y) / 2, 7, 1.1);
            continue;
          }
          FX.kick((rb.x + d.x) / 2, (rb.y + d.y) / 2, 9, 1.2);
          this.end('tackled'); return;
        }
      }
      if (rb.y <= EZ) { this.end('td'); return; }
      // How close the nearest man is. Six distances a frame, and it is what
      // tells the renderer whether this is a run or a run away.
      let near = Infinity;
      for (const d of g.defenders) near = Math.min(near, Math.hypot(rb.x - d.x, rb.y - d.y));
      rb.alone = near;
      const want = eyeAt(rb.y, PLAY_EYE);
      if (g.camEase > 0) { g.camEase--; g.camY += (want - g.camY) * 0.22; }
      else g.camY = want;
    },
    render() {
      CAMERA.frame(g.rb ? g.rb.x : VW / 2, g.los);
      const ly = drawField(g.camY, g.los, g.marker);
      // Pre-snap the four gaps get tick marks on the line. They name the
      // lanes, they do not grade them — reading the bodies is the game.
      if (g.state === 'presnap' && ly > -2 && ly < VH + 2) {
        for (const l of LANES) {
          const lp = projectPoint(l.cx, g.los - g.camY);
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.fillRect(lp.x - 3 * lp.scale, ly - 7 * lp.scale, 6 * lp.scale, 1);
          ctx.fillStyle = 'rgba(255,255,255,0.30)';
          ctx.fillRect(lp.x, ly - 6 * lp.scale, 1, 5 * lp.scale);
        }
      }
      for (const d of g.defenders) {
        const sy = Math.round(d.y - g.camY);
        if (sy > -SPR && sy < VH + SPR)
          sprite(DEF20[Math.floor(d.stumble > 0 ? 1 : d.frame) % 3], Math.round(d.x) - HALF, sy - HALF,
            null, 0, null, { pose: d.stumble > 0 ? 'fall' : 'run', frame: d.frame });
      }
      // The rest of the huddle. They do not do anything on a carry, but the
      // field should not empty out just because you handed it off.
      setJersey(g.qbTeam || g.backTeam);
      sprite(RUN20[0], Math.round(g.qb.x) - HALF, Math.round(g.qb.y - g.camY) - HALF);
      setJersey(g.wrTeam || g.backTeam);
      sprite(RUN20[0], Math.round(g.wr.x) - HALF, Math.round(g.wr.y - g.camY) - HALF);
      // Set here rather than at pick time: inside a drive the pass play has
      // repainted the kit for its own two players since our last carry.
      setJersey(g.backTeam);
      const rb = g.rb, ry = Math.round(rb.y - g.camY);
      // Nobody within CLEAR is running away; it ramps over the next twenty so
      // the trail arrives with the daylight rather than snapping on.
      const loose = Math.max(0, Math.min(1, ((rb.alone || 0) - CLEAR) / 20));
      const rim = 0.3 + 0.45 * loose;
      if (rb.truck > 0) {
        for (let i = 2; i >= 1; i--) {
          ctx.globalAlpha = 0.10 * i;
          sprite(RUN20[Math.floor(rb.frame + i) % 3], Math.round(rb.x) - HALF, ry - HALF + i * 3);
        }
        ctx.globalAlpha = 1;
        rimmed(RUN20[Math.floor(rb.frame) % 3], Math.round(rb.x) - HALF, ry - HALF + 1, BALL20, 0, 0.6,
          { pose: 'truck', frame: rb.frame, dir: Math.sign(rb.vx), ball: true });
      } else if (rb.spin > 0) {
        const s = Math.floor((SPIN_LEN - rb.spin) / (SPIN_LEN / 4)) % 4;
        ctx.globalAlpha = 0.22;
        sprite(SPIN20[(s + 3) % 4], Math.round(rb.x - rb.spinDir * 4) - HALF, ry - HALF);
        ctx.globalAlpha = 1;
        rimmed(SPIN20[s], Math.round(rb.x) - HALF, ry - HALF, BALL20, SPIN_BALL_DX20[s], rim,
          { pose: s === 2 ? 'contact' : 'run', frame: s, dir: rb.spinDir, ball: true });
      } else {
        // The trail is the ground he has already covered, so it lies behind
        // him — downfield is up, which puts each image lower than the last.
        if (loose > 0) {
          for (let i = 3; i >= 1; i--) {
            ctx.globalAlpha = loose * 0.34 / i;
            const f = (((Math.floor(rb.frame) - i) % 3) + 3) % 3;
            sprite(RUN20[f], Math.round(rb.x - rb.vx * i * 1.6) - HALF, ry - HALF + i * 4);
          }
          ctx.globalAlpha = 1;
        }
        const visualPose = g.visual && g.visual.frames > 0
          ? (g.visual.kind === 'td' ? 'hero' : g.visual.frames > 17 ? 'contact' : 'fall') : 'run';
        if (g.visual && g.visual.frames > 0) g.visual.frames--;
        rimmed(RUN20[Math.floor(rb.frame) % 3], Math.round(rb.x) - HALF, ry - HALF, BALL20, 0, rim,
          { pose: visualPose, frame: rb.frame, dir: Math.sign(rb.vx), ball: true });
      }
      FX.draw(g.camY);
    },
    onUp(pt, dx, dy) {
      if (g.state === 'ready' || g.state === 'between' || g.state === 'td') { this.startDown(); return; }
      if (g.state === 'gameover') { this.reset(); g.state = 'select'; return; }
      if (g.state !== 'live') return;
      const rb = g.rb;
      // swipe up = truck. Distinct axis from the cut, so nothing collides.
      if (dy < -18 && Math.abs(dy) > Math.abs(dx)) {
        if (rb.truck <= 0 && rb.truckCd <= 0 && rb.spin <= 0) {
          rb.truck = TRUCK_LEN; rb.truckCd = TRUCK_LEN + TRUCK_CD;
        }
        return;
      }
      if (Math.abs(dx) > 18) { rb.vx += Math.sign(dx) * 1.9; return; }
      if (rb.truck > 0) return;
      if (rb.spin > 0 || rb.spinCd > 0) return;
      let near = null, nd = Infinity;
      for (const d of g.defenders) {
        if (d.stumble > 0) continue;
        const dist = Math.hypot(rb.x - d.x, rb.y - d.y);
        if (dist < nd) { nd = dist; near = d; }
      }
      rb.spin = SPIN_LEN; rb.spinCd = SPIN_LEN + SPIN_CD;
      rb.clean = !!near && nd < 30;
      // A spin beats a man you are about to meet. It used to be twenty-two
      // frames where the tackle check was skipped outright, granted on every
      // tap wherever you were, so in the open field it was a free escape with
      // no failure case. Now the frames are only earned by spinning into
      // contact, and how many you get is what Elusive buys.
      rb.evade = rb.clean ? Math.round(3 + 11 * A.ELU) : 0;
      rb.spinDir = near && nd < 56 ? (Math.sign(rb.x - near.x) || 1) : (Math.sign(rb.vx) || 1);
      if (rb.clean) for (const d of g.defenders)
        if (Math.hypot(rb.x - d.x, rb.y - d.y) < A.CONTACT + 10) d.stumble = A.STUMBLE;
    },
    score() { return { value: g.tds, tie: g.yards, detail: `${g.yards} yd` }; },
    status() {
      const t = Math.max(1, Math.round((g.los - EZ) / YARD));
      return `<span>DRIVE <b>${g.drive + 1}</b></span><span>DOWN <b>${g.down}</b></span>`
        + `<span>TO GO <b>${t}</b></span>`
        + (g.lane ? `<span>GAP <b>${g.lane.label.toUpperCase()}</b></span>` : '')
        + `<span class="sc">${g.tds} TD</span>`;
    },
    overlay(pick) {
      const t = Math.max(1, Math.round((g.los - EZ) / YARD));
      if (g.state === 'live' || g.state === 'presnap') return null;
      if (g.state === 'between') return { ttl: g.how === 'stuffed' ? 'Stood up' : 'Tackled', sub: `${yds(g.gain)} · ${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
      if (g.state === 'td') return { ttl: 'Touchdown', gold: true, sub: `${g.tds} on the day`, tap: 'tap to continue' };
      return { ttl: 'Turnover on downs', bad: true, sub: `${g.tds} TD · ${g.yards} total yards`, tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };
})();

// ===========================================================================
// GAME 2 — PASS
// ===========================================================================
const PASS_GAME = (() => {
  const SPR = 20, HALF = 10, CATCH_R = 11;
  /**
   * How far off the solved lead a tap can land and still be pulled onto it, at
   * average accuracy. About a fifth of the field's width — forgiving enough for
   * a thumb, tight enough that where you point is a real input.
   */
  /**
   * How far a tap can land from the solved lead and still be pulled onto it.
   *
   * 44, then 52, then 110. The middle step was too timid and the detour after
   * it was worse: replacing the coordinate with a direction did remove the
   * feeling of tracing the drawn route, but it capped a good throw at 85% and
   * put a post — a receiver breaking into obvious open grass — at 78%, when
   * the same throw under this model completes in the nineties. Precision was
   * never the thing to remove. Being punished for missing by a thumb's width
   * was, and the radius is the dial for that.
   *
   * Measured at a fixed miss, thousands of throws each. An 8px miss: 85% at
   * 52, 95% at 110. A 16px miss: 59% and 83%. A 24px miss: 38% and 59%. So a
   * throw that is roughly where it should be now lands, and one that is
   * genuinely wrong still does not — 32px out fails more often than not.
   *
   * 150 was tried. It takes a 24px miss to 70% and a 32px miss past a coin
   * flip, which is far enough that aiming stops meaning anything.
   */
  /**
   * How far a tap can land from the solved lead and still be pulled onto it.
   *
   * A thousand, which is larger than the field, and that is the honest shape
   * of the decision rather than a tuning accident: the throw now goes very
   * nearly where it should regardless of the thumb, and what is left of the
   * tap is a nudge. Five rounds of widening this from 44 never moved the
   * complaint, because the complaint was never about the width — it was that
   * aim was carrying the whole outcome and timing carried none of it.
   *
   * Measured as the spread each axis produces: at 110 it was 21% timing to
   * 79% aim, at 320 38/62, here 71/29. The rest of the way to pure timing is
   * available by raising it again — 2000 measures 90/10 — but a nudge that
   * still means something is the point.
   */
  const ASSIST = 1000;
  /**
   * How much more forgiving the sideways miss is than the one along the route.
   *
   * Three. Measured on the throw that exposed all of this — a post, thrown
   * early, tapped up and inside into the grass he is about to break into.
   * Round assist at this same radius completed it 28% of the time while the
   * identical throw tapped straight up the field completed 100%, which is the
   * whole complaint in two numbers. At three it is 90%, and every other throw
   * measured is within a couple of points of where it was.
   */
  const WIDE = 3;
  const SAMPLE_QB = 'J. Allen:BUF:0.96:0.68:0.88:0|C. Stroud:HOU:0.82:0.88:0.62:0|'
    + 'B. Purdy:SF:0.54:0.93:0.55:0|D. Maye:NE:0.78:0.72:0.74:0';
  // One of these shares a club with one of the passers, so the standalone
  // demo shows the chemistry bonus without a league behind it.
  const SAMPLE_WR = 'J. Chase:CIN:0.88:0.74:0.96:0|A. St. Brown:DET:0.60:0.90:0.88:0|'
    + 'N. Collins:HOU:0.72:0.82:0.84:0|B. Bowers:LV:0.54:0.84:0.78:0';
  const SHELL = mulberry32(hashSeed(SEED + '|shell'))() < 0.5
    ? { key: 'man', label: 'Man coverage', lag: 7, tight: 0.26 }
    : { key: 'zone', label: 'Zone coverage', lag: 15, tight: 0.17 };
  const ROUTES = {
    go: (t) => ({ x: 0, y: -t * 0.92 }),
    slant: (t, d) => (t < 34 ? { x: 0, y: -t * 0.86 } : { x: d * (t - 34) * 0.72, y: -(29 + (t - 34) * 0.58) }),
    out: (t, d) => (t < 52 ? { x: 0, y: -t * 0.86 } : { x: d * (t - 52) * 1.02, y: -(45 + (t - 52) * 0.22) }),
    post: (t, d) => (t < 66 ? { x: 0, y: -t * 0.92 } : { x: d * (t - 66) * 0.6, y: -(61 + (t - 66) * 0.78) }),
  };
  // Near the goal line the field compresses, so the concepts do too: quick
  // breaks and horizontal-working routes instead of vertical stems.
  const RED = {
    quick: (t, d) => (t < 16 ? { x: 0, y: -t * 0.86 } : { x: d * (t - 16) * 0.86, y: -(14 + (t - 16) * 0.44) }),
    fade: (t, d) => ({ x: d * t * 0.36, y: -t * 0.74 }),
    drag: (t, d) => (t < 12 ? { x: 0, y: -t * 0.8 } : { x: d * (t - 12) * 1.06, y: -(10 + (t - 12) * 0.14) }),
    flat: (t, d) => (t < 8 ? { x: 0, y: -t * 0.66 } : { x: d * (t - 8) * 1.18, y: -(5 + (t - 8) * 0.08) }),
  };
  /**
   * The frame each route comes open, and how long it stays that way.
   *
   * The corner chases a lagged copy of the receiver, which gave him the same
   * grip from the snap to the whistle — so separation never changed and the
   * throw window was the whole play. Completion across the entire window
   * measured 86 to 100%, which is another way of saying timing did nothing.
   *
   * He is sticky until the break, beaten for a beat at it, and back on the
   * route after. The skill is throwing early enough that the ball ARRIVES in
   * that beat, which is anticipation rather than reaction — and it is legible,
   * because you can watch him fall off and climb back on.

  const BREAK = { go: 44, slant: 34, out: 52, post: 66, quick: 16, drag: 12, flat: 8, fade: 38 };
  /** Frames of daylight after he breaks, before the corner is back on him. */

   * beats that shell, and it loosens the defender for the play.

  const EDGE = {
    slant: { man: 0.34, zone: -0.22 }, out: { man: 0.28, zone: -0.10 },
    go: { man: -0.06, zone: 0.32 }, post: { man: 0.04, zone: 0.30 },
    quick: { man: 0.30, zone: -0.18 }, drag: { man: 0.28, zone: -0.14 },
    fade: { man: -0.04, zone: 0.28 }, flat: { man: 0.20, zone: -0.06 },

   * going instead of where he is, and he comes out of the break a half-step

   * a real battery is a decision, not enough that it plays the game for you.

  const CHEM = { edge: 0.10, scatter: 0.84 };
  /** Daylight after the catch. Lower than the run game's — out here there are

  const YAC_CLEAR = 34;
  const MENU = ['slant', 'out', 'go', 'post'];
  const RED_MENU = ['quick', 'drag', 'fade', 'flat'];
  const LABEL = {
    slant: 'Slant', out: 'Out', go: 'Go', post: 'Post',
    quick: 'Quick', drag: 'Drag', fade: 'Fade', flat: 'Flat',

  /** Which of your two men the route asks the most of. A ball that has to
   *  travel is on the passer's arm; one won at the break is on the target's
