<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Arcade — mini games</title>
<style>
  :root { --gold: #e8c561; --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    /* The layout always fits the viewport, so nothing here needs to scroll or
       zoom. touch-action:none is absolute where `manipulation` still let iOS
       sneak a double-tap zoom through on fast repeated taps. */
    touch-action: none;
    height: 100%; overflow: hidden; background: #08090b; color: #e9e9ec;
    font-family: var(--mono);
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  #wrap {
    height: 100dvh; display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    align-items: center; justify-items: center; gap: 7px; padding: 8px 0;
  }
  #stage { align-self: center; }
  /* game switcher */
  #stage { position: relative; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;                   /* the field owns every gesture */
    background: #08090b; border: 1px solid rgba(255,255,255,0.08); display: block;
  }
  /* Type lives in the DOM so it renders at device resolution, not upscaled. */
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    pointer-events: none; text-align: center; padding: 0 18px;
    opacity: 0; transition: opacity .24s ease;
    background: radial-gradient(ellipse 72% 30% at 50% 50%,
      rgba(8,9,11,0.9) 0%, rgba(8,9,11,0.74) 45%, rgba(8,9,11,0) 100%);
  }
  #overlay.show { opacity: 1; }
  /* Pre-snap the scrim must sit behind the TEXT only — a tall gradient washes
     out the downfield players, which is most of what you need to read. */
  #overlay.presnap {
    justify-content: flex-start; padding-top: 12px;
    background: linear-gradient(180deg,
      rgba(8,9,11,0.95) 0%, rgba(8,9,11,0.86) 16%, rgba(8,9,11,0) 30%);
  }
  #overlay.presnap #ttl { font-size: 15px; }
  #ttl { font-size: 18px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #fbfbfd; }
  #ttl.gold { color: var(--gold); }
  #ttl.bad { color: #c96f6f; }
  #sub { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a8c92; }
  #tap { font-size: 8.5px; letter-spacing: 0.24em; text-transform: uppercase; color: #4a4c52; margin-top: 5px; }
  #attrs { display: none; flex-direction: column; gap: 5px; margin-top: 9px; }
  #attrs.show { display: flex; }
  .attr { display: flex; align-items: center; gap: 9px; }
  .attr .k { width: 62px; text-align: right; font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: #6d6f76; }
  .attr .bar { display: flex; gap: 2px; }
  .attr .seg { width: 7px; height: 7px; background: rgba(255,255,255,0.10); }
  .attr .seg.on { background: #e9e9ec; }
  .attr .lv {
    min-width: 84px; text-align: left; font-size: 8px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold);
  }

  /* Pre-snap route menu: choosing the concept is what snaps the ball. */
  #prompt {
    /* Anchored to the top: pre-snap the players are down by the line, and the
       alignment you're reading is the whole point of choosing a route. */
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 7px;
    padding: 14px 14px 0; text-align: center;
    background: linear-gradient(180deg,
      rgba(8,9,11,0.92) 0%, rgba(8,9,11,0.72) 34%, rgba(8,9,11,0) 58%);
  }
  #prompt.show { display: flex; }
  .prtitle {
    font-size: 10px; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--gold);
  }
  .prsub {
    font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #6d6f76; margin-bottom: 4px;
  }
  #propts { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 4px; }
  .prow { display: flex; align-items: center; gap: 6px; }
  .prlab {
    width: 34px; text-align: right; font-size: 8px; letter-spacing: 0.16em;
    text-transform: uppercase; color: #6d6f76;
  }
  .propt {
    padding: 9px 11px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #ececed; cursor: pointer; touch-action: manipulation;
    /* A row of four plus its label is the tightest thing on the screen; let
       them size to their text rather than squeezing "Edge L" onto two lines. */
    flex: none; white-space: nowrap;
  }
  .propt:active { background: rgba(255,255,255,0.12); }


  #picker {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 7px; padding: 0 14px;
    background: rgba(8,9,11,0.93); touch-action: manipulation;
  }
  #picker.show { display: flex; }
  /* How-to-play, shown once you've picked and before the first snap. */
  #brief {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 0 18px;
    background: rgba(8,9,11,0.94);
  }
  #brief.show { display: flex; }
  #blist { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
  .brow { display: flex; align-items: baseline; gap: 11px; }
  .brow .bk {
    min-width: 92px; text-align: right; font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold);
  }
  .brow .bv { font-size: 9.5px; letter-spacing: 0.1em; color: #b6b8be; }
  .brow.blv { margin-bottom: 4px; }
  .brow.blv .bk { color: #ececed; }
  .brow.blv .bv { color: var(--gold); font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; }
  .bstart {
    margin-top: 12px; font-size: 8.5px; letter-spacing: 0.24em;
    text-transform: uppercase; color: #4a4c52;
  }
  .ptitle { font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #fbfbfd; }
  .pfront { font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  #plist { display: flex; flex-direction: column; gap: 5px; width: 100%; max-width: 300px; }
  .pick {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    cursor: pointer; touch-action: manipulation;
  }
  .pick:hover, .pick:active { border-color: rgba(255,255,255,0.42); }
  .pick .pn { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #ececed; }
  .pick .ptrend {
    margin-left: 7px; font-size: 7px; font-weight: 400; letter-spacing: 0;
  }
  .pick .ptrend.up { color: #c9c9cf; }
  .pick .ptrend.down { color: #55575d; }
  .pick .pchip {
    display: inline-block; width: 5px; height: 5px; border-radius: 1px;
    margin-right: 6px; vertical-align: middle;
  }
  .pick .pt { display: block; font-size: 8px; letter-spacing: 0.18em; color: #6d6f76; text-transform: uppercase; margin-top: 4px; }
  .pick.chem { border-color: rgba(232,197,97,0.44); }
  .pick .pchem {
    margin-left: 7px; font-size: 7.5px; font-weight: 600; letter-spacing: 0.14em;
    color: var(--gold);
  }
  .pick .pbars { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
  .pick .pbar { display: flex; gap: 1px; }
  .pick .pseg { width: 5px; height: 4px; background: rgba(255,255,255,0.10); }
  .pick .pseg.on { background: #c9c9cf; }

  #status {
    display: flex; gap: 15px; align-items: baseline;
    font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #6d6f76;
  }
  #status b { color: #c9c9cf; font-weight: 600; }
  #status .sc { color: var(--gold); font-weight: 600; }
  /* The battery is live — shown as the club the two of them share. */
  #status .chem {
    color: var(--gold); font-weight: 600; letter-spacing: 0.14em;
    border: 1px solid rgba(232,197,97,0.42); border-radius: 3px; padding: 1px 4px;
  }
  #foot {
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; justify-content: center;
    font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  #hint { color: #46484e; }
  #sound { color: #46484e; cursor: pointer; letter-spacing: 0.18em; }
  #sound:active { color: #8f9199; }
  #build { color: #2e3035; }
</style>
</head>
<body>
<div id="wrap">
  <div id="status"></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="picker">
      <div class="ptitle" id="ptitle"></div>
      <div class="pfront" id="pfront"></div>
      <div id="plist"></div>
    </div>
    <div id="brief">
      <div class="ptitle" id="btitle"></div>
      <div id="blist"></div>
      <div class="bstart">tap to begin</div>
    </div>
    <div id="prompt">
      <div class="prtitle" id="prtitle"></div>
      <div class="prsub" id="prsub"></div>
      <div id="propts"></div>
    </div>
    <div id="overlay">
      <div id="ttl"></div><div id="sub"></div><div id="attrs"></div><div id="tap"></div>
    </div>
  </div>
  <div id="foot"><span id="sound" role="button" tabindex="0"></span><span id="hint"></span><span id="build"></span></div>
</div>
<script>
// ===========================================================================
// ARCADE — three mini games on one page.
// Shared: palette, sprites, seeded RNG, canvas fit, overlay/picker chrome.
// Each game supplies its own sim, render, input, and copy.
// ===========================================================================

const BUILD = 'arcade39-sound';
const VW = 180;
let VH = 260;
const SEED = new URLSearchParams(location.search).get('seed') || 'WK15';

const PAL = {
  '.': null,
  W: '#ffffff', L: '#c9c9cf', M: '#8f9199',
  G: '#7d8089', D: '#26282d', O: '#e8c561',
};

// ---- team jerseys --------------------------------------------------------
// Only the player you picked is coloured; defenders are the same sprite with
// W/L/M flattened to G, so they stay monochrome for free and your guy is the
// one coloured thing on the field.
//
// These are recognisable rather than accurate. Real primaries are frequently
// unusable here: the field is #08090b, so Raiders black, Ravens #241773 and
// Seahawks navy all vanish into it. Each team gets one identity colour held in
// a legible lightness band, kept clear of the defender grey and of the gold
// the ball and the live accent own. Teams never appear side by side — you only
// ever see your own — so two similar blues cost nothing.
const DEFAULT_KIT = { W: '#ffffff', L: '#c9c9cf', M: '#8f9199' };
const TEAM_JERSEY = {
  ARI: '#d9455f', ATL: '#e2515a', BAL: '#7b5ce0', BUF: '#4a86ee',
  CAR: '#3fb3e8', CHI: '#e8823f', CIN: '#f26a2e', CLE: '#b0793f',
  DAL: '#6e9ae0', DEN: '#ee6a32', DET: '#4faeee', GB:  '#45ae68',
  HOU: '#d8434f', IND: '#4f96ee', JAX: '#34afa6', KC:  '#ee4550',
  LAC: '#56c6ee', LAR: '#5a87ee', LV:  '#c6c9d0', MIA: '#35c4b8',
  MIN: '#8657e0', NE:  '#5a79c8', NO:  '#efe1ae', NYG: '#5a7be0',
  NYJ: '#3cb673', PHI: '#35948c', PIT: '#ebd69b', SEA: '#7fd34a',
  SF:  '#e2545a', TB:  '#dc4a32', TEN: '#46a6e0', WAS: '#b04a55',
};

const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => {
  const [ar, ag, ab] = hex2rgb(a), [br, bg, bb] = hex2rgb(b);
  return rgb2hex([ar + (br - ar) * t, ag + (bg - ag) * t, ab + (bb - ab) * t]);
};

const jerseyOf = (team) => TEAM_JERSEY[(team || '').toUpperCase()] || null;

/** Swap the three uniform tones. G (defenders), O (ball) and D (outline) are
 *  untouched, so nothing else on the field can be affected. */
function setJersey(team) {
  const base = jerseyOf(team);
  if (!base) { Object.assign(PAL, DEFAULT_KIT); return; }
  PAL.W = mix(base, '#ffffff', 0.38);   // highlight
  PAL.L = base;                          // the jersey
  PAL.M = mix(base, '#191b1f', 0.42);    // shadow, reads as the accent
}

// Named tiers, one ladder per attribute. The host sends a tier index and the
// names live here, so the query string stays short.
const TIER_NAMES = {
  run: [
    ['Plodder', 'Strider', 'Burst', 'Breakaway', 'Home Run'],
    ['Arm Tackle', 'Grinder', 'Bruiser', 'Battering Ram', 'Freight Train'],
    ['Stone Hands', 'Outlet', 'Mismatch', 'Weapon', 'Joystick'],
  ],
  pass: [
    ['Checkdown', 'Rhythm', 'Gunslinger', 'Cannon', 'Howitzer'],
    ['Scattershot', 'Steady', 'Sharp', 'Surgeon', 'Sniper'],
    ['Statue', 'Mobile', 'Escape Artist', 'Dual Threat', 'Houdini'],
  ],
  recv: [
    ['Possession', 'Chain Mover', 'Stretch', 'Deep Threat', 'Afterburner'],
    ['Bricks', 'Reliable', 'Sure Hands', 'Velcro', 'Glue'],
    ['Decoy', 'Option', 'Target', 'Focal Point', 'Alpha'],
  ],
  kick: [
    ['Short Range', 'Reliable', 'Big Leg', 'Cannon', 'Moon Shot'],
    ['Shaky', 'Steady', 'Automatic', 'Ice', 'Perfect'],
    ['Nervy', 'Composed', 'Cool', 'Clutch', 'Ice Water'],
  ],
};
const tierName = (param, i, tier) =>
  ((TIER_NAMES[param] || [])[i] || [])[Math.max(0, Math.min(4, tier))] || '';

// ---- seeded RNG ----------------------------------------------------------
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp01 = (v) => Math.max(0, Math.min(1, Number.isFinite(v) ? v : 0.5));

// ---- sprites -------------------------------------------------------------
const BODY32 = [
  '................................','................................',
  '..........DDDDDDDDDDDD..........','.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........','.........DWWWMMMMMMWWWD.........',
  '.........DWWWMMMMMMWWWD.........','.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........','.........DDWWWWWWWWWWDD.........',
  '...........DLLLLLLLLD...........','......DDDWWWWWWWWWWWWWWDDD......',
  '...DDDWWWWWWWWWWWWWWWWWWWWDDD...','...DWWWWWWWWWWWWWWWWWWWWWWWWD...',
  '...DWWWWWWWWWWWWWWWWWWWWWWWWD...','....DWWWWWWWWWWWWWWWWWWWWWWD....',
  '....DMWWWWWWWWWWWWWWWWWWWWMD....','.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....','.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....','.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '......DWWWWWWWWWWWWWWWWWWD......','......DWWWWWWWWWWWWWWWWWWD......',
  '.......DWWWWWWWWWWWWWWWWD.......','........DWWWWWWWWWWWWWWD........',
];
const LEGS32 = [
  ['.......DLLLLD......DLLLLD.......','.......DLLLLD......DLLLLD.......','......DLLLLD........DLLLLD......','......DLLLD..........DLLLD......','.....DLLLD............DLLLD.....','.....DDDDD............DDDDD.....'],
  ['..........DLLLLDDLLLLD..........','..........DLLLLDDLLLLD..........','..........DLLLLDDLLLLD..........','..........DLLLDDDLLLD...........','..........DLLDDDDDLLD...........','..........DDDDDDDDDDD...........'],
  ['.......DLLLLD......DLLLLD.......','......DLLLLD........DLLLLD......','......DLLLLD........DLLLLD......','.....DLLLD............DLLLD.....','....DLLLD..............DLLLD....','....DDDDD..............DDDDD....'],
];
const SIDE32 = [
  '................................','................................',
  '...........DDDDDDDDDD...........','..........DWWWWWWWWWWD..........',
  '..........DWWWWWWWWWWD..........','..........DWWWMMMMWWWD..........',
  '..........DWWWMMMMWWWD..........','..........DWWWWWWWWWWD..........',
  '..........DWWWWWWWWWWD..........','..........DDWWWWWWWWDD..........',
  '............DLLLLLLD............','........DDDWWWWWWWWWWDDD........',
  '.......DWWWWWWWWWWWWWWWWD.......','.......DWWWWWWWWWWWWWWWWD.......',
  '.......DWWWWWWWWWWWWWWWWD.......','........DWWWWWWWWWWWWWWD........',
  '........DMWWWWWWWWWWWWMD........','........DWWWWWWWWWWWWWWD........',
  '........DWWWWWMMMMWWWWWD........','........DWWWWWMMMMWWWWWD........',
  '........DWWWWWMMMMWWWWWD........','........DWWWWWWWWWWWWWWD........',
  '.........DWWWWWWWWWWWWD.........','.........DWWWWWWWWWWWWD.........',
  '..........DWWWWWWWWWWD..........','..........DWWWWWWWWWWD..........',
];
const FRONT32 = [
  '................................','................................',
  '..........DDDDDDDDDDDD..........','.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........','.........DWWDDDDDDDDWWD.........',
  '.........DWWDDDDDDDDWWD.........','.........DWWDDDDDDDDWWD.........',
  '.........DWWWWWWWWWWWWD.........','.........DDWWWWWWWWWWDD.........',
  '...........DLLLLLLLLD...........','......DDDWWWWWWWWWWWWWWDDD......',
  '...DDDWWWWWWWWWWWWWWWWWWWWDDD...','...DWWWWWWWWWWWWWWWWWWWWWWWWD...',
  '...DWWWWWWWWWWWWWWWWWWWWWWWWD...','....DWWWWWWWWWWWWWWWWWWWWWWD....',
  '....DMWWWWWWWWWWWWWWWWWWWWMD....','.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....','.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....','.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '......DWWWWWWWWWWWWWWWWWWD......','......DWWWWWWWWWWWWWWWWWWD......',
  '.......DWWWWWWWWWWWWWWWWD.......','........DWWWWWWWWWWWWWWD........',
];
const RUN32 = LEGS32.map((l) => [...BODY32, ...l]);
const DEF32 = RUN32.map((f) => f.map((r) => r.replace(/[WLM]/g, 'G')));
const PIVOT32 = LEGS32[1];
const SPIN32 = [[...BODY32, ...PIVOT32], [...SIDE32, ...PIVOT32], [...FRONT32, ...PIVOT32], [...SIDE32, ...PIVOT32]];
const SPIN_BALL_DX = [0, -9, -17, -7];
const BALL32 = [[18,27],[18,28],[19,26],[19,27],[19,28],[19,29],[20,26],[20,27],[20,28],[20,29],[21,27],[21,28]];

const BODY20 = [
  '....................','....................',
  '......DDDDDDDD......','.....DWWWWWWWWD.....','.....DWWWWWWWWD.....',
  '.....DWWMMMMWWD.....','.....DDWWWWWWDD.....','.......DLLLLD.......',
  '...DDWWWWWWWWWWDD...','..DWWWWWWWWWWWWWWD..','..DWWWWWWWWWWWWWWD..',
  '...DWWWWWWWWWWWWD...','...DWWWWMMMMWWWWD...','...DWWWWMMMMWWWWD...',
  '....DWWWWWWWWWWD....','.....DWWWWWWWWD.....',
];
const LEGS20 = [
  ['....DLLD....DLLD....','....DLLD....DLLD....','...DLLD......DLLD...','...DDD........DDD...'],
  ['......DLLDDLLD......','......DLLDDLLD......','......DLLDDLLD......','......DDDDDDD.......'],
  ['....DLLD....DLLD....','...DLLD......DLLD...','...DLLD......DLLD...','..DDD..........DDD..'],
];
// Turned sideways and turned away — the two halves of a spin, at the small
// scale the whole field now uses.
const SIDE20 = [
  '....................','....................',
  '.......DDDDDD.......','......DWWWWWWD......','......DWWWWWWD......',
  '......DWWMMWWD......','......DDWWWWDD......','........DLLD........',
  '....DDWWWWWWWWDD....','....DWWWWWWWWWWD....','....DWWWWWWWWWWD....',
  '.....DWWWWWWWWD.....','.....DWWMMMMWWD.....','.....DWWMMMMWWD.....',
  '.....DWWWWWWWWD.....','......DWWWWWWD......',
];
const FRONT20 = [
  '....................','....................',
  '......DDDDDDDD......','.....DWWWWWWWWD.....','.....DWWWWWWWWD.....',
  '.....DWDDDDDDWD.....','.....DDWWWWWWDD.....','.......DLLLLD.......',
  '...DDWWWWWWWWWWDD...','..DWWWWWWWWWWWWWWD..','..DWWWWWWWWWWWWWWD..',
  '...DWWWWWWWWWWWWD...','...DWWWWMMMMWWWWD...','...DWWWWMMMMWWWWD...',
  '....DWWWWWWWWWWD....','.....DWWWWWWWWD.....',
];
const RUN20 = LEGS20.map((l) => [...BODY20, ...l]);
const DEF20 = RUN20.map((f) => f.map((r) => r.replace(/[WLM]/g, 'G')));
const PIVOT20 = LEGS20[1];
const SPIN20 = [[...BODY20, ...PIVOT20], [...SIDE20, ...PIVOT20],
                [...FRONT20, ...PIVOT20], [...SIDE20, ...PIVOT20]];
const SPIN_BALL_DX20 = [0, -6, -11, -4];
const BALL20 = [[11, 16], [11, 17], [12, 15], [12, 16], [12, 17], [13, 16], [13, 17]];

// ---- sound ---------------------------------------------------------------
/**
 * Warm-synth cues on the moments that matter, and silence everywhere else.
 * Everything is generated — no files, in keeping with the rest of the page.
 *
 * The four numbers in TUNE are the ones that decide whether a chord lands as
 * music or as a doorbell, and they were set by ear in /audio-lab.html: dark,
 * dry and quick. Extensions rather than triads, and a few cents of detune per
 * note, do the rest. Nothing here fires on a routine play — a sound that
 * happens every down is a sound you turn off.
 */
const SOUND = (() => {
  const TUNE = { detune: 4, cutoff: 1300, attack: 86, reverb: 0.22 };
  const KEY = 'arcade:sound';
  const read = () => { try { return localStorage.getItem(KEY) !== 'off'; } catch { return true; } };
  let ctx = null, dry = null, send = null, on = read(), last = '';

  /** Reverb without an impulse file: decaying noise is a perfectly good room. */
  function impulse(seconds, decay) {
    const n = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** decay;
    }
    return buf;
  }

  /** Built on the first touch, never before: a context made without a gesture
   *  starts suspended and the first cue is lost. */
  function wake() {
    if (ctx || !on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch { return; }
    const master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    const verb = ctx.createConvolver(); verb.buffer = impulse(2.8, 2.4); verb.connect(master);
    dry = ctx.createGain(); dry.connect(master);
    send = ctx.createGain(); send.connect(verb);
  }

  function voice(freq, t0, dur, level, o = {}) {
    const cut = o.cutoff ?? TUNE.cutoff, atk = (o.attack ?? TUNE.attack) / 1000;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 0.6;
    lp.frequency.setValueAtTime(cut * 0.45, t0);
    lp.frequency.linearRampToValueAtTime(cut, t0 + atk + 0.15);
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(level, t0 + Math.max(0.005, atk));
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    lp.connect(amp);
    const wet = ctx.createGain(); wet.gain.value = o.reverb ?? TUNE.reverb;
    amp.connect(dry); amp.connect(wet); wet.connect(send);
    for (const cents of [-TUNE.detune, 0, TUNE.detune]) {
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth'; osc.frequency.value = freq; osc.detune.value = cents;
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(freq * o.slide, t0 + dur * 0.9);
      osc.connect(lp); osc.start(t0); osc.stop(t0 + dur + 0.1);
    }
  }

  /** The top of a chord, struck — a vibraphone, near enough. */
  function bell(freq, t0, dur, level) {
    const osc = ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = freq;
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(level, t0 + 0.012);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const trem = ctx.createGain(); trem.gain.value = 0.84;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 5.2;
    const amt = ctx.createGain(); amt.gain.value = 0.16;
    lfo.connect(amt); amt.connect(trem.gain);
    osc.connect(amp); amp.connect(trem);
    const wet = ctx.createGain(); wet.gain.value = TUNE.reverb;
    trem.connect(dry); trem.connect(wet); wet.connect(send);
    osc.start(t0); osc.stop(t0 + dur + 0.1);
    lfo.start(t0); lfo.stop(t0 + dur + 0.1);
  }

  const hz = (semi) => 440 * Math.pow(2, semi / 12);
  // Extensions, not triads. This table is the taste.
  const CHORD = {
    maj9: [0, 4, 7, 11, 14], add9: [0, 4, 7, 14], sus: [0, 5, 7, 14],
    min9: [0, 3, 7, 10, 14], minMaj7: [0, 3, 7, 11],
  };
  function chord(root, name, t0, dur, level, o = {}) {
    const ivs = CHORD[name];
    ivs.forEach((iv, i) => voice(hz(root + iv), t0 + i * (o.roll ?? 0.045), dur - i * 0.02, level, o));
    if (o.top) bell(hz(root + ivs[ivs.length - 1] + 12), t0 + 0.16, 1.6, 0.16);
  }

  const CUES = {
    td:    (t) => chord(-8, 'maj9', t, 3.4, 0.085, { top: true }),
    first: (t) => chord(-8, 'add9', t, 0.9, 0.05, { roll: 0.02, attack: 60 }),
    fg:    (t) => { chord(-10, 'sus', t, 1.1, 0.06, { roll: 0.03, attack: 90 });
                    chord(-8, 'add9', t + 0.42, 2.0, 0.07, { roll: 0.03 }); },
    xp:    (t) => chord(-8, 'add9', t, 0.6, 0.04, { roll: 0.015, attack: 40 }),
    int:   (t) => chord(-13, 'minMaj7', t, 2.6, 0.08, { slide: 0.94, roll: 0.02, cutoff: 1100 }),
    over:  (t) => chord(-20, 'min9', t, 3.0, 0.07, { roll: 0.06, attack: 300, cutoff: 900 }),
  };

  return {
    wake,
    get on() { return on; },
    toggle() {
      on = !on;
      try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch { /* private mode */ }
      if (on) wake();
      return on;
    },
    /** `tag` guards against the same finish being sounded twice by a repaint,
     *  the way reportScore already has to. */
    cue(name, tag) {
      if (!on || !CUES[name]) return;
      if (tag && tag === last) return;
      last = tag || '';
      wake();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      CUES[name](ctx.currentTime + 0.02);
    },
  };
})();

// ---- the field -----------------------------------------------------------
// One world, whatever the play. A ten-yard end zone so a throw has somewhere
// to land, twenty-one yards of drive in front of it, and room behind the line
// for a backfield. Both play types measure in the same yards from the same
// stripe, so the field looks identical however the ball moves.
const YARD = 16, EZ = 10 * YARD, DRIVE_YARDS = 21;
const WORLD_H = EZ + DRIVE_YARDS * YARD + 64;
const SNAP = WORLD_H - 64;              // the line on a fresh set of downs
const BACKFIELD = 44;                   // how far behind it the back sets up
const QB_DROP = 26;                     // and how deep the passer sets up

/** The grass, the stripes, the line and the chains — drawn once for everyone. */
function drawField(camY, los, marker) {
  yardLines(camY, WORLD_H, DRIVE_YARDS + 10, YARD);
  const gy = Math.round(EZ - camY);
  if (gy > -WORLD_H && gy < VH + 40) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(0, gy, VW, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.030)';
    ctx.fillRect(0, Math.max(0, gy - EZ), VW, Math.min(EZ, gy));
  }
  if (marker && marker > EZ) {
    const my = Math.round(marker - camY);
    if (my > -2 && my < VH + 2) {
      ctx.fillStyle = 'rgba(232,197,97,0.72)';
      ctx.fillRect(0, my, VW, 1);
    }
  }
  const ly = Math.round(los - camY);
  if (ly > -2 && ly < VH + 2) {
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    for (let x = 0; x < VW; x += 6) ctx.fillRect(x, ly, 3, 1);
  }
  return ly;
}

// ---- canvas --------------------------------------------------------------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CHROME = 96;
function fit() {
  const availW = Math.min(window.innerWidth - 12, 520);
  const availH = Math.max(220, window.innerHeight - CHROME);
  const scale = Math.max(1, Math.min(5, Math.floor(availW / VW)));
  VH = Math.max(180, Math.min(340, Math.floor(availH / scale)));
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW * scale + 'px';
  canvas.style.height = VH * scale + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fit);
fit();

function sprite(rows, px, py, ballPts, ballDx) {
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const c = PAL[row[x]];
      if (!c) continue;
      ctx.fillStyle = c; ctx.fillRect(px + x, py + y, 1, 1);
    }
  }
  if (ballPts) {
    // Dark halo first: gold on a gold-ish jersey would otherwise disappear.
    ctx.fillStyle = PAL.D;
    for (const [y, x] of ballPts) {
      const bx = px + x + (ballDx || 0), by = py + y;
      ctx.fillRect(bx - 1, by, 1, 1); ctx.fillRect(bx + 1, by, 1, 1);
      ctx.fillRect(bx, by - 1, 1, 1); ctx.fillRect(bx, by + 1, 1, 1);
    }
    ctx.fillStyle = PAL.O;
    for (const [y, x] of ballPts) ctx.fillRect(px + x + (ballDx || 0), py + y, 1, 1);
  }
}
function yardLines(camY, worldH, yards, yard) {
  ctx.fillStyle = '#08090b'; ctx.fillRect(0, 0, VW, VH);
  for (let i = 0; i <= yards; i++) {
    const sy = Math.round(worldH - i * yard - camY);
    if (sy < -2 || sy > VH + 2) continue;
    if (i % 5 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, sy, VW, 1); }
    else {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(VW / 2 - 14, sy, 5, 1); ctx.fillRect(VW / 2 + 9, sy, 5, 1);
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(2, 0, 1, VH); ctx.fillRect(VW - 3, 0, 1, VH);
}

// ---- the defense ---------------------------------------------------------
// One alignment, read once, whatever you call against it. The box is the run
// front and the pass rush; the corner is over the receiver and also sets that
// edge; the safety is the last man on both. Which of them can hurt you is the
// difference between the eight plays.
const FRONT = mulberry32(hashSeed(SEED + '|front'))() < 0.5
  ? { label: 'Stacked front', spread: 0.64 } : { label: 'Spread front', spread: 1.32 };

function defenders(rnd, drive, los) {
  const ramp = 1 + drive * 0.07, out = [];
  // The front used to be spaced purely off the line of scrimmage, which only
  // works with a whole field behind it: inside about five yards every
  // defender spawned past the end line and short yardage was an untouched
  // walk-in. Line up in the room that actually exists instead — the deep
  // help thins out, because getting to the stripe already beat it.
  const room = Math.max(26, los - EZ + 4);
  const standoff = Math.max(26, Math.min(74, room * 0.45));
  // Four deep. Thinning it out sounds like it should open the lanes and does
  // the opposite: lane spacing is VW / (n + 0.6), so fewer men stand wider
  // and cover the gaps more evenly. Measured, the interior went from 18% to
  // 32% stuffed when the deepest man was removed.
  const n = Math.max(1, Math.min(drive >= 2 ? 4 : 3,
    1 + Math.floor((room - standoff) / 44)));
  const gap = n > 1 ? Math.min(58, (room - standoff) / (n - 1)) : 0;
  // As the layers tighten the front also flattens across the width, so a
  // goal-line stand is a gap to find rather than a wall or a walk-in.
  const tight = Math.min(1, gap / 58);
  const lane = 52 * FRONT.spread * tight + (VW / (n + 0.6)) * (1 - tight);
  for (let i = 0; i < n; i++) {
    const x = VW / 2 + (i - (n - 1) / 2) * lane + Math.floor(rnd() * 14) - 7;
    // Someone is always on the ball. Without a man at the line every layer
    // was linebacker depth, first contact always happened past the stripe,
    // and a carry could not lose yardage no matter how badly it was read.
    const back = i === 0
      ? 6 + Math.floor(rnd() * 10)
      : standoff + (i - 1) * gap + Math.floor(rnd() * 26) * tight;
    out.push({
      x, y: Math.max(4, los - back),
      speed: (0.58 + rnd() * 0.28) * ramp, lateral: (0.46 + rnd() * 0.32) * ramp,
      stumble: 0, frame: rnd() * 3,
    });
  }
  return out;
}

/** The whole picture: box, corner over the receiver, safety over the top. */
function alignDefense(rnd, drive, los, wrX) {
  const ramp = 1 + drive * 0.07;
  return {
    front: defenders(rnd, drive, los),
    cb: { x: wrX + (rnd() * 6 - 3), y: los - 15 - rnd() * 5, frame: rnd() * 3, contain: true,
          speed: (0.54 + rnd() * 0.24) * ramp, lateral: (0.44 + rnd() * 0.28) * ramp, stumble: 0 },
    // A free safety plays deep. At six yards he was a fourth linebacker on
    // runs and a man every deep throw simply flew over.
    safety: { x: VW / 2 + (rnd() * 34 - 17), y: Math.max(EZ + 8, los - 160), frame: 0,
              speed: (0.50 + rnd() * 0.22) * ramp, lateral: (0.40 + rnd() * 0.24) * ramp, stumble: 0 },
  };
}

/** Where the eleven of them line up. The receiver's side is information: the
 *  corner is over there, so that edge is the harder one to get to. */
function alignOffense(rnd, los) {
  // The passer takes a drop and the back sets up alongside him. Both numbers
  // are pocket depth, not decoration: with a man on the ball, a passer at
  // los + 6 is inside the sack radius before the play has started.
  return { wrX: rnd() < 0.5 ? 44 : VW - 44, qb: { x: VW / 2, y: los + QB_DROP } };
}

// ===========================================================================
// GAME 1 — RUN
// ===========================================================================
const RUN_GAME = (() => {
  // Small scale, matching the pass game — one camera for the whole sport.
  // Field distances (tackle radius, contact, the front's spacing) are in
  // yards, not sprite widths, so they do not scale with the artwork: at 32px
  // a tackle at 17px looked like the defender standing inside the runner, and
  // at 20px it reads as the collision it always was.
  const SPR = 20, HALF = 10;
  const SPIN_LEN = 30, SPIN_CD = 34, SPIN_IF = 8, TACKLE_R = 17;
  const TRUCK_LEN = 24, TRUCK_CD = 46;
  const SAMPLE = 'J. Gibbs:DET:0.86:0.38:0.90|D. Henry:BAL:0.62:0.96:0.18|'
    + 'B. Robinson:ATL:0.78:0.70:0.62|T. Bigsby:JAX:0.66:0.58:0.34';
  /**
   * The pre-snap read. The front is already drawn before the play starts —
   * this just lets you aim at the part of it that is empty. Two widths of
   * gap: the interior is a short trip into likely contact, the edge is a
   * long one that pays if you get there. Which suits you is the second half
   * of the read, and that half is your back.
   */
  const LANE_W = VW / 4;
  const LANES = [
    { key: 'el', label: 'Edge L', cx: Math.round(VW * 0.17), edge: true },
    { key: 'il', label: 'Mid L', cx: Math.round(VW * 0.40), edge: false },
    { key: 'ir', label: 'Mid R', cx: Math.round(VW * 0.60), edge: false },
    { key: 'er', label: 'Edge R', cx: Math.round(VW * 0.83), edge: true },
  ];

  let A = {}, g = null;
  function setAttrs(p) {
    A = {
      FWD: 0.82 + 0.24 * p.a, BREAK: 0.05 + 0.30 * p.b,
      CONTACT: 32 + 18 * p.c, STUMBLE: 78 + 46 * p.c,
      // Trucking is POWER made active: a bruiser runs through people, a
      // scatback who tries it gets stopped cold.
      TRUCK: 0.40 + 0.55 * p.b,
      SPD: p.a, PWR: p.b, ELU: p.c,
    };
  }
  return {
    key: 'run', label: 'Run', pickTitle: 'Choose your back',
    shell: FRONT.label, attrLabels: ['Speed', 'Power', 'Elusive'],
    hint: 'pick a gap · swipe ← → cut · ↑ truck · tap spin',
    controls: [['Pick a gap', 'read the front before the snap'],
               ['Edge', 'a burner’s gap — big if you get there'],
               ['Mid', 'a bruiser’s gap — short trip, expect contact'],
               ['Swipe ← →', 'cut left or right'], ['Tap', 'spin — time it into contact'],
               ['Swipe ↑', 'truck — power runs through, speed gets stopped'],
               ['Goal', 'four downs to reach the end zone']],
    roster: parseRoster('run', SAMPLE),
    reset() {
      g = { rnd: mulberry32(hashSeed(SEED)), roll: mulberry32(hashSeed(SEED + '|r')),
            drive: 0, down: 1, los: SNAP, tds: 0, yards: 0, gain: 0, state: 'select' };
      this.g = g;
    },
    // Attributes without a play. A drive sets these once and then asks for
    // carries one at a time.
    attach(p) { setAttrs(p); g.backTeam = p.team; },
    /** A drive tells the run engine who else is on the field, so the kits are
     *  right when the whole huddle is drawn. */
    mates(qbTeam, wrTeam) { g.qbTeam = qbTeam; g.wrTeam = wrTeam; },
    choose(p) { this.attach(p); this.startDown(); },
    /** Line up a single carry this many yards from the goal line. A drive
     *  hands over the alignment it already showed you; standalone play makes
     *  its own. */
    startAt(losYards, driveNo, set) {
      g.los = EZ + Math.round(losYards * YARD);
      g.drive = driveNo || 0;
      this.startDown(set);
    },
    outcome() { return { kind: g.how, gain: g.gain }; },
    startDown(set) {
      const off = (set && set.off) || alignOffense(g.rnd, g.los);
      const D = (set && set.def) || alignDefense(g.rnd, g.drive, g.los, off.wrX);
      g.rb = { x: VW / 2, y: g.los + BACKFIELD, vx: 0, frame: 0, spin: 0, spinCd: 0, spinDir: 1,
               clean: false, breakCd: 0, stagger: 0, truck: 0, truckCd: 0,
               burst: 0, pace: 1 };
      g.qb = off.qb; g.wrX = off.wrX;
      g.wr = { x: off.wrX, y: g.los - 2, frame: 0 };   // on the line, clear of the corner
      // Everyone pursues, including the corner — so the side the receiver is
      // lined up on is the harder edge to take.
      g.defenders = [...D.front, D.cb, D.safety];
      // Gains are measured from the line, not from where he lined up, so
      // getting caught in the backfield is a loss.
      g.startY = g.los;
      g.lane = null; g.flow = 1; g.truckLane = 1;
      g.camY = Math.max(0, Math.min(WORLD_H - VH, g.los - VH * 0.66));
      // The front is set but frozen: this is where you get to look at it.
      g.state = 'presnap';
    },
    /** Pre-snap: the gap choice is the snap. */
    prompt() {
      if (g.state !== 'presnap') return null;
      return {
        title: FRONT.label,
        sub: 'pick your gap',
        options: LANES.map((l) => ({ key: l.key, label: l.label, cx: l.cx })),
      };
    },
    pickOption(key) {
      const lane = LANES.find((l) => l.key === key) || LANES[1];
      const rb = g.rb;
      g.lane = lane;
      // How much of the front is sitting in the gap you asked for. Shallow
      // defenders count for more — a man on the line kills the play long
      // before the deep help ever has to make a decision.
      let load = 0;
      for (const d of g.defenders) {
        const dx = Math.abs(d.x - lane.cx);
        if (dx >= LANE_W) continue;
        const shallow = 1 - Math.min(1, (g.los - d.y) / 90);
        load += (1 - dx / LANE_W) * (0.55 + 0.75 * shallow);
      }
      // Elusiveness softens a bad read. That is what elusive means: you are
      // the back who survives running into the wrong gap.
      const clean = Math.max(0, Math.min(1, 1 - load * (1 - 0.30 * A.ELU)));
      // The gap has to suit the carrier too — the edge belongs to a burner,
      // the interior to whoever can live in there.
      const fit = lane.edge ? A.SPD : A.PWR;
      // Beat them to the spot and they cannot flow to it: pursuit loses its
      // lateral bite for as long as the burst lasts.
      g.flow = 1 - 0.26 * clean * (0.5 + 0.5 * fit);
      // Trucking is for a man you chose to meet. Out on the edge you have no
      // leverage, and in a gap you misread you are not running through one
      // defender, you are running into three — so the read decides whether
      // your best tool is available at all.
      // The floor is higher inside than it was. With a corner and a safety
      // on the field every lane reads busier, and a truck rate scaled off
      // that was quietly taking the bruiser's only tool away from him.
      g.truckLane = lane.edge ? 0.45 * (0.5 + 0.5 * clean) : 0.68 + 0.32 * clean;
      rb.burst = Math.round((lane.edge ? 34 : 30) * (0.45 + 0.55 * clean) * (0.35 + 0.95 * fit));
      // Working east-west costs you downfield, and costs a slow back more.
      // Straight ahead is the opposite trade: from the backfield an interior
      // run is downhill by the time it reaches the line, and the man who can
      // carry that speed into contact is the one built for it.
      rb.pace = lane.edge ? 0.66 + 0.26 * A.SPD : 1 + 0.16 * A.PWR;
      g.state = 'live';
    },
    end(kind) {
      g.how = kind;
      g.gain = Math.round((g.startY - g.rb.y) / YARD);
      g.yards += g.gain;
      if (kind === 'td') { g.tds++; g.drive++; g.down = 1; g.los = SNAP; g.state = 'td'; }
      else if (g.down >= 4) g.state = 'gameover';
      else { g.down++; g.los = g.rb.y; g.state = 'between'; }
    },
    step() {
      if (g.state !== 'live') return;
      const rb = g.rb;
      if (rb.spinCd > 0) rb.spinCd--;
      if (rb.breakCd > 0) rb.breakCd--;
      if (rb.stagger > 0) rb.stagger--;
      if (rb.truckCd > 0) rb.truckCd--;
      // Getting to the gap you called. Steering, not teleporting — you can
      // still cut out of it, and a long edge run is visibly a long trip.
      if (rb.burst > 0) {
        rb.burst--;
        const dx = g.lane.cx - rb.x;
        if (Math.abs(dx) > 3) rb.vx += Math.sign(dx) * 0.34;
      }
      if (rb.truck > 0) {
        rb.y -= A.FWD * 1.42;                    // lowered shoulder, straight ahead
        rb.x += rb.vx * 0.4;
        rb.vx *= 0.6;
        rb.frame += 0.3;
        rb.truck--;
        if (rb.truck === 0) rb.stagger = 14;     // and it costs you afterwards
      } else if (rb.spin > 0) {
        const p = rb.spin / SPIN_LEN;
        rb.x += rb.spinDir * 2.9 * p;
        rb.y -= rb.clean ? A.FWD : A.FWD * 0.45;
        rb.vx *= 0.7; rb.spin--;
      } else {
        const pace = rb.burst > 0 ? rb.pace : 1;
        rb.y -= (rb.stagger > 0 ? A.FWD * 0.42 : A.FWD) * pace;
        rb.x += rb.vx; rb.vx *= 0.86;
        rb.frame += rb.stagger > 0 ? 0.12 : 0.22;
      }
      rb.x = Math.max(12, Math.min(VW - 12, rb.x));
      for (const d of g.defenders) {
        if (d.stumble > 0) { d.stumble--; continue; }
        // A corner plays his side. He is in the picture you read either way,
        // which is what makes the receiver's edge the harder one — but he
        // does not come chasing a carry to the far hash.
        if (d.contain && Math.sign(rb.x - VW / 2) !== Math.sign(d.x - VW / 2)) {
          d.frame += 0.08; continue;
        }
        const dx = (rb.x + rb.vx * 8) - d.x, dy = rb.y - d.y;
        const dist = Math.hypot(dx, dy) || 1;
        // While the burst is on they are still flowing to their own read.
        const flow = rb.burst > 0 ? g.flow : 1;
        d.x += (dx / dist) * d.lateral * flow; d.y += (dy / dist) * d.speed; d.frame += 0.2;
        if (rb.spin <= SPIN_IF && Math.hypot(rb.x - d.x, rb.y - d.y) < TACKLE_R) {
          if (rb.truck > 0) {
            // Committed to contact: run him over, or get stood up for a loss.
            // Trucking is for defenders in front of you — a man on your hip
            // is a spin, and taking him on squares you up badly.
            const square = 1 - Math.min(1, Math.abs(rb.x - d.x) / TACKLE_R);
            // Trucking is an interior move. Out on the edge you have no
            // leverage and nowhere to fall forward, so a bruiser who bounces
            // it outside has left his best tool at the hash — which is what
            // makes the gap a real choice for him and not just a formality.
            if (g.roll() < A.TRUCK * g.truckLane * (0.45 + 0.55 * square)) {
              d.stumble = A.STUMBLE * 1.5;
              rb.truck = 0; rb.stagger = 26;
              continue;
            }
            this.end('stuffed'); return;
          }
          if (rb.breakCd <= 0 && g.roll() < A.BREAK) {
            rb.breakCd = 80; rb.stagger = 22; d.stumble = A.STUMBLE; continue;
          }
          this.end('tackled'); return;
        }
      }
      if (rb.y <= EZ) { this.end('td'); return; }
      g.camY = Math.max(0, Math.min(WORLD_H - VH, rb.y - VH * 0.66));
    },
    render() {
      const ly = drawField(g.camY, g.los, g.marker);
      // Pre-snap the four gaps get tick marks on the line. They name the
      // lanes, they do not grade them — reading the bodies is the game.
      if (g.state === 'presnap' && ly > -2 && ly < VH + 2) {
        for (const l of LANES) {
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.fillRect(l.cx - 3, ly - 9, 7, 1);
          ctx.fillStyle = 'rgba(255,255,255,0.30)';
          ctx.fillRect(l.cx, ly - 8, 1, 7);
        }
      }
      for (const d of g.defenders) {
        const sy = Math.round(d.y - g.camY);
        if (sy > -SPR && sy < VH + SPR)
          sprite(DEF20[Math.floor(d.stumble > 0 ? 1 : d.frame) % 3], Math.round(d.x) - HALF, sy - HALF);
      }
      // The rest of the huddle. They do not do anything on a carry, but the
      // field should not empty out just because you handed it off.
      setJersey(g.qbTeam || g.backTeam);
      sprite(RUN20[0], Math.round(g.qb.x) - HALF, Math.round(g.qb.y - g.camY) - HALF);
      setJersey(g.wrTeam || g.backTeam);
      sprite(RUN20[0], Math.round(g.wr.x) - HALF, Math.round(g.wr.y - g.camY) - HALF);
      // Set here rather than at pick time: inside a drive the pass play has
      // repainted the kit for its own two players since our last carry.
      setJersey(g.backTeam);
      const rb = g.rb, ry = Math.round(rb.y - g.camY);
      if (rb.truck > 0) {
        for (let i = 2; i >= 1; i--) {
          ctx.globalAlpha = 0.10 * i;
          sprite(RUN20[Math.floor(rb.frame + i) % 3], Math.round(rb.x) - HALF, ry - HALF + i * 3);
        }
        ctx.globalAlpha = 1;
        sprite(RUN20[Math.floor(rb.frame) % 3], Math.round(rb.x) - HALF, ry - HALF + 1, BALL20, 0);
      } else if (rb.spin > 0) {
        const s = Math.floor((SPIN_LEN - rb.spin) / (SPIN_LEN / 4)) % 4;
        ctx.globalAlpha = 0.22;
        sprite(SPIN20[(s + 3) % 4], Math.round(rb.x - rb.spinDir * 4) - HALF, ry - HALF);
        ctx.globalAlpha = 1;
        sprite(SPIN20[s], Math.round(rb.x) - HALF, ry - HALF, BALL20, SPIN_BALL_DX20[s]);
      } else {
        sprite(RUN20[Math.floor(rb.frame) % 3], Math.round(rb.x) - HALF, ry - HALF, BALL20, 0);
      }
    },
    onUp(pt, dx, dy) {
      if (g.state === 'ready' || g.state === 'between' || g.state === 'td') { this.startDown(); return; }
      if (g.state === 'gameover') { this.reset(); g.state = 'select'; return; }
      if (g.state !== 'live') return;
      const rb = g.rb;
      // swipe up = truck. Distinct axis from the cut, so nothing collides.
      if (dy < -18 && Math.abs(dy) > Math.abs(dx)) {
        if (rb.truck <= 0 && rb.truckCd <= 0 && rb.spin <= 0) {
          rb.truck = TRUCK_LEN; rb.truckCd = TRUCK_LEN + TRUCK_CD;
        }
        return;
      }
      if (Math.abs(dx) > 18) { rb.vx += Math.sign(dx) * 1.9; return; }
      if (rb.truck > 0) return;
      if (rb.spin > 0 || rb.spinCd > 0) return;
      let near = null, nd = Infinity;
      for (const d of g.defenders) {
        if (d.stumble > 0) continue;
        const dist = Math.hypot(rb.x - d.x, rb.y - d.y);
        if (dist < nd) { nd = dist; near = d; }
      }
      rb.spin = SPIN_LEN; rb.spinCd = SPIN_LEN + SPIN_CD;
      rb.clean = !!near && nd < A.CONTACT;
      rb.spinDir = near && nd < 56 ? (Math.sign(rb.x - near.x) || 1) : (Math.sign(rb.vx) || 1);
      if (rb.clean) for (const d of g.defenders)
        if (Math.hypot(rb.x - d.x, rb.y - d.y) < A.CONTACT + 10) d.stumble = A.STUMBLE;
    },
    score() { return { value: g.tds, tie: g.yards, detail: `${g.yards} yd` }; },
    status() {
      const t = Math.max(1, Math.round((g.los - EZ) / YARD));
      return `<span>DRIVE <b>${g.drive + 1}</b></span><span>DOWN <b>${g.down}</b></span>`
        + `<span>TO GO <b>${t}</b></span>`
        + (g.lane ? `<span>GAP <b>${g.lane.label.toUpperCase()}</b></span>` : '')
        + `<span class="sc">${g.tds} TD</span>`;
    },
    overlay(pick) {
      const t = Math.max(1, Math.round((g.los - EZ) / YARD));
      if (g.state === 'live' || g.state === 'presnap') return null;
      if (g.state === 'between') return { ttl: g.how === 'stuffed' ? 'Stood up' : 'Tackled', sub: `${yds(g.gain)} · ${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
      if (g.state === 'td') return { ttl: 'Touchdown', gold: true, sub: `${g.tds} on the day`, tap: 'tap to continue' };
      return { ttl: 'Turnover on downs', bad: true, sub: `${g.tds} TD · ${g.yards} total yards`, tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };
})();

// ===========================================================================
// GAME 2 — PASS
// ===========================================================================
const PASS_GAME = (() => {
  const SPR = 20, HALF = 10, CATCH_R = 11;
  const SAMPLE_QB = 'J. Allen:BUF:0.96:0.68:0.88:0|C. Stroud:HOU:0.82:0.88:0.62:0|'
    + 'B. Purdy:SF:0.54:0.93:0.55:0|D. Maye:NE:0.78:0.72:0.74:0';
  // One of these shares a club with one of the passers, so the standalone
  // demo shows the chemistry bonus without a league behind it.
  const SAMPLE_WR = 'J. Chase:CIN:0.88:0.74:0.96:0|A. St. Brown:DET:0.60:0.90:0.88:0|'
    + 'N. Collins:HOU:0.72:0.82:0.84:0|B. Bowers:LV:0.54:0.84:0.78:0';
  const SHELL = mulberry32(hashSeed(SEED + '|shell'))() < 0.5
    ? { key: 'man', label: 'Man coverage', lag: 7, tight: 0.26 }
    : { key: 'zone', label: 'Zone coverage', lag: 15, tight: 0.17 };
  const ROUTES = {
    go: (t) => ({ x: 0, y: -t * 0.92 }),
    slant: (t, d) => (t < 34 ? { x: 0, y: -t * 0.86 } : { x: d * (t - 34) * 0.72, y: -(29 + (t - 34) * 0.58) }),
    out: (t, d) => (t < 52 ? { x: 0, y: -t * 0.86 } : { x: d * (t - 52) * 1.02, y: -(45 + (t - 52) * 0.22) }),
    post: (t, d) => (t < 66 ? { x: 0, y: -t * 0.92 } : { x: d * (t - 66) * 0.6, y: -(61 + (t - 66) * 0.78) }),
  };
  // Near the goal line the field compresses, so the concepts do too: quick
  // breaks and horizontal-working routes instead of vertical stems.
  const RED = {
    quick: (t, d) => (t < 16 ? { x: 0, y: -t * 0.86 } : { x: d * (t - 16) * 0.86, y: -(14 + (t - 16) * 0.44) }),
    fade: (t, d) => ({ x: d * t * 0.36, y: -t * 0.74 }),
    drag: (t, d) => (t < 12 ? { x: 0, y: -t * 0.8 } : { x: d * (t - 12) * 1.06, y: -(10 + (t - 12) * 0.14) }),
    flat: (t, d) => (t < 8 ? { x: 0, y: -t * 0.66 } : { x: d * (t - 8) * 1.18, y: -(5 + (t - 8) * 0.08) }),
  };
  /**
   * The pre-snap read. Man coverage trails the route, so a break wins; zone
   * sits in an area, so you go over the top of it. Positive means the route
   * beats that shell, and it loosens the defender for the play.
   */
  const EDGE = {
    slant: { man: 0.34, zone: -0.22 }, out: { man: 0.28, zone: -0.10 },
    go: { man: -0.06, zone: 0.32 }, post: { man: 0.04, zone: 0.30 },
    quick: { man: 0.30, zone: -0.18 }, drag: { man: 0.28, zone: -0.14 },
    fade: { man: -0.04, zone: 0.28 }, flat: { man: 0.20, zone: -0.06 },
  };
  /**
   * Chemistry. A passer and a receiver who actually play together on Sunday
   * have thrown this route a thousand times: the ball arrives where he is
   * going instead of where he is, and he comes out of the break a half-step
   * freer. Worth a little more than one attribute tier — enough that stacking
   * a real battery is a decision, not enough that it plays the game for you.
   */
  const CHEM = { edge: 0.10, scatter: 0.84 };
  const MENU = ['slant', 'out', 'go', 'post'];
  const RED_MENU = ['quick', 'drag', 'fade', 'flat'];
  const LABEL = {
    slant: 'Slant', out: 'Out', go: 'Go', post: 'Post',
    quick: 'Quick', drag: 'Drag', fade: 'Fade', flat: 'Flat',
  };
  const BOOK = (r) => (r.red ? RED : ROUTES);

  let A = {}, W = {}, g = null;
  // The receiver's speed rating stretches the route clock, so a burner is
  // further along his stem at the same instant.
  // Clamped to the field here, not at the call site: the lead prediction and
  // the receiver have to agree, or a route working toward the sideline aims
  // the ball somewhere he is not allowed to be.
  const at = (r, t) => {
    const o = BOOK(r)[r.route](Math.max(0, t) * r.speed, r.dir);
    return {
      x: Math.max(10, Math.min(VW - 10, r.sx + o.x)),
      y: Math.max(14, r.sy + o.y),
    };
  };

  return {
    key: 'pass', label: 'Pass',
    pickTitle: 'Choose your passer', pickTitle2: 'Choose your target',
    shell: SHELL.label, attrLabels: ['Arm', 'Accuracy', 'Escape'],
    attrLabels2: ['Speed', 'Hands', 'Route'],
    hint: 'pick a route · tap to throw',
    controls: [['Pick a route', 'beat the coverage before the snap'],
               ['Man coverage', 'breaks win — slant, out, drag'],
               ['Zone coverage', 'go over the top — go, post, fade'],
               ['Tap', 'throw — the ball leads him'],
               ['Careful', 'an interception ends the run']],
    roster: parseRoster('pass', SAMPLE_QB),
    roster2: parseRoster('recv', SAMPLE_WR),
    chemPair: [0, 1],
    reset() {
      g = { rnd: mulberry32(hashSeed(SEED)), roll: mulberry32(hashSeed(SEED + '|r')),
            drive: 0, down: 1, los: SNAP, marker: SNAP - 10 * YARD,
            tds: 0, comp: 0, att: 0, yards: 0, gain: 0, firstDown: false,
            result: '', state: 'select', t: 0, wr: null, rushers: [], ball: null, edge: 0 };
      this.g = g;
    },
    /** Stage one: the passer. Stays in select so the target can be picked. */
    choose(p) {
      // The rush has to actually arrive. At the old rate two men needed ~110
      // frames to cover the last stretch to a passer who had already thrown
      // by 100, so a dropback carried no risk at all and Escape did nothing.
      A = { V: 2.1 + 2.0 * p.a, SCATTER: 4 + 14 * (1 - p.b), RUSH: 0.52 - 0.22 * p.c };
      g.qbTeam = p.team;
    },
    /** Stage two: the target. Sharing a club with the passer is the bonus. */
    mate(backTeam) { g.backTeam = backTeam; },
    attach2(p) {
      W = { SPEED: 0.86 + 0.30 * p.a, HANDS: p.b, ROUTE: p.c };
      g.wrTeam = p.team;
      g.chem = !!(p.team && p.team === g.qbTeam);
    },
    choose2(p) { this.attach2(p); this.setup(); },
    /** Line up a single snap this many yards from the goal line. */
    startAt(losYards, set) {
      g.los = EZ + Math.round(losYards * YARD);
      g.marker = this.lineToGain(g.los);
      this.setup(set);
    },
    outcome() { return { kind: g.result, gain: g.gain }; },
    setup(set) {
      const rnd = g.rnd;
      const red = (g.los - EZ) < 13 * YARD;          // goal-to-go territory
      const off = (set && set.off) || alignOffense(rnd, g.los);
      const D = (set && set.def) || alignDefense(rnd, g.drive, g.los, off.wrX);
      const sx = off.wrX;
      g.red = red;
      g.wr = {
        sx, sy: g.los - 8, x: sx, y: g.los - 8, dir: 1, route: null, red,
        hist: [], frame: rnd() * 3, speed: W.SPEED,
        db: D.cb,
      };
      // The box comes after the passer; the deepest of them cannot, so he
      // drops off. Same bodies you read before the snap either way.
      g.rushers = D.front.slice(0, 2);
      g.safety = D.safety;
      g.qb = off.qb;
      g.rb = { x: VW / 2 - 16, y: g.los + BACKFIELD, frame: 0 };
      g.ball = null; g.t = 0; g.edge = 0;
      g.camY = Math.max(0, Math.min(WORLD_H - VH, g.los - VH * 0.66));
      g.state = 'ready';
    },
    /** Which way a route breaks, given where the receiver lined up. Inside
     *  breaks work back to the middle, outside breaks to the sideline. Known
     *  before the snap, so the play buttons can draw it the right way round. */
    routeDir(route) {
      const toCenter = g.wr.sx < VW / 2 ? 1 : -1;
      const outside = route === 'out' || route === 'flat' || route === 'fade';
      return toCenter * (outside ? -1 : 1);
    },
    /** Pre-snap: the route choice is the snap. */
    prompt() {
      if (g.state !== 'ready') return null;
      return {
        title: SHELL.label,
        sub: 'pick the route',
        options: (g.red ? RED_MENU : MENU).map((k) => ({ key: k, label: LABEL[k] })),
      };
    },
    pickOption(route) {
      const r = g.wr;
      r.route = route;
      r.dir = this.routeDir(route);
      const edge = (EDGE[route] || {})[SHELL.key] ?? 0;
      // A real route runner earns separation on top of the concept itself,
      // and a familiar battery earns a little more.
      const chem = g.chem ? CHEM.edge : 0;
      g.edge = Math.max(-0.4, Math.min(0.6, edge + (W.ROUTE - 0.5) * 0.3 + chem));
      g.t = 0;
      g.state = 'live';
    },
    /** Ten yards ahead, or the goal line once you are inside it. */
    lineToGain(from) { return Math.max(EZ, from - 10 * YARD); },
    end(kind, gain) {
      g.result = kind; g.gain = Math.round(gain / YARD);
      g.yards += Math.max(0, g.gain);
      g.firstDown = false;
      if (kind === 'td') {
        g.tds++; g.comp++; g.drive++; g.down = 1;
        g.los = SNAP; g.marker = this.lineToGain(g.los);
        g.state = 'td'; return;
      }
      if (kind === 'int') { g.state = 'gameover'; return; }
      if (kind === 'complete') { g.comp++; g.los = Math.max(EZ + 12, g.los - gain); }
      if (kind === 'sack') g.los = Math.min(WORLD_H - BACKFIELD - 12, g.los + 3 * YARD);
      // Moving the chains resets the count. Without this a drive was four
      // plays and out, so stringing completions together still ended in a
      // turnover and the down marker was measuring the whole field.
      if (g.los <= g.marker) {
        g.down = 1;
        g.marker = this.lineToGain(g.los);
        g.firstDown = true;
        g.state = 'result';
        return;
      }
      g.down++;
      g.state = g.down > 4 ? 'gameover' : 'result';
    },
    throwTo() {
      const rec = g.wr, from = g.qb;
      let f = Math.hypot(rec.x - from.x, rec.y - from.y) / A.V;
      for (let i = 0; i < 3; i++) { const p = at(rec, g.t + f); f = Math.hypot(p.x - from.x, p.y - from.y) / A.V; }
      const aim = at(rec, g.t + f);
      // The miss grows with how far the ball has to travel, so a checkdown is
      // nearly automatic and a deep shot is a genuine risk.
      const spread = A.SCATTER * (g.chem ? CHEM.scatter : 1)
        * (0.75 + Math.hypot(aim.x - from.x, aim.y - from.y) / 340);
      const ang = g.roll() * Math.PI * 2, mag = g.roll() * spread;
      g.ball = { x: from.x, y: from.y, tx: aim.x + Math.cos(ang) * mag, ty: aim.y + Math.sin(ang) * mag };
      g.att++; g.state = 'ball';
    },
    step() {
      if (g.state === 'yac') { this.runAfterCatch(); return; }
      if (g.state !== 'live' && g.state !== 'ball') return;
      g.t++;
      const r = g.wr;
      const p = at(r, g.t);
      r.x = p.x; r.y = p.y;
      r.frame += 0.2; r.hist.push({ x: r.x, y: r.y });
      if (r.hist.length > 60) r.hist.shift();
      r.db.frame += 0.2;
      // The route's edge on this shell is spent here: a concept that beats the
      // coverage leaves the defender a step further behind all play.
      const lag = Math.round(SHELL.lag * (1 + g.edge * 0.6));
      const tight = SHELL.tight * (1 - g.edge);
      const back = r.hist[Math.max(0, r.hist.length - 1 - lag)] || p;
      r.db.x += (back.x - r.db.x) * tight;
      r.db.y += (back.y - r.db.y) * tight;

      if (g.state === 'live') {
        for (const d of g.rushers) {
          const dx = g.qb.x - d.x, dy = g.qb.y - d.y, dist = Math.hypot(dx, dy) || 1;
          d.x += (dx / dist) * A.RUSH; d.y += (dy / dist) * A.RUSH; d.frame += 0.18;
          if (dist < 13) { this.end('sack', -3 * YARD); return; }
        }
      }
      if (g.state === 'ball') {
        const b = g.ball, dx = b.tx - b.x, dy = b.ty - b.y, dist = Math.hypot(dx, dy);
        if (dist <= A.V) { b.x = b.tx; b.y = b.ty; this.resolve(); }
        else { b.x += (dx / dist) * A.V; b.y += (dy / dist) * A.V; }
      }
    },
    /** Pursuit is a shade quicker than the runner, so the head start he caught
     *  it with is what decides the yards — and a burner can still house it. */
    runAfterCatch() {
      const r = g.wr;
      g.yacFrames++;
      r.y -= 0.92 + 0.56 * W.SPEED;
      r.x += Math.sign(VW / 2 - r.x) * 0.34;      // works back to the grass
      r.x = Math.max(10, Math.min(VW - 10, r.x));
      r.frame += 0.24;
      for (const d of [r.db, g.safety]) {
        const dx = r.x - d.x, dy = r.y - d.y, dist = Math.hypot(dx, dy) || 1;
        d.x += (dx / dist) * 1.54; d.y += (dy / dist) * 1.54; d.frame += 0.22;
        if (dist < 12) { this.end('complete', g.los - r.y); return; }
      }
      if (r.y <= EZ) { this.end('td', g.los - r.y); return; }
      if (g.yacFrames > 150) { this.end('complete', g.los - r.y); return; }
      g.camY = Math.max(0, Math.min(WORLD_H - VH, r.y - VH * 0.66));
    },
    resolve() {
      const b = g.ball, rec = g.wr;
      const recD = Math.hypot(rec.x - b.x, rec.y - b.y);
      const dbD = Math.hypot(rec.db.x - b.x, rec.db.y - b.y);
      const gain = g.los - b.y;
      g.ball = null;
      // Hands widen the catch radius and win the ball in traffic.
      const reach = CATCH_R * (0.86 + 0.30 * W.HANDS);
      if (dbD < reach && dbD < recD) {
        this.end(g.roll() < 0.28 ? 'int' : 'incomplete', 0); return;
      }
      if (recD > reach) { this.end('incomplete', 0); return; }
      const sep = dbD - recD;
      if (sep < 15 && g.roll() < 0.46 * (1 - sep / 15) * (1.3 - 0.6 * W.HANDS)) {
        this.end(g.roll() < 0.12 ? 'int' : 'incomplete', 0); return;
      }
      if (b.y <= EZ) { this.end('td', gain); return; }
      // He caught it clean and keeps running. This is not a phase you steer —
      // an earlier version let you drive the receiver and that made the game
      // trivial. The yards come from the separation the route already earned,
      // so a wide-open catch breaks free and a contested one dies on contact.
      rec.x = b.x; rec.y = b.y;
      g.yacFrames = 0;
      g.state = 'yac';
    },
    render() {
      drawField(g.camY, g.los, g.marker);
      const r = g.wr;
      // The chosen route traces once it is running; nothing to show before.
      if (r.route) {
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        for (let t = 0; t < 150; t += 3) {
          const p = at(r, t), sy = Math.round(p.y - g.camY);
          if (sy < -2 || sy > VH + 2) continue;
          ctx.fillRect(Math.round(p.x), sy, 1, 1);
        }
      }
      sprite(DEF20[Math.floor(r.db.frame) % 3], Math.round(r.db.x) - HALF, Math.round(r.db.y - g.camY) - HALF);
      if (g.safety)
        sprite(DEF20[Math.floor(g.safety.frame) % 3], Math.round(g.safety.x) - HALF, Math.round(g.safety.y - g.camY) - HALF);
      if (g.state !== 'yac')
        for (const d of g.rushers) sprite(DEF20[Math.floor(d.frame) % 3], Math.round(d.x) - HALF, Math.round(d.y - g.camY) - HALF);
      // Each of your two players wears his own club's colours.
      setJersey(g.wrTeam);
      sprite(RUN20[Math.floor(r.frame) % 3], Math.round(r.x) - HALF, Math.round(r.y - g.camY) - HALF);
      if (g.state === 'yac') {
        // The ball is his now.
        const ry = Math.round(r.y - g.camY);
        ctx.fillStyle = PAL.D; ctx.fillRect(Math.round(r.x) + 3, ry + 1, 4, 4);
        ctx.fillStyle = PAL.O; ctx.fillRect(Math.round(r.x) + 4, ry + 2, 2, 2);
      }
      setJersey(g.qbTeam);
      if (g.state !== 'yac') {
        sprite(RUN20[0], Math.round(g.qb.x) - HALF, Math.round(g.qb.y - g.camY) - HALF);
        setJersey(g.backTeam || g.qbTeam);
        sprite(RUN20[0], Math.round(g.rb.x) - HALF, Math.round(g.rb.y - g.camY) - HALF);
      }
      if (g.ball) {
        const by = Math.round(g.ball.y - g.camY);
        ctx.fillStyle = PAL.D;
        for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 2]])
          ctx.fillRect(Math.round(g.ball.x) - 1 + dx, by + dy, 3, 2);
        ctx.fillStyle = PAL.O;
        ctx.fillRect(Math.round(g.ball.x) - 1, by, 3, 2);
        ctx.fillRect(Math.round(g.ball.x), by - 1, 1, 4);
      }
    },
    onUp() {
      if (g.state === 'ready' || g.state === 'yac') return;   // both play themselves
      if (g.state === 'result' || g.state === 'td') { this.setup(); return; }
      if (g.state === 'gameover') { this.reset(); g.state = 'select'; return; }
      if (g.state === 'live') this.throwTo();
    },
    score() { return { value: g.tds, tie: g.yards, detail: `${g.comp}/${g.att} · ${g.yards} yd` }; },
    status() {
      const t = g.marker <= EZ ? 'GOAL' : Math.max(1, Math.round((g.los - g.marker) / YARD));
      const pct = g.att ? Math.round((g.comp / g.att) * 100) : 0;
      return `<span>DOWN <b>${g.down}</b></span><span>TO GO <b>${t}</b></span>`
        + `<span><b>${g.comp}/${g.att}</b> ${pct}%</span>`
        + (g.chem ? `<span class="chem">${g.qbTeam}</span>` : '')
        + `<span class="sc">${g.tds} TD</span>`;
    },
    overlay() {
      const t = g.marker <= EZ ? 'GOAL' : Math.max(1, Math.round((g.los - g.marker) / YARD));
      if (g.state === 'live' || g.state === 'ball' || g.state === 'ready' || g.state === 'yac') return null;
      if (g.state === 'result') {
        if (g.firstDown) return { ttl: 'First down', gold: true, sub: `${g.gain} yd · ${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
        if (g.result === 'complete') return { ttl: 'Complete', sub: `${g.gain} yd · ${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
        if (g.result === 'sack') return { ttl: 'Sacked', bad: true, sub: `${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
        return { ttl: 'Incomplete', sub: `${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
      }
      if (g.state === 'td') return { ttl: 'Touchdown', gold: true, sub: `${g.gain} yd strike`, tap: 'tap to continue' };
      return { ttl: g.result === 'int' ? 'Intercepted' : 'Turnover on downs', bad: true,
               sub: `${g.comp}/${g.att} · ${g.yards} yards · ${g.tds} TD`, tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };

})();

// ===========================================================================
// GAME 3 — KICK
// ===========================================================================
const KICK_GAME = (() => {
  const PPY = 4;                              // logical px per yard downfield
  const SPR = 20, HALF = 10;
  const SAMPLE = 'B. Aubrey:DAL:0.95:0.86:0.80|H. Butker:KC:0.82:0.90:0.86|'
    + 'J. Tucker:BAL:0.88:0.94:0.72|C. Boswell:PIT:0.74:0.92:0.78';
  const wr = mulberry32(hashSeed(SEED + '|wind'));
  const WIND = Math.round((wr() * 2 - 1) * 10) / 10;          // -1 .. 1
  const WIND_LABEL = Math.abs(WIND) < 0.22 ? 'No wind'
    : `${Math.abs(WIND) > 0.66 ? 'Strong' : 'Light'} wind ${WIND < 0 ? 'left' : 'right'}`;
  const POST_HALF = 13;                        // half the gap between uprights
  let tick = 0;                                // frames, for the streamers

  let A = {}, g = null;
  return {
    key: 'kick', label: 'Kick', pickTitle: 'Choose your kicker',
    shell: WIND_LABEL, attrLabels: ['Leg', 'Accuracy', 'Nerve'],
    hint: 'tap to set power · tap to set aim',
    controls: [['Tap', 'start the power meter'], ['Tap again', 'lock power — longer kicks need more'],
               ['Third tap', 'lock aim as the marker sweeps'],
               ['Wind', 'read the streamers — aim into it'],
               ['Every make', 'moves you back five yards']],
    roster: parseRoster('kick', SAMPLE),
    reset() {
      g = { dist: 25, made: 0, longest: 0, embedded: false, auto: false, state: 'select', phase: 'power',
            power: 0, powerDir: 1, aim: 0, aimDir: 1, lockedPower: 0, lockedAim: 0,
            ball: null, result: '' };
      this.g = g;
    },
    attach(p) {
      A = { MAX: 38 + 27 * p.a, AIMSPD: 0.030 - 0.014 * p.b, PWRSPD: 0.026 - 0.010 * p.c };
      g.team = p.team;
    },
    choose(p) { this.attach(p); this.setup(); g.state = 'ready'; },
    /** A single attempt from a set distance, for a drive. `auto` locks the
     *  power meter and leaves only the aim — the difference between a field
     *  goal, which is a decision, and an extra point, which is a formality
     *  you should not have to work a three-tap meter for. */
    kickFrom(dist, auto) {
      g.dist = dist;
      this.setup();
      g.embedded = true; g.auto = !!auto;
    },
    outcome() { return { made: g.result === 'good' }; },
    /** The longest this kicker can reach, so a drive knows what to offer. */
    maxRange() { return Math.floor(A.MAX || 0); },
    setup() {
      g.phase = 'power'; g.power = 0; g.powerDir = 1; g.aim = 0; g.aimDir = 1;
      g.ball = null; g.state = 'ready';
    },
    kick() {
      // required power scales with distance against this kicker's max range
      const need = g.dist / A.MAX;
      const short = g.lockedPower < need;
      // aim error plus wind drift over the flight
      const drift = g.lockedAim * 30 + WIND * (g.dist / 60) * 26;
      g.ball = { t: 0, drift, short, need };
      g.state = 'flight';
    },
    step() {
      if (g.state === 'aiming' || g.state === 'charging') {
        if (g.phase === 'power') {
          g.power += g.powerDir * A.PWRSPD;
          if (g.power >= 1) { g.power = 1; g.powerDir = -1; }
          if (g.power <= 0) { g.power = 0; g.powerDir = 1; }
        } else {
          g.aim += g.aimDir * A.AIMSPD;
          if (g.aim >= 1) { g.aim = 1; g.aimDir = -1; }
          if (g.aim <= -1) { g.aim = -1; g.aimDir = 1; }
        }
        return;
      }
      if (g.state !== 'flight') return;
      const b = g.ball;
      b.t += 0.016;
      const reach = b.short ? (g.lockedPower / b.need) : 1;
      if (b.t >= reach || b.t >= 1) {
        if (b.short) { g.result = 'short'; g.state = 'miss'; }
        else if (Math.abs(b.drift) > POST_HALF) { g.result = b.drift < 0 ? 'wide left' : 'wide right'; g.state = 'miss'; }
        else {
          g.made++; g.longest = Math.max(g.longest, g.dist);
          if (!g.embedded) g.dist += 5;   // the ladder is the standalone game
          g.result = 'good'; g.state = 'good';
        }
      }
    },
    render() {
      tick++;
      ctx.fillStyle = '#08090b'; ctx.fillRect(0, 0, VW, VH);
      const groundY = VH - 34;
      const postY = groundY - g.dist * PPY;
      // yard ticks between the spot and the posts
      for (let y = 5; y < g.dist; y += 5) {
        const sy = Math.round(groundY - y * PPY);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(VW / 2 - 12, sy, 4, 1); ctx.fillRect(VW / 2 + 8, sy, 4, 1);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(2, 0, 1, VH); ctx.fillRect(VW - 3, 0, 1, VH);

      // uprights: crossbar plus two posts
      const cx = VW / 2;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(cx - POST_HALF, Math.round(postY), POST_HALF * 2, 1);
      ctx.fillRect(cx - POST_HALF, Math.round(postY) - 26, 1, 26);
      ctx.fillRect(cx + POST_HALF, Math.round(postY) - 26, 1, 26);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(cx, Math.round(postY), 1, groundY - postY);       // the line of the kick

      // Streamers on the uprights: which way it is blowing and how hard,
      // the way a kicker actually reads it before lining one up. They ripple
      // between two shapes, and the harder it blows the faster they snap
      // between them — direction alone was a static read of a moving thing.
      const calm = Math.abs(WIND) < 0.22;
      const fdir = WIND < 0 ? -1 : 1;
      const flen = calm ? 2 : Math.round(3 + Math.abs(WIND) * 7);
      const ftop = Math.round(postY) - 26;
      const beat = calm ? 26 : Math.max(5, Math.round(20 - Math.abs(WIND) * 13));
      const phase = Math.floor(tick / beat) % 2;
      ctx.fillStyle = calm ? 'rgba(255,255,255,0.26)' : PAL.O;
      for (const px of [cx - POST_HALF, cx + POST_HALF]) {
        for (let i = 1; i <= flen; i++) {
          // A one-pixel wave down the length, inverted on the off beat.
          const wave = calm ? 0 : Math.round(Math.sin(i * 0.85 + phase * Math.PI));
          ctx.fillRect(px + fdir * i, ftop + wave, 1, 1);
        }
      }

      // kicker — in his own club's colours, like everyone else
      setJersey(g.team);
      sprite(RUN20[0], Math.round(cx) - HALF - 8, groundY - HALF);

      if (g.state === 'flight' || g.state === 'good' || g.state === 'miss') {
        const b = g.ball;
        const prog = Math.min(1, b.t / (b.short ? (g.lockedPower / b.need) : 1));
        const y = groundY + (postY - groundY) * prog;
        const x = cx + b.drift * prog;
        const hgt = Math.sin(prog * Math.PI);                         // reads as height
        const r = 1 + Math.round(hgt * 1.6);
        ctx.fillStyle = PAL.O;
        ctx.fillRect(Math.round(x) - r, Math.round(y) - r, r * 2, r * 2);
      } else {
        ctx.fillStyle = PAL.O;
        ctx.fillRect(Math.round(cx) - 1, groundY - 1, 3, 2);
      }

      // meters — hairline, only while they matter
      if (g.state === 'aiming' || g.state === 'charging' || g.state === 'ready') {
        // An extra point locks its own power, so there is no meter to read:
        // drawing one that sits at zero and then jumps to the middle on the
        // first tap only suggests you missed your moment.
        if (!g.auto) {
          const mx = VW - 14, top = 40, h = VH - 110;
          ctx.fillStyle = 'rgba(255,255,255,0.16)';
          ctx.fillRect(mx, top, 1, h); ctx.fillRect(mx - 3, top, 7, 1); ctx.fillRect(mx - 3, top + h, 7, 1);
          const pv = g.phase === 'power' ? g.power : g.lockedPower;
          ctx.fillStyle = g.phase === 'power' ? '#ffffff' : 'rgba(255,255,255,0.42)';
          ctx.fillRect(mx - 4, Math.round(top + h - pv * h), 9, 1);
        }

        const by = VH - 18, bw = 88;
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(cx - bw / 2, by, bw, 1);
        ctx.fillRect(cx, by - 3, 1, 7);
        const av = g.phase === 'aim' ? g.aim : g.lockedAim;
        if (g.auto || g.phase === 'aim' || g.state !== 'ready') {
          ctx.fillStyle = g.phase === 'aim' ? '#ffffff' : 'rgba(255,255,255,0.42)';
          ctx.fillRect(Math.round(cx + av * (bw / 2)) - 1, by - 4, 3, 9);
        }
      }
    },
    onUp() {
      if (g.state === 'ready') {
        if (g.auto) {
          g.lockedPower = Math.min(1, g.dist / A.MAX + 0.12);
          g.phase = 'aim'; g.state = 'aiming'; return;
        }
        g.state = 'charging'; g.phase = 'power'; return;
      }
      if (g.state === 'charging') { g.lockedPower = g.power; g.phase = 'aim'; g.state = 'aiming'; return; }
      if (g.state === 'aiming') { g.lockedAim = g.aim; this.kick(); return; }
      if (g.state === 'good') { this.setup(); return; }
      if (g.state === 'miss') { this.reset(); g.state = 'select'; return; }
    },
    score() { return { value: g.made, tie: g.longest, detail: g.longest ? `long ${g.longest} yd` : '' }; },
    status() {
      // Wind is worth more than half the gap between the posts on a long
      // attempt, so it has to be readable for the whole session — naming it
      // once on the pick screen just reads as the aim being broken.
      const w = Math.abs(WIND) < 0.22 ? 'CALM'
        : `${WIND < 0 ? '←' : '→'} ${Math.abs(WIND).toFixed(1)}`;
      return `<span>FROM <b>${g.dist}</b> YD</span><span>WIND <b>${w}</b></span>`
        + `<span>MADE <b>${g.made}</b></span>`
        + `<span class="sc">LONG ${g.longest || '—'}</span>`;
    },
    overlay(pick) {
      if (g.state === 'charging' || g.state === 'aiming' || g.state === 'flight') return null;
      if (g.state === 'ready') return { ttl: pick.name, sub: `${pick.team} · ${g.dist} yard attempt`,
                                        tap: g.auto ? 'tap to set aim' : 'tap to start power', attrs: !g.embedded && g.made === 0 };
      if (g.state === 'good') return { ttl: 'Good', gold: true, sub: `${g.dist - 5} yd · back to ${g.dist}`, tap: 'tap for the next one' };
      return { ttl: g.result === 'short' ? 'Short' : g.result === 'wide left' ? 'Wide left' : 'Wide right',
               bad: true, sub: `${g.made} made · long ${g.longest || 0} yd`, tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };
})();

// ===========================================================================
// SHELL — tabs, picker, overlay, loop
// ===========================================================================
/** A carry or a sack can go backwards, so say so rather than printing -3. */
const yds = (n) => (n < 0 ? `${-n} yd loss` : `${n} yd`);
const ORD = ['', '1ST', '2ND', '3RD', '4TH'];
// ===========================================================================
// GAME 4 — DRIVE
//
// One drive, both play types. The controller owns down, distance and field
// position; each play is handed to the run or the pass engine, which keeps
// its own world, its own sprite scale and its own tuned contact maths. They
// share YARD, so the only thing crossing the boundary is a yard count — no
// physics is merged, and neither engine learns about the other.
// ===========================================================================
const DRIVE_GAME = (() => {
  const START = 21, TO_GO = 10;
  // States in which the engine still has the ball. Anything else means the
  // play is over and the drive takes back control.
  const PLAYING = ['presnap', 'ready', 'live', 'ball', 'yac', 'charging', 'aiming', 'flight'];
  const TD = 6, XP = 1, FG = 3, XP_YD = 20;
  /**
   * The field is twenty-one yards; a real one is a hundred. Taken literally
   * every field goal is a chip shot, and a bot that simply kicked on every
   * fourth down scored 98 points a game and never once had a drive end. So
   * the drive is mapped onto a real kicking range instead: your own end of
   * it is a sixty-two yarder that most legs cannot reach, and it becomes a
   * gimme only once you have actually driven. Distance is the reason fourth
   * down is a decision.
   */
  const fgYards = (losYards) => 20 + losYards * 2;
  let g = null, cur = null;

  return {
    key: 'drive', label: 'Drive',
    pickTitle: 'Choose your back',
    pickTitle2: 'Choose your passer',
    pickTitle3: 'Choose your target',
    pickTitle4: 'Choose your kicker',
    shell: `${RUN_GAME.shell} · ${PASS_GAME.shell}`,
    attrLabels: RUN_GAME.attrLabels,
    attrLabels2: PASS_GAME.attrLabels,
    attrLabels3: PASS_GAME.attrLabels2,
    attrLabels4: KICK_GAME.attrLabels,
    hint: '',
    controls: [['Pick a play', 'top row to run, bottom to pass'],
               ['Run cut', 'swipe left / right'],
               ['Run spin', 'tap to spin'],
               ['Run truck', 'swipe up'],
               ['Pass', 'tap to throw'],
               ['4th down', 'take the field goal or go for it'],
               ['Points', 'TD is 6, XP is 1, FG is 3']],
    roster: RUN_GAME.roster,
    roster2: PASS_GAME.roster,
    roster3: PASS_GAME.roster2,
    roster4: KICK_GAME.roster,
    chemPair: [1, 2],
    reset() {
      RUN_GAME.reset();
      PASS_GAME.reset();
      KICK_GAME.reset();
      cur = null;
      g = { losYards: START, down: 1, toGo: TO_GO, driveNo: 0,
            tds: 0, yards: 0, gain: 0, how: '', first: false,
            points: 0, fgs: 0, kicking: null,
            calls: { run: 0, pass: 0 }, set: null, menu: null, state: 'select' };
      this.g = g;
    },
    choose(p) { RUN_GAME.attach(p); g.backTeam = p.team; },
    choose2(p) { PASS_GAME.choose(p); g.qbTeam = p.team; },
    choose3(p) {
      PASS_GAME.attach2(p);
      RUN_GAME.mates(g.qbTeam, p.team);
      PASS_GAME.mate(g.backTeam);
    },
    choose4(p) { KICK_GAME.attach(p); this.callPlay(); },
    /** Back to our own twenty-one after any score. */
    newDrive() { g.losYards = START; g.down = 1; g.toGo = TO_GO; g.driveNo++; },
    /** Send the unit on. `kind` decides whether the power meter is yours. */
    kickAt(dist, kind) {
      cur = KICK_GAME;
      g.kicking = kind;
      KICK_GAME.kickFrom(dist, kind === 'xp');
      g.state = 'play';
    },
    /** Set the defense once, show it, and offer the whole playbook against
     *  it. Both engines line up on the same eleven, so the picture you read
     *  is the picture you get whichever of the eight you take. */
    callPlay() {
      const los = EZ + g.losYards * YARD;
      g.set = { off: alignOffense(RUN_GAME.g.rnd, los) };
      g.set.def = alignDefense(RUN_GAME.g.rnd, g.driveNo, los, g.set.off.wrX);
      // Build the playbook once, here — prompt() is called on every repaint,
