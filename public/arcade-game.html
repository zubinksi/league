  const BEST = {
    slant: 'Route', out: 'Route', go: 'Arm', post: 'Arm',
    quick: 'Hands', drag: 'Route', fade: 'Arm', flat: 'Hands',
  };
  /** The route drawn small, as offsets from the receiver on the line. Negative
   *  y is downfield; x is multiplied by the direction he actually breaks. */
  const SHAPE = {
    slant: [[0, 0], [0, -4], [7, -13]],
    out: [[0, 0], [0, -9], [8, -11]],
    go: [[0, 0], [0, -20]],
    post: [[0, 0], [0, -11], [8, -20]],
    quick: [[0, 0], [0, -3], [5, -8]],
    drag: [[0, 0], [0, -3], [12, -6]],
    fade: [[0, 0], [3, -10], [5, -19]],
    flat: [[0, 0], [4, -2], [11, -4]],
  };
  const BOOK = (r) => (r.red ? RED : ROUTES);

  let A = {}, W = {}, g = null;
  // The receiver's speed rating stretches the route clock, so a burner is
  // further along his stem at the same instant.
  // Clamped to the field here, not at the call site: the lead prediction and
  // the receiver have to agree, or a route working toward the sideline aims
  // the ball somewhere he is not allowed to be.
  const at = (r, t) => {
    const o = BOOK(r)[r.route](Math.max(0, t) * r.speed, r.dir);
    return {
      x: Math.max(10, Math.min(VW - 10, r.sx + o.x)),
      y: Math.max(14, r.sy + o.y),
    };
  };

  return {
    key: 'pass', label: 'Pass',
    pickTitle: 'Choose your passer', pickTitle2: 'Choose your target',
    shell: SHELL.label, attrLabels: ['Arm', 'Accuracy', 'Escape'],
    attrLabels2: ['Speed', 'Hands', 'Route'],
    hint: 'pick a route · tap to throw',
    controls: [['Pick a route', 'beat the coverage before the snap'],
               ['Man coverage', 'breaks win — slant, out, drag'],
               ['Zone coverage', 'go over the top — go, post, fade'],
               ['Tap', 'throw — the ball leads him'],
               ['Careful', 'an interception ends the run']],
    roster: parseRoster('pass', SAMPLE_QB),
    roster2: parseRoster('recv', SAMPLE_WR),
    chemPair: [0, 1],
    reset() {
      g = { rnd: mulberry32(hashSeed(SEED + SALT)), roll: mulberry32(hashSeed(SEED + SALT + '|r')),
            drive: 0, down: 1, los: SNAP, marker: SNAP - 10 * YARD,
            tds: 0, comp: 0, att: 0, yards: 0, gain: 0, firstDown: false,
            result: '', state: 'select', t: 0, wr: null, rushers: [], ball: null, edge: 0 };
      this.g = g;
    },
    /** Stage one: the passer. Stays in select so the target can be picked. */
    choose(p) {
      // The rush has to actually arrive. At the old rate two men needed ~110
      // frames to cover the last stretch to a passer who had already thrown
      // by 100, so a dropback carried no risk at all and Escape did nothing.
      A = { V: 2.1 + 2.0 * p.a, SCATTER: 4 + 14 * (1 - p.b), RUSH: 0.52 - 0.22 * p.c,
            ACC: p.b };
      g.qbTeam = p.team;
    },
    /** Stage two: the target. Sharing a club with the passer is the bonus. */
    mate(backTeam) { g.backTeam = backTeam; },
    attach2(p) {
      W = { SPEED: 0.86 + 0.30 * p.a, HANDS: p.b, ROUTE: p.c };
      g.wrTeam = p.team;
      g.chem = !!(p.team && p.team === g.qbTeam);
    },
    choose2(p) { this.attach2(p); this.setup(); },
    /** Line up a single snap this many yards from the goal line. */
    startAt(losYards, set, marker) {
      g.los = EZ + Math.round(losYards * YARD);
      // The drive's line to gain when there is one. Working it out here meant
      // drawing it a fixed ten yards out on every snap, so on 2nd and 3 the
      // stripe sat seven yards past the one you actually had to reach — and
      // you were awarded the first down without ever crossing what was drawn.
      g.marker = marker != null ? marker : this.lineToGain(g.los);
      this.setup(set);
    },
    outcome() { return { kind: g.result, gain: g.gain }; },
    setup(set) {
      const rnd = g.rnd;
      const red = (g.los - EZ) < 13 * YARD;          // goal-to-go territory
      const off = (set && set.off) || alignOffense(rnd, g.los);
      const D = (set && set.def) || alignDefense(rnd, g.drive, g.los, off.wrX);
      const sx = off.wrX;
      g.red = red;
      g.wr = {
        sx, sy: g.los - 8, x: sx, y: g.los - 8, dir: 1, route: null, red,
        hist: [], frame: rnd() * 3, speed: W.SPEED,
        db: D.cb,
      };
      // The box comes after the passer; the deepest of them cannot, so he
      // drops off. Same bodies you read before the snap either way.
      g.rushers = D.front.slice(0, 2);
      g.safety = D.safety;
      g.qb = off.qb;
      g.rb = { x: VW / 2 - 16, y: g.los + BACKFIELD, frame: 0 };
      g.ball = null; g.t = 0; g.edge = 0;
      FX.reset();
      g.camY = presnapAt(g.los); g.camEase = CAM_EASE;
      g.state = 'ready';
    },
    /** Which way a route breaks, given where the receiver lined up. Inside
     *  breaks work back to the middle, outside breaks to the sideline. Known
     *  before the snap, so the play buttons can draw it the right way round. */
    routeDir(route) {
      const toCenter = g.wr.sx < VW / 2 ? 1 : -1;
      const outside = route === 'out' || route === 'flat' || route === 'fade';
      return toCenter * (outside ? -1 : 1);
    },
    /** Pre-snap: the route choice is the snap. */
    prompt() {
      if (g.state !== 'ready') return null;
      return {
        title: SHELL.label,
        sub: 'pick the route',
        options: (g.red ? RED_MENU : MENU).map((k) => ({
          key: k, label: LABEL[k], best: BEST[k],
          // Drawn the way it will actually be run: which side he breaks to
          // depends on which hash he lined up on.
          shape: SHAPE[k].map(([x, y]) => [x * this.routeDir(k), y]),
        })),
      };
    },
    pickOption(route) {
      const r = g.wr;
      r.route = route;
      r.dir = this.routeDir(route);
      const edge = (EDGE[route] || {})[SHELL.key] ?? 0;
      // A real route runner earns separation on top of the concept itself,
      // and a familiar battery earns a little more.
      const chem = g.chem ? CHEM.edge : 0;
      g.edge = Math.max(-0.4, Math.min(0.6, edge + (W.ROUTE - 0.5) * 0.3 + chem));
      g.t = 0;
      g.state = 'live';
    },
    /** Ten yards ahead, or the goal line once you are inside it. */
    lineToGain(from) { return Math.max(EZ, from - 10 * YARD); },
    end(kind, gain) {
      g.result = kind; g.gain = Math.round(gain / YARD);
      g.visual = { kind, frames: kind === 'td' ? 72 : 24 };
      g.yards += Math.max(0, g.gain);
      g.firstDown = false;
      if (kind === 'td') {
        g.tds++; g.comp++; g.drive++; g.down = 1;
        g.los = SNAP; g.marker = this.lineToGain(g.los);
        g.state = 'td'; return;
      }
      if (kind === 'int') { g.state = 'gameover'; return; }
      if (kind === 'complete') { g.comp++; g.los = Math.max(EZ + 12, g.los - gain); }
      if (kind === 'sack') g.los = Math.min(WORLD_H - BACKFIELD - 12, g.los + 3 * YARD);
      // Moving the chains resets the count. Without this a drive was four
      // plays and out, so stringing completions together still ended in a
      // turnover and the down marker was measuring the whole field.
      if (g.los <= g.marker) {
        g.down = 1;
        g.marker = this.lineToGain(g.los);
        g.firstDown = true;
        g.state = 'result';
        return;
      }
      g.down++;
      g.state = g.down > 4 ? 'gameover' : 'result';
    },
    /**
     * `pt` is where you tapped, in world coordinates.
     *
     * The engine still solves the lead — where the receiver will be when the
     * ball lands — but that is now a hand on your elbow rather than the throw
     * itself. Tap on the solved spot and you get all of the help; tap a long
     * way off and the ball goes where you pointed it. How much slack you have
     * is the passer's accuracy, so a checkdown artist has to be nearly right
     * and a surgeon can be sloppy.
     *
     * Before this, timing was the only input: the throw aimed itself, so the
     * only question was when to release.
     */
    throwTo(pt) {
      const rec = g.wr, from = g.qb;
      let f = Math.hypot(rec.x - from.x, rec.y - from.y) / A.V;
      for (let i = 0; i < 3; i++) { const p = at(rec, g.t + f); f = Math.hypot(p.x - from.x, p.y - from.y) / A.V; }
      const aim = at(rec, g.t + f);
      if (pt) {
        // Two different mistakes, and they were being treated as one.
        //
        // Missing ALONG the route is a timing read — you threw to the wrong
        // point on a line he is going to run down anyway, and the ball still
        // lands somewhere he passes through. Missing ACROSS it is a slip of
        // the thumb, and it puts the ball where he never goes, which is why a
        // round assist made the drawn route a line you had to trace: a throw
        // that was sideways-wrong by a fingertip was dead however good the
        // read was. So the sideways component is forgiven WIDE times harder,
        // and what is left to get right is when, not whether your thumb is on
        // the line.
        const nxt = at(rec, g.t + f + 6);
        let vx = nxt.x - aim.x, vy = nxt.y - aim.y;
        const mm = Math.hypot(vx, vy) || 1; vx /= mm; vy /= mm;
        const dx = pt.x - aim.x, dy = pt.y - aim.y;
        const alo = dx * vx + dy * vy;
        const acr = -dx * vy + dy * vx;
        const help = ASSIST * (0.55 + 0.75 * A.ACC);
        const ka = Math.max(0, 1 - Math.abs(alo) / help);
        const kc = Math.max(0, 1 - Math.abs(acr) / (help * WIDE));
        const ra = alo * (1 - ka), rc = acr * (1 - kc);
        aim.x += ra * vx - rc * vy;
        aim.y += ra * vy + rc * vx;
      }
      // The miss grows with how far the ball has to travel, so a checkdown is
      // nearly automatic and a deep shot is a genuine risk.
      const spread = A.SCATTER * (g.chem ? CHEM.scatter : 1)
        * (0.75 + Math.hypot(aim.x - from.x, aim.y - from.y) / 340);
      const ang = g.roll() * Math.PI * 2, mag = g.roll() * spread;
      g.ball = { x: from.x, y: from.y, tx: aim.x + Math.cos(ang) * mag, ty: aim.y + Math.sin(ang) * mag };
      g.threw = g.t;
      g.att++; g.state = 'ball';
    },
    step() {
      if (g.state === 'yac') { this.runAfterCatch(); return; }
      if (g.state !== 'live' && g.state !== 'ball') return;
      g.t++;
      const r = g.wr;
      const p = at(r, g.t);
      r.x = p.x; r.y = p.y;
      r.frame += 0.2; r.hist.push({ x: r.x, y: r.y });
      if (r.hist.length > 60) r.hist.shift();
      r.db.frame += 0.2;
      // The route's edge on this shell is spent here: a concept that beats the
      // coverage leaves the defender a step further behind all play.
      // How far behind him the corner is, right now. This is where the throw
      // window comes from, and it has to be the lag rather than the closing
      // rate: the corner tracks a lagged copy of the route, so the gap between
      // them is set by how many frames back he is reading. Tightening the
      // closing rate instead moved completion by six points across the whole
      // window, which is another way of saying it did nothing.
      const since = g.t - (BREAK[r.route] || 0);
      const slip = since < 0 ? GRIP_EARLY
        : since < OPEN ? GRIP_OPEN - (GRIP_OPEN - 1) * (since / OPEN)
        : 1;
      const lag = Math.min(58, Math.round(SHELL.lag * (1 + g.edge * 0.6) * slip));
      const tight = SHELL.tight * (1 - g.edge);
      const back = r.hist[Math.max(0, r.hist.length - 1 - lag)] || p;
      r.db.x += (back.x - r.db.x) * tight;
      r.db.y += (back.y - r.db.y) * tight;

      // The safety works from depth: he shades across to the receiver and
      // gives ground once the route threatens his level. Standing still until
      // the ball was already caught is what made a go a free throw.
      if (g.safety) {
        const s = g.safety;
        if (g.state === 'ball' && g.t - g.threw > 8) {
          // He reads the throw and drives on it, after a beat to read it.
          // Holding depth alone was no use — he plays ten yards off and these
          // routes gain five, so he was never within reach of anything. The
          // beat is what separates the throws: a slant lands before he has
          // moved, a go hangs long enough for him to arrive. Without it he
          // was on top of every catch and the yards-after went to nothing,
          // which turned second and nine into a down with no answer at all.
          const bx = g.ball.tx - s.x, by = g.ball.ty - s.y;
          const d = Math.hypot(bx, by) || 1;
          s.x += (bx / d) * s.lateral * 1.18;
          s.y += (by / d) * s.speed * 1.18;
        } else {
          const lead = r.x - s.x;
          s.x += Math.sign(lead) * Math.min(0.62, Math.abs(lead) * 0.055);
          if (r.y - s.y < 74) s.y = Math.max(EZ + 6, s.y - 0.52);
        }
        s.frame += 0.16;
      }
      if (g.state === 'live') {
        for (const d of g.rushers) {
          const dx = g.qb.x - d.x, dy = g.qb.y - d.y, dist = Math.hypot(dx, dy) || 1;
          d.x += (dx / dist) * A.RUSH; d.y += (dy / dist) * A.RUSH; d.frame += 0.18;
          if (dist < 13) {
            // Taken down in his own backfield: the hardest hit in the game.
            FX.hit((g.qb.x + d.x) / 2, (g.qb.y + d.y) / 2, 3);
            this.end('sack', -3 * YARD); return;
          }
        }
      }
      if (g.state === 'ball') {
        const b = g.ball, dx = b.tx - b.x, dy = b.ty - b.y, dist = Math.hypot(dx, dy);
        if (dist <= A.V) { b.x = b.tx; b.y = b.ty; this.resolve(); }
        else { b.x += (dx / dist) * A.V; b.y += (dy / dist) * A.V; }
      }
    },
    /** Pursuit is a shade quicker than the runner, so the head start he caught
     *  it with is what decides the yards — and a burner can still house it. */
    runAfterCatch() {
      const r = g.wr;
      g.yacFrames++;
      r.y -= 0.92 + 0.56 * W.SPEED;
      r.x += Math.sign(VW / 2 - r.x) * 0.34;      // works back to the grass
      r.x = Math.max(10, Math.min(VW - 10, r.x));
      r.frame += 0.24;
      let near = Infinity;
      for (const d of [r.db, g.safety]) {
        const dx = r.x - d.x, dy = r.y - d.y, dist = Math.hypot(dx, dy) || 1;
        near = Math.min(near, dist);
        r.alone = near;
        d.x += (dx / dist) * 1.54; d.y += (dy / dist) * 1.54; d.frame += 0.22;
        if (dist < 12) {
          FX.kick((r.x + d.x) / 2, (r.y + d.y) / 2, 9, 1.2);
          this.end('complete', g.los - r.y); return;
        }
      }
      if (r.y <= EZ) { this.end('td', g.los - r.y); return; }
      if (g.yacFrames > 150) { this.end('complete', g.los - r.y); return; }
      const want = eyeAt(r.y, PLAY_EYE);
      if (g.camEase > 0) { g.camEase--; g.camY += (want - g.camY) * 0.22; }
      else g.camY = want;
    },
    resolve() {
      const b = g.ball, rec = g.wr;
      const recD = Math.hypot(rec.x - b.x, rec.y - b.y);
      const dbD = Math.hypot(rec.db.x - b.x, rec.db.y - b.y);
      const gain = g.los - b.y;
      g.ball = null;
      // Hands widen the catch radius and win the ball in traffic.
      const reach = CATCH_R * (0.86 + 0.30 * W.HANDS);
      if (dbD < reach && dbD < recD) {
        this.end(g.roll() < 0.28 ? 'int' : 'incomplete', 0); return;
      }
      // Over the top. He is arriving from depth with his back to the throw,
      // so he knocks it down far more often than he takes it.
      const safD = g.safety ? Math.hypot(g.safety.x - b.x, g.safety.y - b.y) : Infinity;
      if (safD < reach * 0.82 && safD < recD) {
        this.end(g.roll() < 0.18 ? 'int' : 'incomplete', 0); return;
      }
      if (recD > reach) { this.end('incomplete', 0); return; }
      const sep = dbD - recD;
      if (sep < 15 && g.roll() < 0.46 * (1 - sep / 15) * (1.3 - 0.6 * W.HANDS)) {
        this.end(g.roll() < 0.12 ? 'int' : 'incomplete', 0); return;
      }
      if (b.y <= EZ) { this.end('td', gain); return; }
      // He caught it clean and keeps running. This is not a phase you steer —
      // an earlier version let you drive the receiver and that made the game
      // trivial. The yards come from the separation the route already earned,
      // so a wide-open catch breaks free and a contested one dies on contact.
      rec.x = b.x; rec.y = b.y;
      rec.catchFrames = 12;
      g.yacFrames = 0;
      g.state = 'yac';
    },
    render() {
      CAMERA.frame(g.ball ? g.ball.x : (g.wr ? g.wr.x : VW / 2), g.los);
      drawField(g.camY, g.los, g.marker);
      const r = g.wr;
      // The chosen route traces once it is running; nothing to show before.
      if (r.route) {
        ctx.lineCap = 'square';
        for (let t = 0; t < 150; t += 7) {
          const a = at(r, t), b = at(r, t + 3);
          const ay = a.y - g.camY, by = b.y - g.camY;
          if ((ay < -3 && by < -3) || (ay > VH + 3 && by > VH + 3)) continue;
          const ap = projectPoint(a.x, ay), bp = projectPoint(b.x, by);
          const passed = t < g.t;
          ctx.strokeStyle = `rgba(255,255,255,${passed ? .045 : (.08 + ap.scale * .08).toFixed(3)})`;
          ctx.lineWidth = Math.max(.65, ap.scale);
          ctx.beginPath(); ctx.moveTo(ap.x, ap.y); ctx.lineTo(bp.x, bp.y); ctx.stroke();
        }
      }
      sprite(DEF20[Math.floor(r.db.frame) % 3], Math.round(r.db.x) - HALF, Math.round(r.db.y - g.camY) - HALF,
        null, 0, null, { pose: r.db.stumble > 0 ? 'fall' : 'run', frame: r.db.frame });
      if (g.safety)
        sprite(DEF20[Math.floor(g.safety.frame) % 3], Math.round(g.safety.x) - HALF, Math.round(g.safety.y - g.camY) - HALF,
          null, 0, null, { pose: 'run', frame: g.safety.frame });
      if (g.state !== 'yac')
        for (const d of g.rushers) sprite(DEF20[Math.floor(d.frame) % 3], Math.round(d.x) - HALF, Math.round(d.y - g.camY) - HALF);
      // Each of your two players wears his own club's colours.
      setJersey(g.wrTeam);
      const rx = Math.round(r.x) - HALF, ry0 = Math.round(r.y - g.camY) - HALF;
      if (g.state === 'yac') {
        // He is the carrier now, so he gets what the carrier gets.
        const loose = Math.max(0, Math.min(1, ((r.alone || 0) - YAC_CLEAR) / 20));
        if (loose > 0) {
          for (let i = 3; i >= 1; i--) {
            ctx.globalAlpha = loose * 0.32 / i;
            const f = (((Math.floor(r.frame) - i) % 3) + 3) % 3;
            sprite(RUN20[f], rx, ry0 + i * 4);
          }
          ctx.globalAlpha = 1;
        }
        // Use the same embedded ball pixels as the running back. Drawing a
        // separate screen-space square after projection made the caught ball
        // drift away from the receiver's hip.
        const caught = (r.catchFrames || 0) > 0;
        if (caught) r.catchFrames--;
        const visualPose = caught ? 'catch' : (g.visual && g.visual.frames > 0
          ? (g.visual.kind === 'td' ? 'hero' : g.visual.frames > 17 ? 'contact' : 'fall') : 'run');
        if (!caught && g.visual && g.visual.frames > 0) g.visual.frames--;
        rimmed(RUN20[Math.floor(r.frame) % 3], rx, ry0, BALL20, 0, 0.3 + 0.45 * loose,
          { pose: visualPose, frame: r.frame, dir: r.dir, ball: true });
      } else {
        const nearBall = g.ball && Math.hypot(g.ball.x - r.x, g.ball.y - r.y) < 18;
        sprite(RUN20[Math.floor(r.frame) % 3], rx, ry0, null, 0, null,
          { pose: nearBall ? 'catch' : 'run', frame: r.frame, dir: r.dir });
      }
      setJersey(g.qbTeam);
      if (g.state !== 'yac') {
        sprite(RUN20[0], Math.round(g.qb.x) - HALF, Math.round(g.qb.y - g.camY) - HALF);
        setJersey(g.backTeam || g.qbTeam);
        sprite(RUN20[0], Math.round(g.rb.x) - HALF, Math.round(g.rb.y - g.camY) - HALF);
      }
      if (g.ball) {
        const bp = projectPoint(g.ball.x, g.ball.y - g.camY);
        const bs = Math.max(.72, bp.scale);
        ctx.fillStyle = PAL.D;
        for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 2]])
          ctx.fillRect(bp.x - bs + dx * bs, bp.y + dy * bs, 3 * bs, 2 * bs);
        ctx.fillStyle = PAL.O;
        ctx.fillRect(bp.x - bs, bp.y, 3 * bs, 2 * bs);
        ctx.fillRect(bp.x, bp.y - bs, bs, 4 * bs);
      }
      FX.draw(g.camY);
    },
    onUp(pt) {
      if (g.state === 'ready' || g.state === 'yac') return;   // both play themselves
      if (g.state === 'result' || g.state === 'td') { this.setup(); return; }
      if (g.state === 'gameover') { this.reset(); g.state = 'select'; return; }
      // The tap arrives in screen space; the throw is aimed in world space.
      if (g.state === 'live') this.throwTo(pt ? { x: pt.x, y: pt.y + g.camY } : null);
    },
    score() { return { value: g.tds, tie: g.yards, detail: `${g.comp}/${g.att} · ${g.yards} yd` }; },
    status() {
      const t = g.marker <= EZ ? 'GOAL' : Math.max(1, Math.round((g.los - g.marker) / YARD));
      const pct = g.att ? Math.round((g.comp / g.att) * 100) : 0;
      return `<span>DOWN <b>${g.down}</b></span><span>TO GO <b>${t}</b></span>`
        + `<span><b>${g.comp}/${g.att}</b> ${pct}%</span>`
        + (g.chem ? `<span class="chem">${g.qbTeam}</span>` : '')
        + `<span class="sc">${g.tds} TD</span>`;
    },
    overlay() {
      const t = g.marker <= EZ ? 'GOAL' : Math.max(1, Math.round((g.los - g.marker) / YARD));
      if (g.state === 'live' || g.state === 'ball' || g.state === 'ready' || g.state === 'yac') return null;
      if (g.state === 'result') {
        if (g.firstDown) return { ttl: 'First down', gold: true, sub: `${g.gain} yd · ${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
        if (g.result === 'complete') return { ttl: 'Complete', sub: `${g.gain} yd · ${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
        if (g.result === 'sack') return { ttl: 'Sacked', bad: true, sub: `${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
        return { ttl: 'Incomplete', sub: `${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
      }
      if (g.state === 'td') return { ttl: 'Touchdown', gold: true, sub: `${g.gain} yd strike`, tap: 'tap to continue' };
      return { ttl: g.result === 'int' ? 'Intercepted' : 'Turnover on downs', bad: true,
               sub: `${g.comp}/${g.att} · ${g.yards} yards · ${g.tds} TD`, tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };

})();

// ===========================================================================
// GAME 3 — KICK
// ===========================================================================
const KICK_GAME = (() => {
  const PPY = 4;                              // logical px per yard downfield
  const SPR = 20, HALF = 10;
  const SAMPLE = 'B. Aubrey:DAL:0.95:0.86:0.80|H. Butker:KC:0.82:0.90:0.86|'
    + 'J. Tucker:BAL:0.88:0.94:0.72|C. Boswell:PIT:0.74:0.92:0.78';
  const wr = mulberry32(hashSeed(SEED + '|wind'));
  const WIND = Math.round((wr() * 2 - 1) * 10) / 10;          // -1 .. 1
  const WIND_LABEL = Math.abs(WIND) < 0.22 ? 'No wind'
    : `${Math.abs(WIND) > 0.66 ? 'Strong' : 'Light'} wind ${WIND < 0 ? 'left' : 'right'}`;
  const POST_HALF = 13;                        // half the gap between uprights
  let tick = 0;                                // frames, for the streamers

  let A = {}, g = null;
  return {
    key: 'kick', label: 'Kick', pickTitle: 'Choose your kicker',
    shell: WIND_LABEL, attrLabels: ['Leg', 'Accuracy', 'Nerve'],
    hint: 'tap to set power · tap to set aim',
    controls: [['Tap', 'start the power meter'], ['Tap again', 'lock power — longer kicks need more'],
               ['Third tap', 'lock aim as the marker sweeps'],
               ['Wind', 'read the streamers — aim into it'],
               ['Every make', 'moves you back five yards']],
    roster: parseRoster('kick', SAMPLE),
    reset() {
      g = { dist: 25, made: 0, longest: 0, embedded: false, auto: false, state: 'select', phase: 'power',
            power: 0, powerDir: 1, aim: 0, aimDir: 1, lockedPower: 0, lockedAim: 0,
            ball: null, result: '' };
      this.g = g;
    },
    attach(p) {
      A = { MAX: 38 + 27 * p.a, AIMSPD: 0.030 - 0.014 * p.b, PWRSPD: 0.026 - 0.010 * p.c };
      g.team = p.team;
    },
    choose(p) { this.attach(p); this.setup(); g.state = 'ready'; },
    /** A single attempt from a set distance, for a drive. `auto` locks the
     *  power meter and leaves only the aim — the difference between a field
     *  goal, which is a decision, and an extra point, which is a formality
     *  you should not have to work a three-tap meter for. */
    kickFrom(dist, auto) {
      g.dist = dist;
      this.setup();
      g.embedded = true; g.auto = !!auto;
    },
    outcome() { return { made: g.result === 'good' }; },
    /** The longest this kicker can reach, so a drive knows what to offer. */
    maxRange() { return Math.floor(A.MAX || 0); },
    setup() {
      g.phase = 'power'; g.power = 0; g.powerDir = 1; g.aim = 0; g.aimDir = 1;
      g.ball = null; g.state = 'ready';
    },
    kick() {
      // required power scales with distance against this kicker's max range
      const need = g.dist / A.MAX;
      const short = g.lockedPower < need;
      // aim error plus wind drift over the flight
      const drift = g.lockedAim * 30 + WIND * (g.dist / 60) * 26;
      g.ball = { t: 0, drift, short, need };
      g.state = 'flight';
    },
    step() {
      if (g.state === 'aiming' || g.state === 'charging') {
        if (g.phase === 'power') {
          g.power += g.powerDir * A.PWRSPD;
          if (g.power >= 1) { g.power = 1; g.powerDir = -1; }
          if (g.power <= 0) { g.power = 0; g.powerDir = 1; }
        } else {
          g.aim += g.aimDir * A.AIMSPD;
          if (g.aim >= 1) { g.aim = 1; g.aimDir = -1; }
          if (g.aim <= -1) { g.aim = -1; g.aimDir = 1; }
        }
        return;
      }
      if (g.state !== 'flight') return;
      const b = g.ball;
      b.t += 0.016;
      const reach = b.short ? (g.lockedPower / b.need) : 1;
      if (b.t >= reach || b.t >= 1) {
        if (b.short) { g.result = 'short'; g.state = 'miss'; }
        else if (Math.abs(b.drift) > POST_HALF) { g.result = b.drift < 0 ? 'wide left' : 'wide right'; g.state = 'miss'; }
        else {
          g.made++; g.longest = Math.max(g.longest, g.dist);
          if (!g.embedded) g.dist += 5;   // the ladder is the standalone game
          g.result = 'good'; g.state = 'good';
        }
      }
    },
    render() {
      tick++;
      CAMERA.enabled = false;
      ctx.fillStyle = '#08090b'; ctx.fillRect(0, 0, VW, VH);
      const groundY = VH - 34;
      const postY = groundY - g.dist * PPY;
      // yard ticks between the spot and the posts
      for (let y = 5; y < g.dist; y += 5) {
        const sy = Math.round(groundY - y * PPY);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(VW / 2 - 12, sy, 4, 1); ctx.fillRect(VW / 2 + 8, sy, 4, 1);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(2, 0, 1, VH); ctx.fillRect(VW - 3, 0, 1, VH);

      // uprights: crossbar plus two posts
      const cx = VW / 2;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(cx - POST_HALF, Math.round(postY), POST_HALF * 2, 1);
      ctx.fillRect(cx - POST_HALF, Math.round(postY) - 26, 1, 26);
      ctx.fillRect(cx + POST_HALF, Math.round(postY) - 26, 1, 26);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(cx, Math.round(postY), 1, groundY - postY);       // the line of the kick

      // Streamers on the uprights: which way it is blowing and how hard,
      // the way a kicker actually reads it before lining one up. They ripple
      // between two shapes, and the harder it blows the faster they snap
      // between them — direction alone was a static read of a moving thing.
      const calm = Math.abs(WIND) < 0.22;
      const fdir = WIND < 0 ? -1 : 1;
      const flen = calm ? 2 : Math.round(3 + Math.abs(WIND) * 7);
      const ftop = Math.round(postY) - 26;
      const beat = calm ? 26 : Math.max(5, Math.round(20 - Math.abs(WIND) * 13));
      const phase = Math.floor(tick / beat) % 2;
      ctx.fillStyle = calm ? 'rgba(255,255,255,0.26)' : PAL.O;
      for (const px of [cx - POST_HALF, cx + POST_HALF]) {
        for (let i = 1; i <= flen; i++) {
          // A one-pixel wave down the length, inverted on the off beat.
          const wave = calm ? 0 : Math.round(Math.sin(i * 0.85 + phase * Math.PI));
          ctx.fillRect(px + fdir * i, ftop + wave, 1, 1);
        }
      }

      // kicker — in his own club's colours, like everyone else
      setJersey(g.team);
      sprite(RUN20[0], Math.round(cx) - HALF - 8, groundY - HALF);

      if (g.state === 'flight' || g.state === 'good' || g.state === 'miss') {
        const b = g.ball;
        const prog = Math.min(1, b.t / (b.short ? (g.lockedPower / b.need) : 1));
        const y = groundY + (postY - groundY) * prog;
        const x = cx + b.drift * prog;
        const hgt = Math.sin(prog * Math.PI);                         // reads as height
        const r = 1 + Math.round(hgt * 1.6);
        ctx.fillStyle = PAL.O;
        ctx.fillRect(Math.round(x) - r, Math.round(y) - r, r * 2, r * 2);
      } else {
        ctx.fillStyle = PAL.O;
        ctx.fillRect(Math.round(cx) - 1, groundY - 1, 3, 2);
      }

      // meters — hairline, only while they matter
      if (g.state === 'aiming' || g.state === 'charging' || g.state === 'ready') {
        // An extra point locks its own power, so there is no meter to read:
        // drawing one that sits at zero and then jumps to the middle on the
        // first tap only suggests you missed your moment.
        if (!g.auto) {
          const mx = VW - 14, top = 40, h = VH - 110;
          ctx.fillStyle = 'rgba(255,255,255,0.16)';
          ctx.fillRect(mx, top, 1, h); ctx.fillRect(mx - 3, top, 7, 1); ctx.fillRect(mx - 3, top + h, 7, 1);
          const pv = g.phase === 'power' ? g.power : g.lockedPower;
          ctx.fillStyle = g.phase === 'power' ? '#ffffff' : 'rgba(255,255,255,0.42)';
          ctx.fillRect(mx - 4, Math.round(top + h - pv * h), 9, 1);
        }

        const by = VH - 18, bw = 88;
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(cx - bw / 2, by, bw, 1);
        ctx.fillRect(cx, by - 3, 1, 7);
        const av = g.phase === 'aim' ? g.aim : g.lockedAim;
        if (g.auto || g.phase === 'aim' || g.state !== 'ready') {
          ctx.fillStyle = g.phase === 'aim' ? '#ffffff' : 'rgba(255,255,255,0.42)';
          ctx.fillRect(Math.round(cx + av * (bw / 2)) - 1, by - 4, 3, 9);
        }
      }
    },
    onUp() {
      if (g.state === 'ready') {
        if (g.auto) {
          g.lockedPower = Math.min(1, g.dist / A.MAX + 0.12);
          g.phase = 'aim'; g.state = 'aiming'; return;
        }
        g.state = 'charging'; g.phase = 'power'; return;
      }
      if (g.state === 'charging') { g.lockedPower = g.power; g.phase = 'aim'; g.state = 'aiming'; return; }
      if (g.state === 'aiming') { g.lockedAim = g.aim; this.kick(); return; }
      if (g.state === 'good') { this.setup(); return; }
      if (g.state === 'miss') { this.reset(); g.state = 'select'; return; }
    },
    score() { return { value: g.made, tie: g.longest, detail: g.longest ? `long ${g.longest} yd` : '' }; },
    status() {
      // Wind is worth more than half the gap between the posts on a long
      // attempt, so it has to be readable for the whole session — naming it
      // once on the pick screen just reads as the aim being broken.
      const w = Math.abs(WIND) < 0.22 ? 'CALM'
        : `${WIND < 0 ? '←' : '→'} ${Math.abs(WIND).toFixed(1)}`;
      return `<span>FROM <b>${g.dist}</b> YD</span><span>WIND <b>${w}</b></span>`
        + `<span>MADE <b>${g.made}</b></span>`
        + `<span class="sc">LONG ${g.longest || '—'}</span>`;
    },
    overlay(pick) {
      if (g.state === 'charging' || g.state === 'aiming' || g.state === 'flight') return null;
      if (g.state === 'ready') return { ttl: pick.name, sub: `${pick.team} · ${g.dist} yard attempt`,
                                        tap: g.auto ? 'tap to set aim' : 'tap to start power', attrs: !g.embedded && g.made === 0 };
      if (g.state === 'good') return { ttl: 'Good', gold: true, sub: `${g.dist - 5} yd · back to ${g.dist}`, tap: 'tap for the next one' };
      return { ttl: g.result === 'short' ? 'Short' : g.result === 'wide left' ? 'Wide left' : 'Wide right',
               bad: true, sub: `${g.made} made · long ${g.longest || 0} yd`, tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };
})();

// ===========================================================================
// SHELL — tabs, picker, overlay, loop
// ===========================================================================
/** A carry or a sack can go backwards, so say so rather than printing -3. */
const yds = (n) => (n < 0 ? `${-n} yd loss` : `${n} yd`);
const SIDELINED = ['BYE', 'OUT', 'IR', 'PUP', 'SUS'];

/** Who the matchup is against. Empty when the game is not embedded. */
const OPPONENT = new URLSearchParams(location.search).get('opp') || '';
const ORD = ['', '1ST', '2ND', '3RD', '4TH'];
// ===========================================================================
// GAME 4 — DRIVE
//
// One drive, both play types. The controller owns down, distance and field
// position; each play is handed to the run or the pass engine, which keeps
// its own world, its own sprite scale and its own tuned contact maths. They
// share YARD, so the only thing crossing the boundary is a yard count — no
// physics is merged, and neither engine learns about the other.
// ===========================================================================
const DRIVE_GAME = (() => {
  const START = 21, TO_GO = 10;
  /**
   * How many possessions a run gets. This is what ends a game now — the speed
   * ramp used to, by climbing until nothing worked, so every run finished
   * because the numbers ran out rather than because of anything you did.
   *
   * Ten because a decent run lands around five or six scores and six or seven
   * minutes, which is right for something played once a week on a phone, and
   * because a fixed count is the only way two players' scores mean the same
   * thing — which is what a head-to-head matchup needs.
   */
  const POSSESSIONS = 10;
  // States in which the engine still has the ball. Anything else means the
  // play is over and the drive takes back control.
  const PLAYING = ['presnap', 'ready', 'live', 'ball', 'yac', 'charging', 'aiming', 'flight'];
  const TD = 6, XP = 1, FG = 3, XP_YD = 20;
  /**
   * The field is twenty-one yards; a real one is a hundred. Taken literally
   * every field goal is a chip shot, and a bot that simply kicked on every
   * fourth down scored 98 points a game and never once had a drive end. So
   * the drive is mapped onto a real kicking range instead: your own end of
   * it is a sixty-two yarder that most legs cannot reach, and it becomes a
   * gimme only once you have actually driven. Distance is the reason fourth
   * down is a decision.
   */
  const fgYards = (losYards) => 20 + losYards * 2;
  let g = null, cur = null;

  return {
    key: 'drive', label: 'Drive',
    pickTitle: 'Choose your back',
    pickTitle2: 'Choose your passer',
    pickTitle3: 'Choose your target',
    pickTitle4: 'Choose your kicker',
    shell: `${RUN_GAME.shell} · ${PASS_GAME.shell}`,
    attrLabels: RUN_GAME.attrLabels,
    attrLabels2: PASS_GAME.attrLabels,
    attrLabels3: PASS_GAME.attrLabels2,
    attrLabels4: KICK_GAME.attrLabels,
    hint: '',
    /**
     * Swipe up was called a truck here and nowhere else, which was the one
     * line that had to change: it is a power move that commits you into the
     * contact and can be stood up for a loss, so calling it a juke would have
     * taught people to reach for it as an escape.
     *
     * Picking a play is off the mobile list because the tabs and the four
     * cards say it themselves. It stays on the desktop one, where the tabs are
     * switched with the arrow keys and nothing on screen advertises that.
     */
    controls: [['Run cut', 'swipe left / right'],
               ['Run spin', 'tap'],
               ['Run truck', 'swipe up'],
               ['Pass', 'tap when he breaks open']],
    /** Shown instead when there is a real pointer, which is as close as the
     *  page gets to knowing there is a keyboard under it. */
    controlsKeys: [['Pick a play', '← → then a number'],
                   ['Run cut', '← and →'],
                   ['Run spin', 'space, as a defender closes'],
                   ['Run truck', '↑'],
                   ['Pass', 'click when he breaks open']],
    roster: RUN_GAME.roster,
    roster2: PASS_GAME.roster,
    roster3: PASS_GAME.roster2,
    roster4: KICK_GAME.roster,
    chemPair: [1, 2],
    reset() {
      RUN_GAME.reset();
      PASS_GAME.reset();
      KICK_GAME.reset();
      cur = null;
      g = { losYards: START, down: 1, toGo: TO_GO, driveNo: 0, poss: 1,
            tds: 0, yards: 0, gain: 0, how: '', first: false,
            points: 0, fgs: 0, kicking: null,
            calls: { run: 0, pass: 0 }, set: null, menu: null, state: 'select' };
      this.g = g;
    },
    choose(p) { RUN_GAME.attach(p); g.backTeam = p.team; },
    choose2(p) { PASS_GAME.choose(p); g.qbTeam = p.team; },
    choose3(p) {
      PASS_GAME.attach2(p);
      RUN_GAME.mates(g.qbTeam, p.team);
      PASS_GAME.mate(g.backTeam);
    },
    choose4(p) { KICK_GAME.attach(p); this.callPlay(); },
    /**
     * One possession is over, however it ended. Hand back the ball, or end the
     * run if that was the last of them.
     *
     * `scored` is kept separate from the possession count on purpose: it is
     * what the difficulty ramp reads, and the ramp is meant to answer "how well
     * is this going", not "how long has this gone on". A turnover should not
     * make the next defense faster.
     */
    newDrive(scored) {
      if (scored) g.driveNo++;
      if (g.poss >= POSSESSIONS) { SOUND.cue('over', 'final'); g.state = 'gameover'; return; }
      g.poss++;
      g.losYards = START; g.down = 1; g.toGo = TO_GO;
    },
    /** Send the unit on. `kind` decides whether the power meter is yours. */
    kickAt(dist, kind) {
      cur = KICK_GAME;
      g.kicking = kind;
      KICK_GAME.kickFrom(dist, kind === 'xp');
      g.state = 'play';
    },
    /** Set the defense once, show it, and offer the whole playbook against
     *  it. Both engines line up on the same eleven, so the picture you read
     *  is the picture you get whichever of the eight you take. */
    callPlay() {
      const los = EZ + g.losYards * YARD;
      g.set = { off: alignOffense(RUN_GAME.g.rnd, los) };
      g.set.def = alignDefense(RUN_GAME.g.rnd, g.driveNo, los, g.set.off.wrX);
      // Build the playbook once, here — prompt() is called on every repaint,
      // and staging an engine inside it would re-roll the defense each frame.
      // The rows come from the engines themselves, so the red-zone route swap
      // still happens without this knowing about it.
      // Where the chains actually are. Worked out here, not at the snap: the
      // menu no longer covers the field, so the line you have to reach is part
      // of the picture you are choosing against. Clamped at the goal line,
      // which is its own marker already.
      g.mark = Math.max(EZ, EZ + (g.losYards - g.toGo) * YARD);
      PASS_GAME.startAt(g.losYards, g.set, g.mark);
      const passes = PASS_GAME.prompt().options.map((o) => ({ ...o, key: `p:${o.key}`, tab: 'pass' }));
      cur = RUN_GAME;
      RUN_GAME.startAt(g.losYards, g.driveNo, g.set, g.mark);
      const runs = RUN_GAME.prompt().options.map((o) => ({ ...o, key: `r:${o.key}`, tab: 'run' }));
      // Fourth down buys a third tab: take the three, or go for seven.
      const fg = fgYards(g.losYards);
      const canKick = g.down === 4 && fg <= KICK_GAME.maxRange();
      const kick = canKick
        ? [{ key: 'k:fg', label: `${fg} yards`, tab: 'kick', best: 'Leg' }]
        : [];
      g.menu = {
        // The situation is on the card above the field and stays there; all the
        // menu owns is the choice. The only line worth spending is why the kick
        // is missing when it is.
        sub: g.down === 4 && !canKick ? `out of range — ${fg} yards` : '',
        set: g.set,
        tabs: [
          { key: 'run', label: 'Run', who: lineup[0] },
          { key: 'pass', label: 'Pass', who: lineup[1] },
          ...(canKick ? [{ key: 'kick', label: 'Kick', who: lineup[3] }] : []),
        ],
        options: [...runs, ...passes, ...kick],
      };
      g.state = 'call';
    },
    prompt() { return g.state === 'call' ? g.menu : null; },
    pickOption(key) {
      if (g.state !== 'call') return;
      if (key === 'k:fg') { this.kickAt(fgYards(g.losYards), 'fg'); return; }
      const pass = key.startsWith('p:');
      const inner = key.slice(2);
      cur = pass ? PASS_GAME : RUN_GAME;
      // Restaged with the same chains it has been drawing since the call.
      if (pass) PASS_GAME.startAt(g.losYards, g.set, g.mark);
      else RUN_GAME.startAt(g.losYards, g.driveNo, g.set, g.mark);
      g.calls[pass ? 'pass' : 'run']++;
      g.play = pass ? 'pass' : 'run';
      g.state = 'play';
      SOUND.cue('snap', `snap${g.calls.run + g.calls.pass}`);
      cur.pickOption(inner);
    },
    step() {
      if (g.state !== 'play' || !cur) return;
      cur.step();
      if (!PLAYING.includes(cur.state)) this.settle();
    },
    /** The engine reports in yards; the chains are ours. */
    settle() {
      if (g.kicking) { this.settleKick(); return; }
      const o = cur.outcome();
      g.how = o.kind;
      g.gain = o.gain || 0;
      g.yards += Math.max(0, g.gain);
      g.first = false;
      if (o.kind === 'td') {
        g.tds++; g.points += TD;
        SOUND.cue('td', `td${g.tds}`);
        g.state = 'td'; return;            // the kicking unit is next
      }
      if (o.kind === 'int') {
        SOUND.cue('int', `int${g.poss}`);
        this.newDrive(false);
        if (g.state !== 'gameover') g.state = 'result';
        return;
      }
      g.losYards = Math.max(1, g.losYards - g.gain);
      g.toGo -= g.gain;
      if (g.toGo <= 0) {
        g.down = 1;
        g.toGo = Math.min(TO_GO, g.losYards);
        g.first = true;
        SOUND.cue('first', `1st${g.driveNo}-${g.losYards}`);
        g.state = 'result'; return;
      }
      g.down++;
      if (g.down > 4) {
        SOUND.cue('over', `downs${g.poss}`);
        g.how = 'downs';
        this.newDrive(false);
        if (g.state !== 'gameover') g.state = 'result';
        return;
      }
      g.state = 'result';
    },
    /** The kick closes a possession either way — the touchdown that came before
     *  it already counted, and a missed field goal is a possession spent. */
    settleKick() {
      const made = cur.outcome().made;
      const kind = g.kicking;
      g.kicking = null; g.gain = 0;
      if (kind === 'xp') {
        if (made) { g.points += XP; SOUND.cue('xp', `xp${g.tds}`); }
        g.how = made ? 'xp' : 'xpmiss';
        this.newDrive(true);                 // the touchdown is what sped them up
      } else if (made) {
        g.points += FG; g.fgs++;
        SOUND.cue('fg', `fg${g.fgs}`);
        g.how = 'fg';
        this.newDrive(true);
      } else {
        SOUND.cue('over', `fgmiss${g.poss}`);
        g.how = 'fgmiss';
        this.newDrive(false);
      }
      if (g.state !== 'gameover') g.state = 'result';
    },
    render() {
      if (!cur) return;
      if (FX.shake < 0.05) { cur.render(); return; }
      // Painted flat first and untranslated: the world moves under the frame,
      // and a background that moved with it would leave an unpainted strip
      // along whichever edge the kick came from.
      ctx.fillStyle = '#08090b'; ctx.fillRect(0, 0, VW, VH);
      ctx.save();
      ctx.translate(Math.round((Math.random() - 0.5) * 2 * FX.shake),
                    Math.round((Math.random() - 0.5) * 2 * FX.shake));
      cur.render();
      ctx.restore();
    },
    /** Whichever engine has the ball. */
    get engine() { return cur; },
    onUp(pt, dx, dy) {
      if (g.state === 'td') { this.kickAt(XP_YD, 'xp'); return; }
      if (g.state === 'result') { this.callPlay(); return; }
      if (g.state === 'gameover') { this.reset(); g.state = 'select'; return; }
      if (g.state === 'play' && cur.onUp) cur.onUp(pt, dx, dy);
    },
    score() {
      return { value: g.points, tie: g.yards,
               detail: `${g.tds} TD · ${g.fgs} FG · ${g.yards} yd` };
    },
    /** The permanent readout. Every state that has a drive behind it fills the
     *  same card from here, so the numbers never move or change clothes. */
    readout() {
      const t = g.toGo <= 0 || g.toGo >= g.losYards ? 'GOAL' : g.toGo;
      return {
        dd: `${ORD[g.down]} & ${t}`,
        on: g.losYards,
        drive: `${g.poss}/${POSSESSIONS}`,
        pts: g.points,
        // Rolled once for the week, so it is as true mid-play as pre-snap.
        def: `${RUN_GAME.shell} · ${PASS_GAME.shell}`,
      };
    },
    overlay() {
      if (g.state === 'call' || g.state === 'play') return null;
      const t = g.toGo >= g.losYards ? 'GOAL' : g.toGo;
      const NAME = { td: 'Touchdown', tackled: 'Tackled', stuffed: 'Stood up',
                     complete: 'Complete', incomplete: 'Incomplete', sack: 'Sacked' };
      const next = `tap for drive ${g.poss}`;
      if (g.state === 'result') {
        if (g.how === 'xp') return { ttl: 'Extra point', gold: true, sub: `${g.points} points`, tap: next };
        if (g.how === 'xpmiss') return { ttl: 'Missed the extra', bad: true, sub: `${g.points} points`, tap: next };
        if (g.how === 'fg') return { ttl: 'Field goal', gold: true, sub: `${g.points} points`, tap: next };
        // Losing the ball costs a possession now rather than the run, so these
        // read as a setback and hand you the next one.
        if (g.how === 'int') return { ttl: 'Intercepted', bad: true, sub: `${g.points} points`, tap: next };
        if (g.how === 'fgmiss') return { ttl: 'Missed the kick', bad: true, sub: `${g.points} points`, tap: next };
        if (g.how === 'downs') return { ttl: 'Turnover on downs', bad: true, sub: `${g.points} points`, tap: next };
        const ttl = g.first ? 'First down' : (NAME[g.how] || 'Stopped');
        return { ttl, gold: g.first, bad: g.how === 'sack' || g.how === 'stuffed',
                 sub: `${yds(g.gain)} · ${ORD[g.down]} & ${t}`, tap: 'tap for the next call' };
      }
      if (g.state === 'td') return { ttl: 'Touchdown', gold: true, sub: `${g.points} points`, tap: 'tap for the extra point' };
      // Every run ends the same way now — the possessions are spent — so the
      // last play is detail rather than the headline.
      return { ttl: MODE === 'matchup' ? 'Final' : 'Final · practice', gold: MODE === 'matchup',
               sub: `${g.points} points · ${g.tds} TD · ${g.fgs} FG · ${g.yards} yards`,
               tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };

})();

// Run and Pass are retired as tabs — they are the same two engines, and the
// drive is the game they add up to. Both are still constructed above because
// the drive delegates its plays to them.
// The drive is the game. Kick is still constructed because the drive hands
// its extra points and field goals to it, it just has no tab of its own any
// more — and neither does anything else, because there is nothing to choose
// between. The board moves to the host's nav.
let active = DRIVE_GAME;
let pick = null;

const el = (id) => document.getElementById(id);
const picker = el('picker'), plist = el('plist');
const promptEl = el('prompt'), propts = el('propts'), prtabs = el('prtabs'), hud = el('hud');
// The lineup being built, and which spot is open for a swap (null = none).
let pick2 = null, picks = [], lineup = [], swapAt = null;
// Set once a lineup is complete and the run has begun. The game drops itself
// back to 'select' when it ends, and this is what tells the picker that what
// it is looking at is last game's lineup rather than one being built.
let ran = false;
const overlay = el('overlay'), ttl = el('ttl'), sub = el('sub'), tapEl = el('tap'), attrs = el('attrs');
const brief = el('brief'), blist = el('blist');
let briefing = false;

brief.addEventListener('pointerup', () => { briefing = false; paintUI(); });


// `name:team:a:b:c:trend:ta:tb:tc:status:id` — trend flags a rung moved in the
// last few weeks, so a player who just levelled is visible before you pick him.
// The id is only used to ask the host for a player card.
function parseRoster(param, sample) {
  return (new URLSearchParams(location.search).get(param) || sample).split('|').map((r) => {
    const [name, tm, a, b, c, tr, ta, tb, tc, st, id, fat, wa, wb, wc] = r.split(':');
    const tier = (v) => Math.max(0, Math.min(4, parseInt(v, 10) || 0));
    return {
      name: (name || 'Player').toUpperCase(), team: (tm || '').toUpperCase(),
      a: clamp01(parseFloat(a)), b: clamp01(parseFloat(b)), c: clamp01(parseFloat(c)),
      trend: Math.max(-1, Math.min(1, parseInt(tr, 10) || 0)),
      // '' when he can play, otherwise why not. SIDELINED cannot be chosen.
      status: (st || '').toUpperCase(),
      id: id || '',
      // 0 fresh to 1 gassed. The ratings arriving above are already faded by
      // it — this is only so the row can say why they look low.
      fatigue: clamp01(parseFloat(fat)),
      // Where each rating stood a week ago, so a bar can show what moved.
      was: [wa, wb, wc].map((v) => (v === undefined || v === '' ? null : clamp01(parseFloat(v)))),
      tiers: [tier(ta), tier(tb), tier(tc)].map((t, i) => tierName(param, i, t)),
    };
  });
}

/**
 * `was` is last week's level.
 *
 * A week moves a rating by about a thirtieth on a 0..1 scale — a quarter of a
 * segment here — so marking the stretch between then and now shows nothing at
 * all most weeks. The mark goes on the leading segment instead: direction on
 * the bar, magnitude left to the strip above, which only speaks when a rung
 * actually changed hands. When a move is big enough to span segments, the whole
 * span is marked and it reads as the bigger week it was.
 */
const MOVED = 0.004;
function segs(v, n, cls, was) {
  const on = Math.max(1, Math.round(v * n));
  const dir = was == null ? 0 : v - was > MOVED ? 1 : was - v > MOVED ? -1 : 0;
  const before = was == null ? on : Math.max(1, Math.round(was * n));
  const lo = Math.min(before, on), hi = Math.max(before, on);
  let s = '';
  for (let i = 0; i < n; i++) {
    const lit = i < on;
    const inSpan = hi > lo ? i >= lo && i < hi : i === on - 1;
    s += `<span class="${cls}${lit ? ' on' : ''}`
      + `${dir > 0 && inSpan ? ' up' : ''}${dir < 0 && inSpan ? ' down' : ''}"></span>`;
  }
  return s;
}

/** A game asks for one, two or three players; the picker walks the stages it
 *  declares. chemPair names which two of them are the battery. */
function stagesOf(gm) {
  const out = [{ title: gm.pickTitle, list: gm.roster, choose: gm.choose }];
  if (gm.roster2 && gm.roster2.length)
    out.push({ title: gm.pickTitle2, list: gm.roster2, choose: gm.choose2 });
  if (gm.roster3 && gm.roster3.length)
    out.push({ title: gm.pickTitle3, list: gm.roster3, choose: gm.choose3 });
  if (gm.roster4 && gm.roster4.length)
    out.push({ title: gm.pickTitle4, list: gm.roster4, choose: gm.choose4 });
  return out;
}
/** "Choose your target" → "target". The stage titles are the only place the
 *  slot is named, so the short label comes off them rather than a second list
 *  to keep in step. */
const slotOf = (title) => title.replace(/^choose your\s+/i, '');

/** Lists arrive sorted available-first then strongest, so the head of each is
 *  the pick you would almost always make. */
const bestOf = (list) => list.find((p) => !SIDELINED.includes(p.status)) || list[0];

const BRIEF_KEY = 'arcade:brief';
const briefSeen = () => { try { return localStorage.getItem(BRIEF_KEY) === '1'; } catch (e) { return true; } };
const markBrief = () => { try { localStorage.setItem(BRIEF_KEY, '1'); } catch (e) { /* private mode */ } };

/** The club a battery shares, or null. */
function batteryTeam(line) {
  const pair = active.chemPair;
  if (!pair) return null;
  const a = line[pair[0]], b = line[pair[1]];
  return a && b && a.team && a.team === b.team ? a.team : null;
}

/** Standalone the card cannot be opened, so the control is not offered. */
const EMBEDDED = (() => { try { return window.parent !== window; } catch (e) { return false; } })();

/** A real pointer means a desktop, which is the closest this page gets to
 *  knowing a keyboard is available. Only ever used to offer more, never less. */
const FINE = (() => {
  try { return window.matchMedia('(pointer: fine)').matches; } catch (e) { return false; }
})();

/** Ask the host for the full player card. It holds the season, the ladders and
 *  the climb; all the game has is nine numbers and a name. */
function openCard(p) {
  if (!p || !p.id || !EMBEDDED) return;
  try {
    parent.postMessage({ source: 'arcade', type: 'card', game: active.key, id: p.id }, '*');
  } catch (e) { /* not embedded after all */ }
}

/** Who he is: name, club and bars. Never a control itself — whatever wraps it
 *  decides what tapping him does. */
function who(p, chem) {
  const out = SIDELINED.includes(p.status);
  const kit = jerseyOf(p.team);
  return `<span class="pmain"><span class="pn">${p.name}</span><span class="pt">`
    + (kit ? `<i class="pchip" style="background:${kit}"></i>` : '')
    + `${p.team}`
    + (out ? `<b class="pout">${p.status}</b>`
           : p.status ? `<b class="prisk">${p.status}</b>` : '')
    + (!out && p.fatigue >= 0.33
        ? `<b class="pwear">${p.fatigue >= 0.66 ? 'gassed' : 'worn'}</b>` : '')
    + (chem && !out ? `<b class="pchem">chemistry</b>` : '')
    + (p.trend && !out ? `<b class="ptrend ${p.trend > 0 ? 'up' : 'down'}">${p.trend > 0 ? '▲' : '▼'}</b>` : '')
    + `</span></span>`
    + `<span class="pbars"><span class="pbar">${segs(p.a, 8, 'pseg', p.was[0])}</span>`
    + `<span class="pbar">${segs(p.b, 8, 'pseg', p.was[1])}</span>`
    + `<span class="pbar">${segs(p.c, 8, 'pseg', p.was[2])}</span></span>`;
}

/**
 * One screen, pre-filled with the best available at each spot.
 *
 * It used to be four screens in sequence and two of them routinely held a
 * single card — most rosters carry one kicker and one or two passers, so
 * "choose" was a tap with nothing to choose between. Six taps stood between
 * loading the page and the first snap; this is two, and the ones it kept are
 * the ones that are actually decisions.
 *
 * Seeing all four at once is the other half of it: you can compare the ladders,
 * and chemistry lights on the lineup as you swap rather than being a one-shot
 * hint on a screen you have already left.
 */
function buildPicker() {
  const stages = stagesOf(active);
  if (lineup.length !== stages.length) lineup = stages.map((s) => bestOf(s.list));
  picker.classList.toggle('swapping', swapAt !== null);
  if (swapAt !== null) return buildSwap(stages);

  const pair = active.chemPair;
  const team = batteryTeam(lineup);
  el('ptitle').textContent = 'Your lineup';
  // The front and the coverage are on the readout above the field, where you
  // are actually choosing against them. Here they were trivia.
  el('pfront').textContent = '';
  el('phint').textContent = 'tap position to change';
  plist.innerHTML = '';
  stages.forEach((st, i) => {
    const p = lineup[i];
    if (!p) return;
    const lit = !!(team && pair && (i === pair[0] || i === pair[1]));
    const slot = slotOf(st.title);
    // Siblings in a plain container, never one button inside another. The
    // whole row bar the i is about changing the lineup — the position because
    // that is what the hint names, and the player because missing a 62px chip
    // should not be punished. The i is only ever information, on both screens.
    const d = document.createElement('div');
    d.className = `pick lineup${lit ? ' chem' : ''}`;
    d.innerHTML = `<button class="pslot" aria-label="Change ${slot}">${slot}<i>›</i></button>`
      + `<button class="pwho" aria-label="Change ${slot}">${who(p, false)}</button>`
      + (EMBEDDED && p.id ? `<button class="pinfo" aria-label="Player card">i</button>` : '');
    const swap = () => { swapAt = i; buildPicker(); };
    d.querySelector('.pslot').onclick = swap;
    d.querySelector('.pwho').onclick = swap;
    const info = d.querySelector('.pinfo');
    if (info) info.onclick = () => openCard(p);
    plist.appendChild(d);
  });
  el('pchem').textContent = team ? `${team} battery · truer ball` : '';
  const mb = el('pmatch');
  mb.disabled = matchupDone || !sundayOpen;
  // Gold while it is still there to be spent — this is the run that counts,
  // and the one week's worth of it. Once banked it is a receipt, and a receipt
  // is not a call to action.
  mb.classList.toggle('live', !matchupDone && sundayOpen && EMBEDDED);
  mb.innerHTML = matchupDone
    ? `Sunday Run · ${matchupValue} pts`
    : !sundayOpen ? 'Sunday Run · locked'
    : OPPONENT ? `Sunday Run <i>vs ${OPPONENT}</i>` : 'Sunday Run';
}

/** One position's list, opened from the lineup. */
function buildSwap(stages) {
  const st = stages[swapAt];
  const pair = active.chemPair;
  // The other half of the battery, so a target that would light it is marked.
  const mate = pair && swapAt === pair[1] ? lineup[pair[0]]
             : pair && swapAt === pair[0] ? lineup[pair[1]] : null;
  el('ptitle').textContent = st.title;
  el('pfront').textContent = mate && mate.team ? `${mate.name} · ${mate.team} = chemistry` : '';
  el('pchem').textContent = '';
  // This is the screen where the card earns its place — you are comparing two
  // backs and want to know why one bar is longer.
  el('phint').textContent = 'tap player to field him';
  plist.innerHTML = '';
  st.list.forEach((p) => {
    const out = SIDELINED.includes(p.status);
    const chem = !!(mate && p.team && p.team === mate.team);
    // Here the big target picks him — that is what this screen is for — and the
    // card sits beside it as a sibling rather than nested inside.
    const d = document.createElement('div');
    d.className = `pick${chem && !out ? ' chem' : ''}${out ? ' off' : ''}`;
    d.innerHTML = `<button class="pwho"${out ? ' disabled' : ''}>${who(p, chem)}</button>`
      + (EMBEDDED && p.id ? `<button class="pinfo" aria-label="Player card">i</button>` : '');
    if (!out) {
      d.querySelector('.pwho').onclick = () => { lineup[swapAt] = p; swapAt = null; buildPicker(); };
    }
    const info = d.querySelector('.pinfo');
    if (info) info.onclick = () => openCard(p);
    plist.appendChild(d);
  });
}

/** Fill the how-to-play panel and show it. */
function showBrief() {
  el('btitle').textContent = `${active.label} — how to play`;
  const team = batteryTeam(lineup);
  const levels = team
    ? [`<div class="brow blv"><span class="bk">Chemistry</span>`
       + `<span class="bv">${team} battery · truer ball</span></div>`]
    : [];
  blist.innerHTML = levels.join('')
    + ((FINE && active.controlsKeys) || active.controls)
      .map(([k, v]) => `<div class="brow"><span class="bk">${k}</span><span class="bv">${v}</span></div>`)
      .join('');
  briefing = true;
  markBrief();
  paintUI();
}

/**
 * Attach the whole lineup and snap. The last stage's choose() calls the first
 * play, so every other man has to be attached before it fires.
 *
 * The mode is fixed here rather than at the end: it decides the salt, so it has
 * to be settled before any engine resets and rolls its first alignment.
 */
function startRun(mode) {
  MODE = matchupDone ? 'practice' : mode;
  SALT = MODE === 'matchup' ? '' : `|p${Date.now().toString(36)}`;
  const stages = stagesOf(active);
  active.reset();                           // re-roll the plays under the new salt
  picks = lineup.slice();
  pick = picks[0]; pick2 = picks[1];
  setJersey(picks[0] && picks[0].team);
  stages.forEach((st, i) => { if (lineup[i]) st.choose.call(active, lineup[i]); });
  ran = true;                               // the lineup is set; the run is this one's
  if (briefSeen()) { briefing = false; paintUI(); return; }
  showBrief();                              // first time only, from here on
}

/** What the host knows about this week's one counted run. */
function setMatchup(done, value, open) {
  matchupDone = !!done;
  matchupValue = Number(value) || 0;
  sundayOpen = !!open;
  if (active.state === 'select') buildPicker();
}

el('ppract').addEventListener('pointerup', (e) => { e.stopPropagation(); startRun('practice'); });
el('pmatch').addEventListener('pointerup', (e) => {
  e.stopPropagation();
  if (!matchupDone && sundayOpen) startRun('matchup');
});

// The host owns the score store, so it is the one that knows whether this
// week's matchup has been used. It answers on boot and again after banking.
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.source !== 'host' || d.type !== 'status') return;
  setMatchup(d.done, d.value, d.open);
});
try { parent.postMessage({ source: 'arcade', type: 'ready', game: 'drive' }, '*'); } catch (e) { /* standalone */ }
el('phow').addEventListener('pointerup', (e) => { e.stopPropagation(); showBrief(); });
el('pback').addEventListener('pointerup', (e) => { e.stopPropagation(); swapAt = null; buildPicker(); });
/** Walk the picker back to its first stage. The lineup lives out here, not in
 *  the game, so a game that resets itself leaves all of this behind. */
function restartPicks() {
  ran = false;
  picks = [];
  pick = null;
  pick2 = null;
  // The lineup survives a replay on purpose: if you went out of your way to
  // swap someone in, having to do it again every run is a tax on the thing the
  // screen exists for. It only rebuilds when the roster itself changes, which
  // is a page load.
  swapAt = null;
  setJersey(null);
  briefing = false;
  buildPicker();
}

function select(game) {
  active = game;
  active.reset();
  el('hint').textContent = game.hint;
  restartPicks();
  paintUI();
}

// ---- the play call -------------------------------------------------------
/** Which half of the playbook is open. Sticky across calls: a pass costs one
 *  extra tap the first time and none after it. */
let playTab = 'run';

/**
 * The play, drawn small — where the ball is going, and nothing else.
 *
 * The cards used to draw the real defensive front behind the path, back when
 * the panel covered the field and this was the only pre-snap read there was.
 * The field is underneath now, at full size, with every defender on it; a
 * second smaller copy of the same eleven in a 62-unit box was the same
 * information twice, and the worse of the two.
 */
const DW = 62, DH = 46, LOS_Y = 32;
const dgx = (x) => 4 + (x / VW) * (DW - 8);
const clampx = (x) => Math.max(3, Math.min(DW - 3, x));
const box = (x, y, w, cls) =>
  `<rect class="${cls}" x="${(clampx(x) - w / 2).toFixed(1)}" y="${(y - w / 2).toFixed(1)}" `
  + `width="${w}" height="${w}" />`;
/** A small triangle at the end of the path, pointing the way it was heading. */
function tip(x0, y0, x1, y1) {
  const a = Math.atan2(y1 - y0, x1 - x0), s = 3.2;
  const p = [0, 2.5, -2.5].map((o) => {
    const t = a + (o * Math.PI) / 3;
    return `${clampx(x1 + Math.cos(t) * (o ? s : s * 0.2)).toFixed(1)},`
      + `${(y1 + Math.sin(t) * (o ? s : s * 0.2)).toFixed(1)}`;
  });
  return `<polygon class="tip" points="${p.join(' ')}" />`;
}

function diagram(tab, o, set) {
  if (!set) return `<svg class="prdiag" viewBox="0 0 ${DW} ${DH}" aria-hidden="true"></svg>`;
  const line = `<line class="los" x1="3" y1="${LOS_Y}" x2="${DW - 3}" y2="${LOS_Y}" />`;

  if (tab === 'kick') {
    const M = DW / 2;
    const s = `<line class="post" x1="${M - 10}" y1="5" x2="${M - 10}" y2="15" />`
      + `<line class="post" x1="${M + 10}" y1="5" x2="${M + 10}" y2="15" />`
      + `<line class="post" x1="${M - 10}" y1="15" x2="${M + 10}" y2="15" />`
      + line
      + box(M, 41, 5.5, 'mine')
      + `<polyline class="path" points="${M},37 ${M},13" />`
      + tip(M, 18, M, 11);
    return `<svg class="prdiag" viewBox="0 0 ${DW} ${DH}">${s}</svg>`;
  }

  let s = line;

  if (tab === 'pass') {
    const wx = dgx(set.off.wrX);
    s += box(wx, LOS_Y, 5.5, 'mine') + box(dgx(set.off.qb.x), 41, 4.4, 'mine');
    // Stretched to fill the card: at true scale a twenty-yard route is a
    // third of an inch and every concept looks like the same short tick.
    const pts = (o.shape || [[0, 0], [0, -18]])
      .map(([x, y]) => [clampx(wx + x * 1.3), Math.max(5, LOS_Y + y * 1.3)]);
    s += `<polyline class="path" points="${pts.map(([x, y]) =>
      `${x.toFixed(1)},${y.toFixed(1)}`).join(' ')}" />`;
    const [ax, ay] = pts[pts.length - 2] || pts[0];
    const [bx, by] = pts[pts.length - 1];
    return `<svg class="prdiag pass" viewBox="0 0 ${DW} ${DH}">${s + tip(ax, ay, bx, by)}</svg>`;
  }

  // The run. Start behind the passer, aim at the gap that was called.
  const bx = dgx(set.off.qb.x), lx = clampx(dgx(o.cx));
  s += box(bx, 41, 5.5, 'mine')
    + `<polyline class="path" points="${bx.toFixed(1)},37 ${bx.toFixed(1)},33 `
    + `${lx.toFixed(1)},25 ${lx.toFixed(1)},12" />`
    + tip(lx, 19, lx, 11);
  return `<svg class="prdiag" viewBox="0 0 ${DW} ${DH}">${s}</svg>`;
}

function paintUI() {
  const g = active;
  const inSelect = g.state === 'select';
  // A finished run drops the game back to 'select' by itself. Reopening the
  // picker where it was left dropped you on the kicker and began a drive with
  // nobody else attached, which is why the rest of the huddle turned out in
  // blank white. Note the state is 'select' the whole time you are picking
  // too, so a run having started is the only safe signal here.
  if (inSelect && ran) { ran = false; restartPicks(); return paintUI(); }
  // The brief can be opened from the lineup now, not just on the way out of it,
  // so it takes precedence over the picker rather than sitting behind it.
  picker.classList.toggle('show', inSelect && !briefing);
  brief.classList.toggle('show', briefing);

  // The readout, filled the same way from the same place whatever is happening
  // on the field. There is no drive behind the lineup screen, so that is the
  // one state it has nothing to say in.
  const rd = !inSelect && g.readout ? g.readout() : null;
  hud.classList.toggle('show', !!rd);
  if (rd) {
    el('prdef').textContent = rd.def;
    el('prdd').textContent = rd.dd;
    el('pron').textContent = rd.on;
    el('prdrive').textContent = rd.drive;
    el('prpts').textContent = rd.pts;
  }

  if (briefing) {
    overlay.classList.remove('show'); attrs.classList.remove('show');
    return;
  }
  const pr = !inSelect && !briefing && g.prompt ? g.prompt() : null;
  if (pr) {
    el('prsub').textContent = pr.sub || '';

    const tabs = pr.tabs || [];
    if (!tabs.some((t) => t.key === playTab)) playTab = tabs.length ? tabs[0].key : '';
    prtabs.innerHTML = '';
    for (const t of tabs) {
      const b = document.createElement('div');
      b.className = `prtab${t.key === playTab ? ' on' : ''}`;
      b.setAttribute('role', 'button');
      b.setAttribute('aria-pressed', String(t.key === playTab));
      b.textContent = t.label;
      b.onclick = () => { playTab = t.key; paintUI(); };
      prtabs.appendChild(b);
    }

    const shown = pr.options.filter((o) => !o.tab || o.tab === playTab);
    propts.innerHTML = '';
    shown.forEach((o, i) => {
      const b = document.createElement('div');
      b.className = 'prcard';
      b.setAttribute('role', 'button');
      b.innerHTML = `<span class="prname">`
        + (FINE ? `<i class="prkey">${i + 1}</i>` : '') + `${o.label}</span>`
        + diagram(playTab, o, pr.set);
      b.onclick = () => { g.pickOption(o.key); paintUI(); };
      propts.appendChild(b);
    });
  }
  promptEl.classList.toggle('show', !!pr);

  if (inSelect) { overlay.classList.remove('show'); attrs.classList.remove('show'); return; }

  const o = g.overlay(pick || g.roster[0]);
  ttl.classList.remove('gold', 'bad');
  overlay.classList.toggle('presnap', !!(o && o.presnap));
  if (!o) { overlay.classList.remove('show'); attrs.classList.remove('show'); return; }
  ttl.textContent = o.ttl;
  if (o.gold) ttl.classList.add('gold');
  if (o.bad) ttl.classList.add('bad');
  sub.textContent = o.sub || '';
  tapEl.textContent = o.tap || '';
  if (o.attrs && pick) {
    attrs.innerHTML = (g.attrLabels || []).map((label, i) =>
      `<div class="attr"><span class="k">${label}</span><span class="bar">`
      + segs([pick.a, pick.b, pick.c][i], 10, 'seg') + '</span>'
      + `<span class="lv">${(pick.tiers || [])[i] || ''}</span></div>`).join('');
  }
  attrs.classList.toggle('show', !!(o.attrs && pick));
  overlay.classList.add('show');
}

// ---- input ---------------------------------------------------------------
let pStart = null;
function logical(e) {
  const r = canvas.getBoundingClientRect();
  const camY = active.g && active.g.camY ? active.g.camY : 0;
  const flat = unprojectPoint(((e.clientX - r.left) / r.width) * VW, ((e.clientY - r.top) / r.height) * VH);
  return { x: flat.x, y: flat.y + camY };
}
// Any touch anywhere is the gesture the audio context needs; it is built on
// the first one and never at load.
document.addEventListener('pointerdown', () => SOUND.wake(), { passive: true });
canvas.addEventListener('pointerdown', (e) => { pStart = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (active.state === 'select') { pStart = null; return; }
  if (briefing) { briefing = false; pStart = null; paintUI(); return; }
  const dx = pStart ? e.clientX - pStart.x : 0;
  const dy = pStart ? e.clientY - pStart.y : 0;
  active.onUp(logical(e), dx, dy);
  pStart = null;
  paintUI();
});
window.addEventListener('keydown', (e) => {
  const tap = e.code === 'Space' || e.key === 'Enter';
  if (briefing) { if (tap || e.key === 'Escape') { e.preventDefault(); briefing = false; paintUI(); } return; }

  if (active.state === 'select') {
    if (e.key === 'Escape' && swapAt !== null) { swapAt = null; buildPicker(); }
    // Enter takes the run that counts while it is still there.
    else if (tap && swapAt === null) { e.preventDefault(); startRun(matchupDone ? 'practice' : 'matchup'); }
    return;
  }

  // Calling a play: the arrows walk the tabs, the numbers take a card off the
  // one that is open. Numbering the whole playbook again would mean 3 meaning
  // a different play depending on a tab you cannot see from the keyboard.
  const pr = active.prompt ? active.prompt() : null;
  if (pr) {
    const tabs = pr.tabs || [];
    const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (step && tabs.length) {
      e.preventDefault();
      const at = Math.max(0, tabs.findIndex((t) => t.key === playTab));
      playTab = tabs[(at + step + tabs.length) % tabs.length].key;
      paintUI();
      return;
    }
    const shown = pr.options.filter((o) => !o.tab || o.tab === playTab);
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= shown.length) {
      e.preventDefault();
      active.pickOption(shown[n - 1].key);
      paintUI();
    }
    return;
  }

  // Arrows steer the runner and nothing else. They used to fall through to the
  // same onUp that advances a screen, so holding one as you crossed the goal
  // line took the extra point for you before you had seen the touchdown.
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp') {
    if (active.state !== 'play') return;
    e.preventDefault();
    const dx = e.key === 'ArrowLeft' ? -40 : e.key === 'ArrowRight' ? 40 : 0;
    active.onUp({ x: 0, y: 0 }, dx, e.key === 'ArrowUp' ? -40 : 0);
    paintUI();
    return;
  }
  // A tap is one press. Auto-repeat would run the touchdown, the extra point
  // and the next call together on a held key.
  if (tap && !e.repeat) { e.preventDefault(); active.onUp({ x: VW / 2, y: 0 }, 0, 0); paintUI(); }
});

/** Terminal states differ per game: the kick run ends on the first miss. */
const isOver = (g) => g.state === 'gameover' || (g.key === 'kick' && g.state === 'miss');

const CINE = {
  flare: 0,
  trigger(state) { if (state === 'td' || state === 'good') this.flare = 70; else if (state === 'gameover') this.flare = 38; },
  draw() {
    if (this.flare > 0) this.flare--;
    ctx.save();
    // A quiet lens vignette makes the logical 180px field read like a camera,
    // not a UI panel. Scoring briefly warms it into the app's gold.
    const edge = ctx.createRadialGradient(VW / 2, VH * .55, VH * .12, VW / 2, VH * .55, VH * .72);
    edge.addColorStop(0, 'rgba(0,0,0,0)'); edge.addColorStop(1, 'rgba(0,0,0,.42)');
    ctx.fillStyle = edge; ctx.fillRect(0, 0, VW, VH);
    if (this.flare > 0) {
      const a = Math.sin((this.flare / 70) * Math.PI) * .22;
      const glow = ctx.createRadialGradient(VW / 2, VH * .48, 2, VW / 2, VH * .48, VW * .72);
      glow.addColorStop(0, `rgba(232,197,97,${a})`); glow.addColorStop(1, 'rgba(232,197,97,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, VW, VH);
    }
    ctx.restore();
  },
};

let reported = '';
function reportScore() {
  if (!active.score || !active.g) return;
  const r = active.score();
  // A practice run is not reported at all. It used to be sent and quietly
  // dropped by the host as a duplicate, which is how the first run of the week
  // ended up being the one that counted whether you meant it to or not.
  if (MODE !== 'matchup') return;
  // Guard against the same finish being posted twice by a repaint.
  const stamp = `${active.key}:${r.value}:${r.tie}:${r.detail}`;
  if (stamp === reported) return;
  reported = stamp;
  try {
    parent.postMessage({
      source: 'arcade', type: 'score', game: active.key, mode: MODE,
      value: r.value, tie: r.tie || 0, detail: r.detail,
      player: pick ? pick.name : '', team: pick ? pick.team : '', seed: SEED,
      // Who was on the field, so the host can put miles on them.
      lineup: picks.filter((p) => p && p.id).map((p) => p.id),
    }, '*');
  } catch { /* standalone, not embedded */ }
}

// ---- loop ----------------------------------------------------------------
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  const before = active.state;
  while (acc >= 1000 / 60) {
    // Hitstop stops everything, dust included. A collision reads as a
    // collision because the world admits it happened before carrying on.
    if (FX.stop > 0) FX.stop--;
    else if (active.state !== 'select') { active.step(); FX.step(); }
    acc -= 1000 / 60;
  }
  if (before !== active.state) { CINE.trigger(active.state); paintUI(); }
  // Checked every frame rather than only on the transition into it. reportScore
  // already refuses to send the same finish twice, and a missed transition
  // meant a banked run silently never reaching the host — the worst thing this
  // can get wrong.
  if (isOver(active)) reportScore();
  if (active.state !== 'select' && active.g) { active.render(); CINE.draw(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

el('build').textContent = `build ${BUILD}`;
select(DRIVE_GAME);
const soundEl = el('sound');
function paintSound() { soundEl.textContent = SOUND.on ? 'SOUND' : 'MUTED'; }
soundEl.addEventListener('pointerup', (e) => { e.stopPropagation(); SOUND.toggle(); paintSound(); });
paintSound();

window.__active = () => active;
// For harnesses: which mode the current run is, and the salt behind its rolls.
window.__mode = () => ({ mode: MODE, salt: SALT, matchupDone });
</script>
</body>
</html>
