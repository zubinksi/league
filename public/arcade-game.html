      // and staging an engine inside it would re-roll the defense each frame.
      // The rows come from the engines themselves, so the red-zone route swap
      // still happens without this knowing about it.
      PASS_GAME.startAt(g.losYards, g.set);
      const passes = PASS_GAME.prompt().options.map((o) => ({ ...o, key: `p:${o.key}`, row: 1 }));
      cur = RUN_GAME;
      RUN_GAME.startAt(g.losYards, g.driveNo, g.set);
      const runs = RUN_GAME.prompt().options.map((o) => ({ ...o, key: `r:${o.key}` }));
      // Fourth down buys a third row: take the three, or go for seven.
      const fg = fgYards(g.losYards);
      const kick = g.down === 4 && fg <= KICK_GAME.maxRange()
        ? [{ key: 'k:fg', label: `Field goal ${fg}`, row: 2 }]
        : [];
      g.menu = {
        rowLabels: ['Run', 'Pass', '4th'],
        title: `${ORD[g.down]} & ${g.toGo <= 0 || g.toGo >= g.losYards ? 'GOAL' : g.toGo}`,
        // The buttons and the down say it; the only thing worth a line is
        // why the kick is missing when it is.
        sub: g.down === 4 && !kick.length ? `out of range — ${fg} yards` : '',
        options: [...runs, ...passes, ...kick],
      };
      g.state = 'call';
    },
    prompt() { return g.state === 'call' ? g.menu : null; },
    pickOption(key) {
      if (g.state !== 'call') return;
      if (key === 'k:fg') { this.kickAt(fgYards(g.losYards), 'fg'); return; }
      const pass = key.startsWith('p:');
      const inner = key.slice(2);
      cur = pass ? PASS_GAME : RUN_GAME;
      if (pass) PASS_GAME.startAt(g.losYards, g.set);
      else RUN_GAME.startAt(g.losYards, g.driveNo, g.set);
      g.calls[pass ? 'pass' : 'run']++;
      g.play = pass ? 'pass' : 'run';
      g.state = 'play';
      cur.pickOption(inner);
    },
    step() {
      if (g.state !== 'play' || !cur) return;
      cur.step();
      if (!PLAYING.includes(cur.state)) this.settle();
    },
    /** The engine reports in yards; the chains are ours. */
    settle() {
      if (g.kicking) { this.settleKick(); return; }
      const o = cur.outcome();
      g.how = o.kind;
      g.gain = o.gain || 0;
      g.yards += Math.max(0, g.gain);
      g.first = false;
      if (o.kind === 'td') {
        g.tds++; g.points += TD;
        SOUND.cue('td', `td${g.tds}`);
        g.state = 'td'; return;            // the kicking unit is next
      }
      if (o.kind === 'int') { SOUND.cue('int', 'int'); g.state = 'gameover'; return; }
      g.losYards = Math.max(1, g.losYards - g.gain);
      g.toGo -= g.gain;
      if (g.toGo <= 0) {
        g.down = 1;
        g.toGo = Math.min(TO_GO, g.losYards);
        g.first = true;
        SOUND.cue('first', `1st${g.driveNo}-${g.losYards}`);
        g.state = 'result'; return;
      }
      g.down++;
      if (g.down > 4) SOUND.cue('over', 'downs');
      g.state = g.down > 4 ? 'gameover' : 'result';
    },
    /** A kick is the one play that can end the run without a turnover: miss
     *  it and the drive is over the same as failing on fourth down. */
    settleKick() {
      const made = cur.outcome().made;
      const kind = g.kicking;
      g.kicking = null; g.gain = 0;
      if (kind === 'xp') {
        if (made) { g.points += XP; SOUND.cue('xp', `xp${g.tds}`); }
        g.how = made ? 'xp' : 'xpmiss';
        this.newDrive();
        g.state = 'result'; return;
      }
      if (!made) { SOUND.cue('over', 'fgmiss'); g.how = 'fgmiss'; g.state = 'gameover'; return; }
      g.points += FG; g.fgs++;
      SOUND.cue('fg', `fg${g.fgs}`);
      g.how = 'fg';
      this.newDrive();
      g.state = 'result';
    },
    render() { if (cur) cur.render(); },
    /** Whichever engine has the ball. */
    get engine() { return cur; },
    onUp(pt, dx, dy) {
      if (g.state === 'td') { this.kickAt(XP_YD, 'xp'); return; }
      if (g.state === 'result') { this.callPlay(); return; }
      if (g.state === 'gameover') { this.reset(); g.state = 'select'; return; }
      if (g.state === 'play' && cur.onUp) cur.onUp(pt, dx, dy);
    },
    score() {
      return { value: g.points, tie: g.yards,
               detail: `${g.tds} TD · ${g.fgs} FG · ${g.yards} yd` };
    },
    status() {
      const t = g.toGo >= g.losYards ? 'GOAL' : g.toGo;
      return `<span>DOWN <b>${g.down}</b></span><span>TO GO <b>${t}</b></span>`
        + `<span>BALL ON <b>${g.losYards}</b></span><span class="sc">${g.points} PTS</span>`;
    },
    overlay() {
      if (g.state === 'call' || g.state === 'play') return null;
      const t = g.toGo >= g.losYards ? 'GOAL' : g.toGo;
      const NAME = { td: 'Touchdown', tackled: 'Tackled', stuffed: 'Stood up',
                     complete: 'Complete', incomplete: 'Incomplete', sack: 'Sacked' };
      if (g.state === 'result') {
        if (g.how === 'xp') return { ttl: 'Extra point', gold: true, sub: `${g.points} points`, tap: 'tap for the next drive' };
        if (g.how === 'xpmiss') return { ttl: 'Missed the extra', bad: true, sub: `${g.points} points`, tap: 'tap for the next drive' };
        if (g.how === 'fg') return { ttl: 'Field goal', gold: true, sub: `${g.points} points`, tap: 'tap for the next drive' };
        const ttl = g.first ? 'First down' : (NAME[g.how] || 'Stopped');
        return { ttl, gold: g.first, bad: g.how === 'sack' || g.how === 'stuffed',
                 sub: `${yds(g.gain)} · ${ORD[g.down]} & ${t}`, tap: 'tap for the next call' };
      }
      if (g.state === 'td') return { ttl: 'Touchdown', gold: true, sub: `${g.points} points`, tap: 'tap for the extra point' };
      const how = g.how === 'int' ? 'Intercepted'
        : g.how === 'fgmiss' ? 'Missed the kick' : 'Turnover on downs';
      return { ttl: how, bad: true,
               sub: `${g.points} points · ${g.tds} TD · ${g.fgs} FG · ${g.yards} yards`,
               tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };

})();

// Run and Pass are retired as tabs — they are the same two engines, and the
// drive is the game they add up to. Both are still constructed above because
// the drive delegates its plays to them.
// The drive is the game. Kick is still constructed because the drive hands
// its extra points and field goals to it, it just has no tab of its own any
// more — and neither does anything else, because there is nothing to choose
// between. The board moves to the host's nav.
let active = DRIVE_GAME;
let pick = null;

const el = (id) => document.getElementById(id);
const picker = el('picker'), plist = el('plist');
const promptEl = el('prompt'), propts = el('propts');
let pick2 = null, pickStage = 0, picks = [];
// Set once a lineup is complete and the run has begun. The game drops itself
// back to 'select' when it ends, and this is what tells the picker that what
// it is looking at is last game's lineup rather than one being built.
let ran = false;
const overlay = el('overlay'), ttl = el('ttl'), sub = el('sub'), tapEl = el('tap'), attrs = el('attrs');
const brief = el('brief'), blist = el('blist');
let briefing = false;

brief.addEventListener('pointerup', () => { briefing = false; paintUI(); });


// `name:team:a:b:c:trend:ta:tb:tc` — trend flags a tier gained in the last few
// weeks, so a player who just levelled up is visible before you pick him.
function parseRoster(param, sample) {
  return (new URLSearchParams(location.search).get(param) || sample).split('|').map((r) => {
    const [name, tm, a, b, c, tr, ta, tb, tc] = r.split(':');
    const tier = (v) => Math.max(0, Math.min(4, parseInt(v, 10) || 0));
    return {
      name: (name || 'Player').toUpperCase(), team: (tm || '').toUpperCase(),
      a: clamp01(parseFloat(a)), b: clamp01(parseFloat(b)), c: clamp01(parseFloat(c)),
      trend: Math.max(-1, Math.min(1, parseInt(tr, 10) || 0)),
      tiers: [tier(ta), tier(tb), tier(tc)].map((t, i) => tierName(param, i, t)),
    };
  });
}

function segs(v, n, cls) {
  const on = Math.max(1, Math.round(v * n));
  let s = '';
  for (let i = 0; i < n; i++) s += `<span class="${cls}${i < on ? ' on' : ''}"></span>`;
  return s;
}
/** A game asks for one, two or three players; the picker walks the stages it
 *  declares. chemPair names which two of them are the battery. */
function stagesOf(gm) {
  const out = [{ title: gm.pickTitle, list: gm.roster, choose: gm.choose }];
  if (gm.roster2 && gm.roster2.length)
    out.push({ title: gm.pickTitle2, list: gm.roster2, choose: gm.choose2 });
  if (gm.roster3 && gm.roster3.length)
    out.push({ title: gm.pickTitle3, list: gm.roster3, choose: gm.choose3 });
  if (gm.roster4 && gm.roster4.length)
    out.push({ title: gm.pickTitle4, list: gm.roster4, choose: gm.choose4 });
  return out;
}
function buildPicker() {
  const stages = stagesOf(active);
  const st = stages[pickStage] || stages[0];
  // The stage that pairs with an earlier pick, and who that pick was.
  const pair = active.chemPair;
  const mate = pair && pickStage === pair[1] ? picks[pair[0]] : null;
  el('ptitle').textContent = st.title;
  el('pfront').textContent = mate
    ? `${mate.name} throwing · ${mate.team} target = chemistry`
    : `${active.shell} this week`;
  plist.innerHTML = '';
  st.list.forEach((p) => {
    const d = document.createElement('div');
    // A target who shares a club with the passer already picked.
    const chem = !!(mate && p.team && p.team === mate.team);
    d.className = chem ? 'pick chem' : 'pick';
    const kit = jerseyOf(p.team);
    d.innerHTML = `<span><span class="pn">${p.name}</span><span class="pt">`
      + (kit ? `<i class="pchip" style="background:${kit}"></i>` : '')
      + `${p.team}`
      + (chem ? `<b class="pchem">chemistry</b>` : '')
      + (p.trend ? `<b class="ptrend ${p.trend > 0 ? 'up' : 'down'}">${p.trend > 0 ? '▲' : '▼'}</b>` : '')
      + `</span></span>`
      + `<span class="pbars"><span class="pbar">${segs(p.a, 8, 'pseg')}</span>`
      + `<span class="pbar">${segs(p.b, 8, 'pseg')}</span>`
      + `<span class="pbar">${segs(p.c, 8, 'pseg')}</span></span>`;
    d.onclick = () => {
      picks[pickStage] = p;
      pick = picks[0]; pick2 = picks[1];
      if (pickStage === 0) setJersey(p.team);
      st.choose.call(active, p);
      // More players to field before the first snap.
      if (pickStage < stages.length - 1) {
        pickStage++; buildPicker(); paintUI(); return;
      }
      briefing = true;                        // show how-to-play before the first snap
      ran = true;                             // the lineup is set; the run is this one's
      el('btitle').textContent = `${active.label} — how to play`;
      const levels = [];
      const a = pair && picks[pair[0]], b = pair && picks[pair[1]];
      if (a && b && a.team && a.team === b.team) {
        levels.push(`<div class="brow blv"><span class="bk">Chemistry</span>`
          + `<span class="bv">${a.team} battery · truer ball</span></div>`);
      }
      blist.innerHTML = levels.join('')
        + active.controls
          .map(([k, v]) => `<div class="brow"><span class="bk">${k}</span><span class="bv">${v}</span></div>`)
          .join('');
      paintUI();
    };
    plist.appendChild(d);
  });
}
/** Walk the picker back to its first stage. The lineup lives out here, not in
 *  the game, so a game that resets itself leaves all of this behind. */
function restartPicks() {
  ran = false;
  picks = [];
  pick = null;
  pick2 = null;
  pickStage = 0;
  setJersey(null);
  briefing = false;
  buildPicker();
}

function select(game) {
  active = game;
  active.reset();
  el('hint').textContent = game.hint;
  restartPicks();
  paintUI();
}

function paintUI() {
  const g = active;
  const inSelect = g.state === 'select';
  // A finished run drops the game back to 'select' by itself. Reopening the
  // picker where it was left dropped you on the kicker and began a drive with
  // nobody else attached, which is why the rest of the huddle turned out in
  // blank white. Note the state is 'select' the whole time you are picking
  // too, so a run having started is the only safe signal here.
  if (inSelect && ran) { ran = false; restartPicks(); return paintUI(); }
  picker.classList.toggle('show', inSelect);
  brief.classList.toggle('show', briefing && !inSelect);
  if (briefing && !inSelect) {
    overlay.classList.remove('show'); attrs.classList.remove('show');
    el('status').innerHTML = g.status();
    return;
  }
  const pr = !inSelect && !briefing && g.prompt ? g.prompt() : null;
  if (pr) {
    el('prtitle').textContent = pr.title;
    el('prsub').textContent = pr.sub || '';
    propts.innerHTML = '';
    const rows = new Map();
    for (const o of pr.options) {
      const n = o.row || 0;
      if (!rows.has(n)) rows.set(n, []);
      rows.get(n).push(o);
    }
    for (const [n, opts] of rows) {
      const wrap = document.createElement('div');
      wrap.className = 'prow';
      const lab = (pr.rowLabels || [])[n];
      if (lab) {
        const l = document.createElement('span');
        l.className = 'prlab'; l.textContent = lab;
        wrap.appendChild(l);
      }
      for (const o of opts) {
        const b = document.createElement('div');
        b.className = 'propt';
        b.textContent = o.label;
        b.setAttribute('role', 'button');
        b.onclick = () => { g.pickOption(o.key); paintUI(); };
        wrap.appendChild(b);
      }
      propts.appendChild(wrap);
    }
  }
  promptEl.classList.toggle('show', !!pr);

  el('status').innerHTML = inSelect ? '' : g.status();
  if (inSelect) { overlay.classList.remove('show'); attrs.classList.remove('show'); return; }

  const o = g.overlay(pick || g.roster[0]);
  ttl.classList.remove('gold', 'bad');
  overlay.classList.toggle('presnap', !!(o && o.presnap));
  if (!o) { overlay.classList.remove('show'); attrs.classList.remove('show'); return; }
  ttl.textContent = o.ttl;
  if (o.gold) ttl.classList.add('gold');
  if (o.bad) ttl.classList.add('bad');
  sub.textContent = o.sub || '';
  tapEl.textContent = o.tap || '';
  if (o.attrs && pick) {
    attrs.innerHTML = (g.attrLabels || []).map((label, i) =>
      `<div class="attr"><span class="k">${label}</span><span class="bar">`
      + segs([pick.a, pick.b, pick.c][i], 10, 'seg') + '</span>'
      + `<span class="lv">${(pick.tiers || [])[i] || ''}</span></div>`).join('');
  }
  attrs.classList.toggle('show', !!(o.attrs && pick));
  overlay.classList.add('show');
}

// ---- input ---------------------------------------------------------------
let pStart = null;
function logical(e) {
  const r = canvas.getBoundingClientRect();
  const camY = active.g && active.g.camY ? active.g.camY : 0;
  return { x: ((e.clientX - r.left) / r.width) * VW, y: ((e.clientY - r.top) / r.height) * VH + camY };
}
// Any touch anywhere is the gesture the audio context needs; it is built on
// the first one and never at load.
document.addEventListener('pointerdown', () => SOUND.wake(), { passive: true });
canvas.addEventListener('pointerdown', (e) => { pStart = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (active.state === 'select') { pStart = null; return; }
  if (briefing) { briefing = false; pStart = null; paintUI(); return; }
  const dx = pStart ? e.clientX - pStart.x : 0;
  const dy = pStart ? e.clientY - pStart.y : 0;
  active.onUp(logical(e), dx, dy);
  pStart = null;
  paintUI();
});
window.addEventListener('keydown', (e) => {
  if (briefing) { briefing = false; paintUI(); return; }
  if (active.state === 'select') {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= active.roster.length) { pick = active.roster[n - 1]; active.choose(pick); paintUI(); }
    return;
  }
  if (e.key === 'ArrowLeft') { active.onUp({ x: 0, y: 0 }, -40, 0); paintUI(); }
  else if (e.key === 'ArrowRight') { active.onUp({ x: 0, y: 0 }, 40, 0); paintUI(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); active.onUp({ x: 0, y: 0 }, 0, -40); paintUI(); }
  else if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); active.onUp({ x: VW / 2, y: 0 }, 0, 0); paintUI(); }
});

/** Terminal states differ per game: the kick run ends on the first miss. */
const isOver = (g) => g.state === 'gameover' || (g.key === 'kick' && g.state === 'miss');

let reported = '';
function reportScore() {
  if (!active.score || !active.g) return;
  const r = active.score();
  // Guard against the same finish being posted twice by a repaint.
  const stamp = `${active.key}:${r.value}:${r.tie}:${r.detail}`;
  if (stamp === reported) return;
  reported = stamp;
  try {
    parent.postMessage({
      source: 'arcade', type: 'score', game: active.key,
      value: r.value, tie: r.tie || 0, detail: r.detail,
      player: pick ? pick.name : '', team: pick ? pick.team : '', seed: SEED,
    }, '*');
  } catch { /* standalone, not embedded */ }
}

// ---- loop ----------------------------------------------------------------
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  const before = active.state;
  while (acc >= 1000 / 60) { if (active.state !== 'select') active.step(); acc -= 1000 / 60; }
  if (before !== active.state) {
    paintUI();
    if (isOver(active)) reportScore();
  }
  if (active.state !== 'select' && active.g) active.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

el('build').textContent = `build ${BUILD}`;
select(DRIVE_GAME);
const soundEl = el('sound');
function paintSound() { soundEl.textContent = SOUND.on ? 'SOUND' : 'MUTED'; }
soundEl.addEventListener('pointerup', (e) => { e.stopPropagation(); SOUND.toggle(); paintSound(); });
paintSound();

window.__active = () => active;
</script>
</body>
</html>
