<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Arcade — mini games</title>
<style>
  :root { --gold: #e8c561; --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    /* The layout always fits the viewport, so nothing here needs to scroll or
       zoom. touch-action:none is absolute where `manipulation` still let iOS
       sneak a double-tap zoom through on fast repeated taps. */
    touch-action: none;
    height: 100%; overflow: hidden; background: #08090b; color: #e9e9ec;
    font-family: var(--mono);
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  #wrap {
    height: 100dvh; display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    align-items: center; justify-items: center; gap: 7px; padding: 8px 0;
  }
  #stage { align-self: center; }
  /* game switcher */
  #tabs { display: flex; gap: 5px; }
  .tab {
    padding: 6px 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #6d6f76;
    cursor: pointer; transition: color .2s, border-color .2s;
  }
  .tab.on { color: #0c0d0f; background: #e9e9ec; border-color: #e9e9ec; }
  /* Set apart: it opens the host's leaderboard rather than switching game. */
  .tab.board { margin-left: 9px; border-style: dashed; letter-spacing: 0.16em; }
  #stage { position: relative; }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;                   /* the field owns every gesture */
    background: #08090b; border: 1px solid rgba(255,255,255,0.08); display: block;
  }
  /* Type lives in the DOM so it renders at device resolution, not upscaled. */
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    pointer-events: none; text-align: center; padding: 0 18px;
    opacity: 0; transition: opacity .24s ease;
    background: radial-gradient(ellipse 72% 30% at 50% 50%,
      rgba(8,9,11,0.9) 0%, rgba(8,9,11,0.74) 45%, rgba(8,9,11,0) 100%);
  }
  #overlay.show { opacity: 1; }
  /* Pre-snap the scrim must sit behind the TEXT only — a tall gradient washes
     out the downfield players, which is most of what you need to read. */
  #overlay.presnap {
    justify-content: flex-start; padding-top: 12px;
    background: linear-gradient(180deg,
      rgba(8,9,11,0.95) 0%, rgba(8,9,11,0.86) 16%, rgba(8,9,11,0) 30%);
  }
  #overlay.presnap #ttl { font-size: 15px; }
  #ttl { font-size: 18px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #fbfbfd; }
  #ttl.gold { color: var(--gold); }
  #ttl.bad { color: #c96f6f; }
  #sub { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a8c92; }
  #tap { font-size: 8.5px; letter-spacing: 0.24em; text-transform: uppercase; color: #4a4c52; margin-top: 5px; }
  #attrs { display: none; flex-direction: column; gap: 5px; margin-top: 9px; }
  #attrs.show { display: flex; }
  .attr { display: flex; align-items: center; gap: 9px; }
  .attr .k { width: 62px; text-align: right; font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: #6d6f76; }
  .attr .bar { display: flex; gap: 2px; }
  .attr .seg { width: 7px; height: 7px; background: rgba(255,255,255,0.10); }
  .attr .seg.on { background: #e9e9ec; }

  /* Pre-snap route menu: choosing the concept is what snaps the ball. */
  #prompt {
    /* Anchored to the top: pre-snap the players are down by the line, and the
       alignment you're reading is the whole point of choosing a route. */
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 7px;
    padding: 14px 14px 0; text-align: center;
    background: linear-gradient(180deg,
      rgba(8,9,11,0.92) 0%, rgba(8,9,11,0.72) 34%, rgba(8,9,11,0) 58%);
  }
  #prompt.show { display: flex; }
  .prtitle {
    font-size: 10px; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--gold);
  }
  .prsub {
    font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #6d6f76; margin-bottom: 4px;
  }
  #propts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 3px; }
  .propt {
    padding: 9px 15px; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #ececed; cursor: pointer; touch-action: manipulation;
  }
  .propt:active { background: rgba(255,255,255,0.12); }

  #picker {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 7px; padding: 0 14px;
    background: rgba(8,9,11,0.93); touch-action: manipulation;
  }
  #picker.show { display: flex; }
  /* How-to-play, shown once you've picked and before the first snap. */
  #brief {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 0 18px;
    background: rgba(8,9,11,0.94);
  }
  #brief.show { display: flex; }
  #blist { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
  .brow { display: flex; align-items: baseline; gap: 11px; }
  .brow .bk {
    min-width: 92px; text-align: right; font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold);
  }
  .brow .bv { font-size: 9.5px; letter-spacing: 0.1em; color: #b6b8be; }
  .bstart {
    margin-top: 12px; font-size: 8.5px; letter-spacing: 0.24em;
    text-transform: uppercase; color: #4a4c52;
  }
  .ptitle { font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #fbfbfd; }
  .pfront { font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  #plist { display: flex; flex-direction: column; gap: 5px; width: 100%; max-width: 300px; }
  .pick {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    cursor: pointer; touch-action: manipulation;
  }
  .pick:hover, .pick:active { border-color: rgba(255,255,255,0.42); }
  .pick .pn { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #ececed; }
  .pick .ptrend {
    margin-left: 7px; font-size: 7px; font-weight: 400; letter-spacing: 0;
  }
  .pick .ptrend.up { color: #c9c9cf; }
  .pick .ptrend.down { color: #55575d; }
  .pick .pchip {
    display: inline-block; width: 5px; height: 5px; border-radius: 1px;
    margin-right: 6px; vertical-align: middle;
  }
  .pick .pt { display: block; font-size: 8px; letter-spacing: 0.18em; color: #6d6f76; text-transform: uppercase; margin-top: 4px; }
  .pick .pbars { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
  .pick .pbar { display: flex; gap: 1px; }
  .pick .pseg { width: 5px; height: 4px; background: rgba(255,255,255,0.10); }
  .pick .pseg.on { background: #c9c9cf; }

  #status {
    display: flex; gap: 15px; align-items: baseline;
    font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #6d6f76;
  }
  #status b { color: #c9c9cf; font-weight: 600; }
  #status .sc { color: var(--gold); font-weight: 600; }
  #foot {
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; justify-content: center;
    font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  #hint { color: #46484e; }
  #build { color: #2e3035; }
</style>
</head>
<body>
<div id="wrap">
  <div id="tabs"></div>
  <div id="status"></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="picker">
      <div class="ptitle" id="ptitle"></div>
      <div class="pfront" id="pfront"></div>
      <div id="plist"></div>
    </div>
    <div id="brief">
      <div class="ptitle" id="btitle"></div>
      <div id="blist"></div>
      <div class="bstart">tap to begin</div>
    </div>
    <div id="prompt">
      <div class="prtitle" id="prtitle"></div>
      <div class="prsub" id="prsub"></div>
      <div id="propts"></div>
    </div>
    <div id="overlay">
      <div id="ttl"></div><div id="sub"></div><div id="attrs"></div><div id="tap"></div>
    </div>
  </div>
  <div id="foot"><span id="hint"></span><span id="build"></span></div>
</div>
<script>
// ===========================================================================
// ARCADE — three mini games on one page.
// Shared: palette, sprites, seeded RNG, canvas fit, overlay/picker chrome.
// Each game supplies its own sim, render, input, and copy.
// ===========================================================================

const BUILD = 'arcade20-yac';
const VW = 180;
let VH = 260;
const SEED = new URLSearchParams(location.search).get('seed') || 'WK15';

const PAL = {
  '.': null,
  W: '#ffffff', L: '#c9c9cf', M: '#8f9199',
  G: '#7d8089', D: '#26282d', O: '#e8c561',
};

// ---- team jerseys --------------------------------------------------------
// Only the player you picked is coloured; defenders are the same sprite with
// W/L/M flattened to G, so they stay monochrome for free and your guy is the
// one coloured thing on the field.
//
// These are recognisable rather than accurate. Real primaries are frequently
// unusable here: the field is #08090b, so Raiders black, Ravens #241773 and
// Seahawks navy all vanish into it. Each team gets one identity colour held in
// a legible lightness band, kept clear of the defender grey and of the gold
// the ball and the live accent own. Teams never appear side by side — you only
// ever see your own — so two similar blues cost nothing.
const DEFAULT_KIT = { W: '#ffffff', L: '#c9c9cf', M: '#8f9199' };
const TEAM_JERSEY = {
  ARI: '#d9455f', ATL: '#e2515a', BAL: '#7b5ce0', BUF: '#4a86ee',
  CAR: '#3fb3e8', CHI: '#e8823f', CIN: '#f26a2e', CLE: '#b0793f',
  DAL: '#6e9ae0', DEN: '#ee6a32', DET: '#4faeee', GB:  '#45ae68',
  HOU: '#d8434f', IND: '#4f96ee', JAX: '#34afa6', KC:  '#ee4550',
  LAC: '#56c6ee', LAR: '#5a87ee', LV:  '#c6c9d0', MIA: '#35c4b8',
  MIN: '#8657e0', NE:  '#5a79c8', NO:  '#efe1ae', NYG: '#5a7be0',
  NYJ: '#3cb673', PHI: '#35948c', PIT: '#ebd69b', SEA: '#7fd34a',
  SF:  '#e2545a', TB:  '#dc4a32', TEN: '#46a6e0', WAS: '#b04a55',
};

const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => {
  const [ar, ag, ab] = hex2rgb(a), [br, bg, bb] = hex2rgb(b);
  return rgb2hex([ar + (br - ar) * t, ag + (bg - ag) * t, ab + (bb - ab) * t]);
};

const jerseyOf = (team) => TEAM_JERSEY[(team || '').toUpperCase()] || null;

/** Swap the three uniform tones. G (defenders), O (ball) and D (outline) are
 *  untouched, so nothing else on the field can be affected. */
function setJersey(team) {
  const base = jerseyOf(team);
  if (!base) { Object.assign(PAL, DEFAULT_KIT); return; }
  PAL.W = mix(base, '#ffffff', 0.38);   // highlight
  PAL.L = base;                          // the jersey
  PAL.M = mix(base, '#191b1f', 0.42);    // shadow, reads as the accent
}

// ---- seeded RNG ----------------------------------------------------------
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp01 = (v) => Math.max(0, Math.min(1, Number.isFinite(v) ? v : 0.5));

// ---- sprites -------------------------------------------------------------
const BODY32 = [
  '................................','................................',
  '..........DDDDDDDDDDDD..........','.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........','.........DWWWMMMMMMWWWD.........',
  '.........DWWWMMMMMMWWWD.........','.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........','.........DDWWWWWWWWWWDD.........',
  '...........DLLLLLLLLD...........','......DDDWWWWWWWWWWWWWWDDD......',
  '...DDDWWWWWWWWWWWWWWWWWWWWDDD...','...DWWWWWWWWWWWWWWWWWWWWWWWWD...',
  '...DWWWWWWWWWWWWWWWWWWWWWWWWD...','....DWWWWWWWWWWWWWWWWWWWWWWD....',
  '....DMWWWWWWWWWWWWWWWWWWWWMD....','.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....','.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....','.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '......DWWWWWWWWWWWWWWWWWWD......','......DWWWWWWWWWWWWWWWWWWD......',
  '.......DWWWWWWWWWWWWWWWWD.......','........DWWWWWWWWWWWWWWD........',
];
const LEGS32 = [
  ['.......DLLLLD......DLLLLD.......','.......DLLLLD......DLLLLD.......','......DLLLLD........DLLLLD......','......DLLLD..........DLLLD......','.....DLLLD............DLLLD.....','.....DDDDD............DDDDD.....'],
  ['..........DLLLLDDLLLLD..........','..........DLLLLDDLLLLD..........','..........DLLLLDDLLLLD..........','..........DLLLDDDLLLD...........','..........DLLDDDDDLLD...........','..........DDDDDDDDDDD...........'],
  ['.......DLLLLD......DLLLLD.......','......DLLLLD........DLLLLD......','......DLLLLD........DLLLLD......','.....DLLLD............DLLLD.....','....DLLLD..............DLLLD....','....DDDDD..............DDDDD....'],
];
const SIDE32 = [
  '................................','................................',
  '...........DDDDDDDDDD...........','..........DWWWWWWWWWWD..........',
  '..........DWWWWWWWWWWD..........','..........DWWWMMMMWWWD..........',
  '..........DWWWMMMMWWWD..........','..........DWWWWWWWWWWD..........',
  '..........DWWWWWWWWWWD..........','..........DDWWWWWWWWDD..........',
  '............DLLLLLLD............','........DDDWWWWWWWWWWDDD........',
  '.......DWWWWWWWWWWWWWWWWD.......','.......DWWWWWWWWWWWWWWWWD.......',
  '.......DWWWWWWWWWWWWWWWWD.......','........DWWWWWWWWWWWWWWD........',
  '........DMWWWWWWWWWWWWMD........','........DWWWWWWWWWWWWWWD........',
  '........DWWWWWMMMMWWWWWD........','........DWWWWWMMMMWWWWWD........',
  '........DWWWWWMMMMWWWWWD........','........DWWWWWWWWWWWWWWD........',
  '.........DWWWWWWWWWWWWD.........','.........DWWWWWWWWWWWWD.........',
  '..........DWWWWWWWWWWD..........','..........DWWWWWWWWWWD..........',
];
const FRONT32 = [
  '................................','................................',
  '..........DDDDDDDDDDDD..........','.........DWWWWWWWWWWWWD.........',
  '.........DWWWWWWWWWWWWD.........','.........DWWDDDDDDDDWWD.........',
  '.........DWWDDDDDDDDWWD.........','.........DWWDDDDDDDDWWD.........',
  '.........DWWWWWWWWWWWWD.........','.........DDWWWWWWWWWWDD.........',
  '...........DLLLLLLLLD...........','......DDDWWWWWWWWWWWWWWDDD......',
  '...DDDWWWWWWWWWWWWWWWWWWWWDDD...','...DWWWWWWWWWWWWWWWWWWWWWWWWD...',
  '...DWWWWWWWWWWWWWWWWWWWWWWWWD...','....DWWWWWWWWWWWWWWWWWWWWWWD....',
  '....DMWWWWWWWWWWWWWWWWWWWWMD....','.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....','.....DWWWWWWMMMMMMMMWWWWWWD.....',
  '.....DWWWWWWMMMMMMMMWWWWWWD.....','.....DWWWWWWWWWWWWWWWWWWWWD.....',
  '......DWWWWWWWWWWWWWWWWWWD......','......DWWWWWWWWWWWWWWWWWWD......',
  '.......DWWWWWWWWWWWWWWWWD.......','........DWWWWWWWWWWWWWWD........',
];
const RUN32 = LEGS32.map((l) => [...BODY32, ...l]);
const DEF32 = RUN32.map((f) => f.map((r) => r.replace(/[WLM]/g, 'G')));
const PIVOT32 = LEGS32[1];
const SPIN32 = [[...BODY32, ...PIVOT32], [...SIDE32, ...PIVOT32], [...FRONT32, ...PIVOT32], [...SIDE32, ...PIVOT32]];
const SPIN_BALL_DX = [0, -9, -17, -7];
const BALL32 = [[18,27],[18,28],[19,26],[19,27],[19,28],[19,29],[20,26],[20,27],[20,28],[20,29],[21,27],[21,28]];

const BODY20 = [
  '....................','....................',
  '......DDDDDDDD......','.....DWWWWWWWWD.....','.....DWWWWWWWWD.....',
  '.....DWWMMMMWWD.....','.....DDWWWWWWDD.....','.......DLLLLD.......',
  '...DDWWWWWWWWWWDD...','..DWWWWWWWWWWWWWWD..','..DWWWWWWWWWWWWWWD..',
  '...DWWWWWWWWWWWWD...','...DWWWWMMMMWWWWD...','...DWWWWMMMMWWWWD...',
  '....DWWWWWWWWWWD....','.....DWWWWWWWWD.....',
];
const LEGS20 = [
  ['....DLLD....DLLD....','....DLLD....DLLD....','...DLLD......DLLD...','...DDD........DDD...'],
  ['......DLLDDLLD......','......DLLDDLLD......','......DLLDDLLD......','......DDDDDDD.......'],
  ['....DLLD....DLLD....','...DLLD......DLLD...','...DLLD......DLLD...','..DDD..........DDD..'],
];
const RUN20 = LEGS20.map((l) => [...BODY20, ...l]);
const DEF20 = RUN20.map((f) => f.map((r) => r.replace(/[WLM]/g, 'G')));

// ---- canvas --------------------------------------------------------------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CHROME = 96;
function fit() {
  const availW = Math.min(window.innerWidth - 12, 520);
  const availH = Math.max(220, window.innerHeight - CHROME);
  const scale = Math.max(1, Math.min(5, Math.floor(availW / VW)));
  VH = Math.max(180, Math.min(340, Math.floor(availH / scale)));
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW * scale + 'px';
  canvas.style.height = VH * scale + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fit);
fit();

function sprite(rows, px, py, ballPts, ballDx) {
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const c = PAL[row[x]];
      if (!c) continue;
      ctx.fillStyle = c; ctx.fillRect(px + x, py + y, 1, 1);
    }
  }
  if (ballPts) {
    // Dark halo first: gold on a gold-ish jersey would otherwise disappear.
    ctx.fillStyle = PAL.D;
    for (const [y, x] of ballPts) {
      const bx = px + x + (ballDx || 0), by = py + y;
      ctx.fillRect(bx - 1, by, 1, 1); ctx.fillRect(bx + 1, by, 1, 1);
      ctx.fillRect(bx, by - 1, 1, 1); ctx.fillRect(bx, by + 1, 1, 1);
    }
    ctx.fillStyle = PAL.O;
    for (const [y, x] of ballPts) ctx.fillRect(px + x + (ballDx || 0), py + y, 1, 1);
  }
}
function yardLines(camY, worldH, yards, yard) {
  ctx.fillStyle = '#08090b'; ctx.fillRect(0, 0, VW, VH);
  for (let i = 0; i <= yards; i++) {
    const sy = Math.round(worldH - i * yard - camY);
    if (sy < -2 || sy > VH + 2) continue;
    if (i % 5 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, sy, VW, 1); }
    else {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(VW / 2 - 14, sy, 5, 1); ctx.fillRect(VW / 2 + 9, sy, 5, 1);
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(2, 0, 1, VH); ctx.fillRect(VW - 3, 0, 1, VH);
}

// ===========================================================================
// GAME 1 — RUN
// ===========================================================================
const RUN_GAME = (() => {
  const YARD = 16, DRIVE_YARDS = 25, WORLD_H = DRIVE_YARDS * YARD, EZ = 0, GOAL = EZ + 12;
  const SPR = 32, HALF = 16;
  const SPIN_LEN = 30, SPIN_CD = 34, SPIN_IF = 8, TACKLE_R = 17;
  const TRUCK_LEN = 24, TRUCK_CD = 46;
  const SAMPLE = 'J. Gibbs:DET:0.86:0.38:0.90|D. Henry:BAL:0.62:0.96:0.18|'
    + 'B. Robinson:ATL:0.78:0.70:0.62|T. Bigsby:JAX:0.66:0.58:0.34';
  const FRONT = mulberry32(hashSeed(SEED + '|front'))() < 0.5
    ? { label: 'Stacked front', spread: 0.64 } : { label: 'Spread front', spread: 1.32 };

  let A = {}, g = null;
  function setAttrs(p) {
    A = {
      FWD: 0.82 + 0.24 * p.a, BREAK: 0.05 + 0.30 * p.b,
      CONTACT: 32 + 18 * p.c, STUMBLE: 78 + 46 * p.c,
      // Trucking is POWER made active: a bruiser runs through people, a
      // scatback who tries it gets stopped cold.
      TRUCK: 0.40 + 0.55 * p.b,
    };
  }
  function defenders(rnd, drive, los) {
    const ramp = 1 + drive * 0.07, out = [];
    // The front used to be spaced purely off the line of scrimmage, which only
    // works with a whole field behind it: inside about five yards every
    // defender spawned past the end line and short yardage was an untouched
    // walk-in. Line up in the room that actually exists instead — the deep
    // help thins out, because getting to the stripe already beat it.
    const room = Math.max(26, los - GOAL + 4);
    const standoff = Math.max(26, Math.min(74, room * 0.45));
    const n = Math.max(1, Math.min(drive >= 2 ? 4 : 3,
      1 + Math.floor((room - standoff) / 44)));
    const gap = n > 1 ? Math.min(58, (room - standoff) / (n - 1)) : 0;
    // As the layers tighten the front also flattens across the width, so a
    // goal-line stand is a gap to find rather than a wall or a walk-in.
    const tight = Math.min(1, gap / 58);
    const lane = 52 * FRONT.spread * tight + (VW / (n + 0.6)) * (1 - tight);
    for (let i = 0; i < n; i++) {
      const x = VW / 2 + (i - (n - 1) / 2) * lane + Math.floor(rnd() * 14) - 7;
      const back = standoff + i * gap + Math.floor(rnd() * 26) * tight;
      out.push({
        x, y: Math.max(4, los - back),
        speed: (0.58 + rnd() * 0.28) * ramp, lateral: (0.46 + rnd() * 0.32) * ramp,
        stumble: 0, frame: rnd() * 3,
      });
    }
    return out;
  }
  return {
    key: 'run', label: 'Run', pickTitle: 'Choose your back',
    shell: FRONT.label, attrLabels: ['Speed', 'Power', 'Elusive'],
    hint: 'swipe ← → cut · ↑ truck · tap spin',
    controls: [['Swipe ← →', 'cut left or right'], ['Tap', 'spin — time it into contact'],
               ['Swipe ↑', 'truck — power runs through, speed gets stopped'],
               ['Goal', 'four downs to reach the end zone']],
    roster: parseRoster('run', SAMPLE),
    reset() {
      g = { rnd: mulberry32(hashSeed(SEED)), roll: mulberry32(hashSeed(SEED + '|r')),
            drive: 0, down: 1, los: WORLD_H - 26, tds: 0, yards: 0, gain: 0, state: 'select' };
      this.g = g;
    },
    choose(p) { setAttrs(p); this.startDown(); g.state = 'ready'; },
    startDown() {
      g.rb = { x: VW / 2, y: g.los, vx: 0, frame: 0, spin: 0, spinCd: 0, spinDir: 1,
               clean: false, breakCd: 0, stagger: 0, truck: 0, truckCd: 0 };
      g.defenders = defenders(g.rnd, g.drive, g.los);
      g.startY = g.los;
      g.camY = Math.max(0, Math.min(WORLD_H - VH, g.rb.y - VH * 0.62));
      g.state = 'live';
    },
    end(kind) {
      g.how = kind;
      g.gain = Math.max(0, Math.round((g.startY - g.rb.y) / YARD));
      g.yards += g.gain;
      if (kind === 'td') { g.tds++; g.drive++; g.down = 1; g.los = WORLD_H - 26; g.state = 'td'; }
      else if (g.down >= 4) g.state = 'gameover';
      else { g.down++; g.los = g.rb.y; g.state = 'between'; }
    },
    step() {
      if (g.state !== 'live') return;
      const rb = g.rb;
      if (rb.spinCd > 0) rb.spinCd--;
      if (rb.breakCd > 0) rb.breakCd--;
      if (rb.stagger > 0) rb.stagger--;
      if (rb.truckCd > 0) rb.truckCd--;
      if (rb.truck > 0) {
        rb.y -= A.FWD * 1.42;                    // lowered shoulder, straight ahead
        rb.x += rb.vx * 0.4;
        rb.vx *= 0.6;
        rb.frame += 0.3;
        rb.truck--;
        if (rb.truck === 0) rb.stagger = 14;     // and it costs you afterwards
      } else if (rb.spin > 0) {
        const p = rb.spin / SPIN_LEN;
        rb.x += rb.spinDir * 2.9 * p;
        rb.y -= rb.clean ? A.FWD : A.FWD * 0.45;
        rb.vx *= 0.7; rb.spin--;
      } else {
        rb.y -= rb.stagger > 0 ? A.FWD * 0.42 : A.FWD;
        rb.x += rb.vx; rb.vx *= 0.86;
        rb.frame += rb.stagger > 0 ? 0.12 : 0.22;
      }
      rb.x = Math.max(HALF - 4, Math.min(VW - HALF + 4, rb.x));
      for (const d of g.defenders) {
        if (d.stumble > 0) { d.stumble--; continue; }
        const dx = (rb.x + rb.vx * 8) - d.x, dy = rb.y - d.y;
        const dist = Math.hypot(dx, dy) || 1;
        d.x += (dx / dist) * d.lateral; d.y += (dy / dist) * d.speed; d.frame += 0.2;
        if (rb.spin <= SPIN_IF && Math.hypot(rb.x - d.x, rb.y - d.y) < TACKLE_R) {
          if (rb.truck > 0) {
            // Committed to contact: run him over, or get stood up for a loss.
            // Trucking is for defenders in front of you — a man on your hip
            // is a spin, and taking him on squares you up badly.
            const square = 1 - Math.min(1, Math.abs(rb.x - d.x) / TACKLE_R);
            if (g.roll() < A.TRUCK * (0.45 + 0.55 * square)) {
              d.stumble = A.STUMBLE * 1.5;
              rb.truck = 0; rb.stagger = 26;
              continue;
            }
            this.end('stuffed'); return;
          }
          if (rb.breakCd <= 0 && g.roll() < A.BREAK) {
            rb.breakCd = 80; rb.stagger = 22; d.stumble = A.STUMBLE; continue;
          }
          this.end('tackled'); return;
        }
      }
      if (rb.y <= GOAL) { this.end('td'); return; }
      g.camY = Math.max(0, Math.min(WORLD_H - VH, rb.y - VH * 0.62));
    },
    render() {
      yardLines(g.camY, WORLD_H, DRIVE_YARDS + 10, YARD);
      const ly = Math.round(g.los - g.camY);
      if (ly > -2 && ly < VH + 2) {
        ctx.fillStyle = 'rgba(232,197,97,0.45)';
        for (let x = 0; x < VW; x += 6) ctx.fillRect(x, ly, 3, 1);
      }
      const gy = Math.round(GOAL - g.camY);
      if (gy > -SPR && gy < VH + SPR) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(0, gy, VW, 1);
        ctx.fillStyle = 'rgba(255,255,255,0.035)';
        ctx.fillRect(0, Math.max(0, gy - 40), VW, Math.min(40, gy));
      }
      for (const d of g.defenders) {
        const sy = Math.round(d.y - g.camY);
        if (sy > -SPR && sy < VH + SPR)
          sprite(DEF32[Math.floor(d.stumble > 0 ? 1 : d.frame) % 3], Math.round(d.x) - HALF, sy - HALF);
      }
      const rb = g.rb, ry = Math.round(rb.y - g.camY);
      if (rb.truck > 0) {
        for (let i = 2; i >= 1; i--) {
          ctx.globalAlpha = 0.10 * i;
          sprite(RUN32[Math.floor(rb.frame + i) % 3], Math.round(rb.x) - HALF, ry - HALF + i * 5);
        }
        ctx.globalAlpha = 1;
        sprite(RUN32[Math.floor(rb.frame) % 3], Math.round(rb.x) - HALF, ry - HALF + 1, BALL32, 0);
      } else if (rb.spin > 0) {
        const s = Math.floor((SPIN_LEN - rb.spin) / (SPIN_LEN / 4)) % 4;
        ctx.globalAlpha = 0.22;
        sprite(SPIN32[(s + 3) % 4], Math.round(rb.x - rb.spinDir * 7) - HALF, ry - HALF);
        ctx.globalAlpha = 1;
        sprite(SPIN32[s], Math.round(rb.x) - HALF, ry - HALF, BALL32, SPIN_BALL_DX[s]);
      } else {
        sprite(RUN32[Math.floor(rb.frame) % 3], Math.round(rb.x) - HALF, ry - HALF, BALL32, 0);
      }
    },
    onUp(pt, dx, dy) {
      if (g.state === 'ready' || g.state === 'between' || g.state === 'td') { this.startDown(); return; }
      if (g.state === 'gameover') { this.reset(); g.state = 'select'; return; }
      if (g.state !== 'live') return;
      const rb = g.rb;
      // swipe up = truck. Distinct axis from the cut, so nothing collides.
      if (dy < -18 && Math.abs(dy) > Math.abs(dx)) {
        if (rb.truck <= 0 && rb.truckCd <= 0 && rb.spin <= 0) {
          rb.truck = TRUCK_LEN; rb.truckCd = TRUCK_LEN + TRUCK_CD;
        }
        return;
      }
      if (Math.abs(dx) > 18) { rb.vx += Math.sign(dx) * 1.9; return; }
      if (rb.truck > 0) return;
      if (rb.spin > 0 || rb.spinCd > 0) return;
      let near = null, nd = Infinity;
      for (const d of g.defenders) {
        if (d.stumble > 0) continue;
        const dist = Math.hypot(rb.x - d.x, rb.y - d.y);
        if (dist < nd) { nd = dist; near = d; }
      }
      rb.spin = SPIN_LEN; rb.spinCd = SPIN_LEN + SPIN_CD;
      rb.clean = !!near && nd < A.CONTACT;
      rb.spinDir = near && nd < 56 ? (Math.sign(rb.x - near.x) || 1) : (Math.sign(rb.vx) || 1);
      if (rb.clean) for (const d of g.defenders)
        if (Math.hypot(rb.x - d.x, rb.y - d.y) < A.CONTACT + 10) d.stumble = A.STUMBLE;
    },
    score() { return { value: g.yards, detail: `${g.tds} TD` }; },
    status() {
      const t = Math.max(1, Math.round((g.los - EZ - 12) / YARD));
      return `<span>DRIVE <b>${g.drive + 1}</b></span><span>DOWN <b>${g.down}</b></span>`
        + `<span>TO GO <b>${t}</b></span><span class="sc">${g.tds} TD</span>`;
    },
    overlay(pick) {
      const t = Math.max(1, Math.round((g.los - EZ - 12) / YARD));
      if (g.state === 'live') return null;
      if (g.state === 'ready') return { ttl: pick.name, sub: `${pick.team} · opening drive · 1st & ${t}`, tap: 'tap to start', attrs: true };
      if (g.state === 'between') return { ttl: g.how === 'stuffed' ? 'Stood up' : 'Tackled', sub: `${g.gain} yd gain · ${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
      if (g.state === 'td') return { ttl: 'Touchdown', gold: true, sub: `${g.tds} on the day`, tap: 'tap to continue' };
      return { ttl: 'Turnover on downs', bad: true, sub: `${g.tds} TD · ${g.yards} total yards`, tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };
})();

// ===========================================================================
// GAME 2 — PASS
// ===========================================================================
const PASS_GAME = (() => {
  // The end zone is ten yards deep, so a red-zone throw still has somewhere to
  // land. Previously the goal line sat one yard from the top of the world and
  // short-field throws had nowhere to go.
  const YARD = 16, EZ = 10 * YARD, DRIVE_YARDS = 21;
  const WORLD_H = EZ + DRIVE_YARDS * YARD + 30;
  const SPR = 20, HALF = 10, CATCH_R = 11;
  const SAMPLE_QB = 'J. Allen:BUF:0.96:0.68:0.88:0|C. Stroud:HOU:0.82:0.88:0.62:0|'
    + 'B. Purdy:SF:0.54:0.93:0.55:0|D. Maye:NE:0.78:0.72:0.74:0';
  const SAMPLE_WR = 'J. Chase:CIN:0.88:0.74:0.96:0|A. St. Brown:DET:0.60:0.90:0.88:0|'
    + 'T. McBride:ARI:0.42:0.86:0.70:0|B. Bowers:LV:0.54:0.84:0.78:0';
  const SHELL = mulberry32(hashSeed(SEED + '|shell'))() < 0.5
    ? { key: 'man', label: 'Man coverage', lag: 7, tight: 0.26 }
    : { key: 'zone', label: 'Zone coverage', lag: 15, tight: 0.17 };
  const ROUTES = {
    go: (t) => ({ x: 0, y: -t * 0.92 }),
    slant: (t, d) => (t < 34 ? { x: 0, y: -t * 0.86 } : { x: d * (t - 34) * 0.72, y: -(29 + (t - 34) * 0.58) }),
    out: (t, d) => (t < 52 ? { x: 0, y: -t * 0.86 } : { x: d * (t - 52) * 1.02, y: -(45 + (t - 52) * 0.22) }),
    post: (t, d) => (t < 66 ? { x: 0, y: -t * 0.92 } : { x: d * (t - 66) * 0.6, y: -(61 + (t - 66) * 0.78) }),
  };
  // Near the goal line the field compresses, so the concepts do too: quick
  // breaks and horizontal-working routes instead of vertical stems.
  const RED = {
    quick: (t, d) => (t < 16 ? { x: 0, y: -t * 0.86 } : { x: d * (t - 16) * 0.86, y: -(14 + (t - 16) * 0.44) }),
    fade: (t, d) => ({ x: d * t * 0.36, y: -t * 0.74 }),
    drag: (t, d) => (t < 12 ? { x: 0, y: -t * 0.8 } : { x: d * (t - 12) * 1.06, y: -(10 + (t - 12) * 0.14) }),
    flat: (t, d) => (t < 8 ? { x: 0, y: -t * 0.66 } : { x: d * (t - 8) * 1.18, y: -(5 + (t - 8) * 0.08) }),
  };
  /**
   * The pre-snap read. Man coverage trails the route, so a break wins; zone
   * sits in an area, so you go over the top of it. Positive means the route
   * beats that shell, and it loosens the defender for the play.
   */
  const EDGE = {
    slant: { man: 0.34, zone: -0.22 }, out: { man: 0.28, zone: -0.10 },
    go: { man: -0.06, zone: 0.32 }, post: { man: 0.04, zone: 0.30 },
    quick: { man: 0.30, zone: -0.18 }, drag: { man: 0.28, zone: -0.14 },
    fade: { man: -0.04, zone: 0.28 }, flat: { man: 0.20, zone: -0.06 },
  };
  const MENU = ['slant', 'out', 'go', 'post'];
  const RED_MENU = ['quick', 'drag', 'fade', 'flat'];
  const LABEL = {
    slant: 'Slant', out: 'Out', go: 'Go', post: 'Post',
    quick: 'Quick', drag: 'Drag', fade: 'Fade', flat: 'Flat',
  };
  const BOOK = (r) => (r.red ? RED : ROUTES);

  let A = {}, W = {}, g = null;
  // The receiver's speed rating stretches the route clock, so a burner is
  // further along his stem at the same instant.
  // Clamped to the field here, not at the call site: the lead prediction and
  // the receiver have to agree, or a route working toward the sideline aims
  // the ball somewhere he is not allowed to be.
  const at = (r, t) => {
    const o = BOOK(r)[r.route](Math.max(0, t) * r.speed, r.dir);
    return {
      x: Math.max(10, Math.min(VW - 10, r.sx + o.x)),
      y: Math.max(14, r.sy + o.y),
    };
  };

  return {
    key: 'pass', label: 'Pass',
    pickTitle: 'Choose your passer', pickTitle2: 'Choose your target',
    shell: SHELL.label, attrLabels: ['Arm', 'Accuracy', 'Escape'],
    attrLabels2: ['Speed', 'Hands', 'Route'],
    hint: 'pick a route · tap to throw',
    controls: [['Pick a route', 'beat the coverage before the snap'],
               ['Man coverage', 'breaks win — slant, out, drag'],
               ['Zone coverage', 'go over the top — go, post, fade'],
               ['Tap', 'throw — the ball leads him'],
               ['Careful', 'an interception ends the run']],
    roster: parseRoster('pass', SAMPLE_QB),
    roster2: parseRoster('recv', SAMPLE_WR),
    reset() {
      g = { rnd: mulberry32(hashSeed(SEED)), roll: mulberry32(hashSeed(SEED + '|r')),
            drive: 0, down: 1, los: WORLD_H - 30, marker: WORLD_H - 30 - 10 * YARD,
            tds: 0, comp: 0, att: 0, yards: 0, gain: 0, firstDown: false,
            result: '', state: 'select', t: 0, wr: null, rushers: [], ball: null, edge: 0 };
      this.g = g;
    },
    /** Stage one: the passer. Stays in select so the target can be picked. */
    choose(p) {
      A = { V: 2.1 + 2.0 * p.a, SCATTER: 4 + 14 * (1 - p.b), RUSH: 0.32 - 0.14 * p.c };
      g.qbTeam = p.team;
    },
    /** Stage two: the target. */
    choose2(p) {
      W = { SPEED: 0.86 + 0.30 * p.a, HANDS: p.b, ROUTE: p.c };
      g.wrTeam = p.team;
      this.setup();
    },
    setup() {
      const rnd = g.rnd;
      const red = (g.los - EZ) < 13 * YARD;          // goal-to-go territory
      const sx = rnd() < 0.5 ? 44 : VW - 44;
      g.red = red;
      g.wr = {
        sx, sy: g.los - 8, x: sx, y: g.los - 8, dir: 1, route: null, red,
        hist: [], frame: rnd() * 3, speed: W.SPEED,
        db: { x: sx + (rnd() * 6 - 3), y: g.los - 15 - rnd() * 5, frame: rnd() * 3 },
      };
      g.rushers = [{ x: VW / 2 - 34, y: g.los - 34, frame: 0 }, { x: VW / 2 + 34, y: g.los - 34, frame: 1 }];
      g.qb = { x: VW / 2, y: g.los + 6 };
      g.ball = null; g.t = 0; g.edge = 0;
      g.camY = Math.max(0, Math.min(WORLD_H - VH, g.los - VH * 0.74));
      g.state = 'ready';
    },
    /** Pre-snap: the route choice is the snap. */
    prompt() {
      if (g.state !== 'ready') return null;
      return {
        title: SHELL.label,
        sub: 'pick the route',
        options: (g.red ? RED_MENU : MENU).map((k) => ({ key: k, label: LABEL[k] })),
      };
    },
    pickOption(route) {
      const r = g.wr;
      r.route = route;
      // Inside breaks work back to the middle, outside breaks to the sideline.
      const toCenter = r.sx < VW / 2 ? 1 : -1;
      const outside = route === 'out' || route === 'flat' || route === 'fade';
      r.dir = toCenter * (outside ? -1 : 1);
      const edge = (EDGE[route] || {})[SHELL.key] ?? 0;
      // A real route runner earns separation on top of the concept itself.
      g.edge = Math.max(-0.4, Math.min(0.6, edge + (W.ROUTE - 0.5) * 0.3));
      g.t = 0;
      g.state = 'live';
    },
    /** Ten yards ahead, or the goal line once you are inside it. */
    lineToGain(from) { return Math.max(EZ, from - 10 * YARD); },
    end(kind, gain) {
      g.result = kind; g.gain = Math.round(gain / YARD);
      g.yards += Math.max(0, g.gain);
      g.firstDown = false;
      if (kind === 'td') {
        g.tds++; g.comp++; g.drive++; g.down = 1;
        g.los = WORLD_H - 30; g.marker = this.lineToGain(g.los);
        g.state = 'td'; return;
      }
      if (kind === 'int') { g.state = 'gameover'; return; }
      if (kind === 'complete') { g.comp++; g.los = Math.max(EZ + 12, g.los - gain); }
      if (kind === 'sack') g.los = Math.min(WORLD_H - 12, g.los + 3 * YARD);
      // Moving the chains resets the count. Without this a drive was four
      // plays and out, so stringing completions together still ended in a
      // turnover and the down marker was measuring the whole field.
      if (g.los <= g.marker) {
        g.down = 1;
        g.marker = this.lineToGain(g.los);
        g.firstDown = true;
        g.state = 'result';
        return;
      }
      g.down++;
      g.state = g.down > 4 ? 'gameover' : 'result';
    },
    throwTo() {
      const rec = g.wr, from = g.qb;
      let f = Math.hypot(rec.x - from.x, rec.y - from.y) / A.V;
      for (let i = 0; i < 3; i++) { const p = at(rec, g.t + f); f = Math.hypot(p.x - from.x, p.y - from.y) / A.V; }
      const aim = at(rec, g.t + f);
      // The miss grows with how far the ball has to travel, so a checkdown is
      // nearly automatic and a deep shot is a genuine risk.
      const spread = A.SCATTER * (0.75 + Math.hypot(aim.x - from.x, aim.y - from.y) / 340);
      const ang = g.roll() * Math.PI * 2, mag = g.roll() * spread;
      g.ball = { x: from.x, y: from.y, tx: aim.x + Math.cos(ang) * mag, ty: aim.y + Math.sin(ang) * mag };
      g.att++; g.state = 'ball';
    },
    step() {
      if (g.state === 'yac') { this.runAfterCatch(); return; }
      if (g.state !== 'live' && g.state !== 'ball') return;
      g.t++;
      const r = g.wr;
      const p = at(r, g.t);
      r.x = p.x; r.y = p.y;
      r.frame += 0.2; r.hist.push({ x: r.x, y: r.y });
      if (r.hist.length > 60) r.hist.shift();
      r.db.frame += 0.2;
      // The route's edge on this shell is spent here: a concept that beats the
      // coverage leaves the defender a step further behind all play.
      const lag = Math.round(SHELL.lag * (1 + g.edge * 0.6));
      const tight = SHELL.tight * (1 - g.edge);
      const back = r.hist[Math.max(0, r.hist.length - 1 - lag)] || p;
      r.db.x += (back.x - r.db.x) * tight;
      r.db.y += (back.y - r.db.y) * tight;

      if (g.state === 'live') {
        for (const d of g.rushers) {
          const dx = g.qb.x - d.x, dy = g.qb.y - d.y, dist = Math.hypot(dx, dy) || 1;
          d.x += (dx / dist) * A.RUSH; d.y += (dy / dist) * A.RUSH; d.frame += 0.18;
          if (dist < 13) { this.end('sack', -3 * YARD); return; }
        }
      }
      if (g.state === 'ball') {
        const b = g.ball, dx = b.tx - b.x, dy = b.ty - b.y, dist = Math.hypot(dx, dy);
        if (dist <= A.V) { b.x = b.tx; b.y = b.ty; this.resolve(); }
        else { b.x += (dx / dist) * A.V; b.y += (dy / dist) * A.V; }
      }
    },
    /** Pursuit is a shade quicker than the runner, so the head start he caught
     *  it with is what decides the yards — and a burner can still house it. */
    runAfterCatch() {
      const r = g.wr;
      g.yacFrames++;
      r.y -= 0.92 + 0.56 * W.SPEED;
      r.x += Math.sign(VW / 2 - r.x) * 0.34;      // works back to the grass
      r.x = Math.max(10, Math.min(VW - 10, r.x));
      r.frame += 0.24;
      for (const d of [r.db, g.safety]) {
        const dx = r.x - d.x, dy = r.y - d.y, dist = Math.hypot(dx, dy) || 1;
        d.x += (dx / dist) * 1.54; d.y += (dy / dist) * 1.54; d.frame += 0.22;
        if (dist < 12) { this.end('complete', g.los - r.y); return; }
      }
      if (r.y <= EZ) { this.end('td', g.los - r.y); return; }
      if (g.yacFrames > 150) { this.end('complete', g.los - r.y); return; }
      g.camY = Math.max(0, Math.min(WORLD_H - VH, r.y - VH * 0.58));
    },
    resolve() {
      const b = g.ball, rec = g.wr;
      const recD = Math.hypot(rec.x - b.x, rec.y - b.y);
      const dbD = Math.hypot(rec.db.x - b.x, rec.db.y - b.y);
      const gain = g.los - b.y;
      g.ball = null;
      // Hands widen the catch radius and win the ball in traffic.
      const reach = CATCH_R * (0.86 + 0.30 * W.HANDS);
      if (dbD < reach && dbD < recD) {
        this.end(g.roll() < 0.28 ? 'int' : 'incomplete', 0); return;
      }
      if (recD > reach) { this.end('incomplete', 0); return; }
      const sep = dbD - recD;
      if (sep < 15 && g.roll() < 0.46 * (1 - sep / 15) * (1.3 - 0.6 * W.HANDS)) {
        this.end(g.roll() < 0.12 ? 'int' : 'incomplete', 0); return;
      }
      if (b.y <= EZ) { this.end('td', gain); return; }
      // He caught it clean and keeps running. This is not a phase you steer —
      // an earlier version let you drive the receiver and that made the game
      // trivial. The yards come from the separation the route already earned,
      // so a wide-open catch breaks free and a contested one dies on contact.
      rec.x = b.x; rec.y = b.y;
      g.yacFrames = 0;
      g.safety = { x: VW / 2 + (g.roll() * 34 - 17), y: Math.max(EZ + 8, b.y - 74), frame: 0 };
      g.state = 'yac';
    },
    render() {
      yardLines(g.camY, WORLD_H, DRIVE_YARDS + 10, YARD);
      const ly = Math.round(g.los - g.camY);
      if (ly > -2 && ly < VH + 2) {
        ctx.fillStyle = 'rgba(255,255,255,0.20)';
        for (let x = 0; x < VW; x += 6) ctx.fillRect(x, ly, 3, 1);
      }
      const my = Math.round(g.marker - g.camY);
      if (g.marker > EZ && my > -2 && my < VH + 2) {
        ctx.fillStyle = 'rgba(232,197,97,0.72)';
        ctx.fillRect(0, my, VW, 1);
      }
      const gy = Math.round(EZ - g.camY);
      if (gy > -VH && gy < VH + SPR) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(0, gy, VW, 1);
        ctx.fillStyle = 'rgba(255,255,255,0.030)';
        ctx.fillRect(0, Math.max(0, gy - EZ), VW, Math.min(EZ, gy));
      }
      const r = g.wr;
      // The chosen route traces once it is running; nothing to show before.
      if (r.route) {
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        for (let t = 0; t < 150; t += 3) {
          const p = at(r, t), sy = Math.round(p.y - g.camY);
          if (sy < -2 || sy > VH + 2) continue;
          ctx.fillRect(Math.round(p.x), sy, 1, 1);
        }
      }
      sprite(DEF20[Math.floor(r.db.frame) % 3], Math.round(r.db.x) - HALF, Math.round(r.db.y - g.camY) - HALF);
      if (g.state === 'yac' && g.safety)
        sprite(DEF20[Math.floor(g.safety.frame) % 3], Math.round(g.safety.x) - HALF, Math.round(g.safety.y - g.camY) - HALF);
      if (g.state !== 'yac')
        for (const d of g.rushers) sprite(DEF20[Math.floor(d.frame) % 3], Math.round(d.x) - HALF, Math.round(d.y - g.camY) - HALF);
      // Each of your two players wears his own club's colours.
      setJersey(g.wrTeam);
      sprite(RUN20[Math.floor(r.frame) % 3], Math.round(r.x) - HALF, Math.round(r.y - g.camY) - HALF);
      if (g.state === 'yac') {
        // The ball is his now.
        const ry = Math.round(r.y - g.camY);
        ctx.fillStyle = PAL.D; ctx.fillRect(Math.round(r.x) + 3, ry + 1, 4, 4);
        ctx.fillStyle = PAL.O; ctx.fillRect(Math.round(r.x) + 4, ry + 2, 2, 2);
      }
      setJersey(g.qbTeam);
      if (g.state !== 'yac')
        sprite(RUN20[0], Math.round(g.qb.x) - HALF, Math.round(g.qb.y - g.camY) - HALF);
      if (g.ball) {
        const by = Math.round(g.ball.y - g.camY);
        ctx.fillStyle = PAL.D;
        for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 2]])
          ctx.fillRect(Math.round(g.ball.x) - 1 + dx, by + dy, 3, 2);
        ctx.fillStyle = PAL.O;
        ctx.fillRect(Math.round(g.ball.x) - 1, by, 3, 2);
        ctx.fillRect(Math.round(g.ball.x), by - 1, 1, 4);
      }
    },
    onUp() {
      if (g.state === 'ready' || g.state === 'yac') return;   // both play themselves
      if (g.state === 'result' || g.state === 'td') { this.setup(); return; }
      if (g.state === 'gameover') { this.reset(); g.state = 'select'; return; }
      if (g.state === 'live') this.throwTo();
    },
    score() { return { value: g.yards, detail: `${g.comp}/${g.att}` }; },
    status() {
      const t = g.marker <= EZ ? 'GOAL' : Math.max(1, Math.round((g.los - g.marker) / YARD));
      const pct = g.att ? Math.round((g.comp / g.att) * 100) : 0;
      return `<span>DOWN <b>${g.down}</b></span><span>TO GO <b>${t}</b></span>`
        + `<span><b>${g.comp}/${g.att}</b> ${pct}%</span><span class="sc">${g.tds} TD</span>`;
    },
    overlay() {
      const t = g.marker <= EZ ? 'GOAL' : Math.max(1, Math.round((g.los - g.marker) / YARD));
      if (g.state === 'live' || g.state === 'ball' || g.state === 'ready' || g.state === 'yac') return null;
      if (g.state === 'result') {
        if (g.firstDown) return { ttl: 'First down', gold: true, sub: `${g.gain} yd · ${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
        if (g.result === 'complete') return { ttl: 'Complete', sub: `${g.gain} yd · ${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
        if (g.result === 'sack') return { ttl: 'Sacked', bad: true, sub: `${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
        return { ttl: 'Incomplete', sub: `${ORD[g.down]} & ${t}`, tap: 'tap for next down' };
      }
      if (g.state === 'td') return { ttl: 'Touchdown', gold: true, sub: `${g.gain} yd strike`, tap: 'tap to continue' };
      return { ttl: g.result === 'int' ? 'Intercepted' : 'Turnover on downs', bad: true,
               sub: `${g.comp}/${g.att} · ${g.yards} yards · ${g.tds} TD`, tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };

})();

// ===========================================================================
// GAME 3 — KICK
// ===========================================================================
const KICK_GAME = (() => {
  const PPY = 4;                              // logical px per yard downfield
  const SPR = 20, HALF = 10;
  const SAMPLE = 'B. Aubrey:DAL:0.95:0.86:0.80|H. Butker:KC:0.82:0.90:0.86|'
    + 'J. Tucker:BAL:0.88:0.94:0.72|C. Boswell:PIT:0.74:0.92:0.78';
  const wr = mulberry32(hashSeed(SEED + '|wind'));
  const WIND = Math.round((wr() * 2 - 1) * 10) / 10;          // -1 .. 1
  const WIND_LABEL = Math.abs(WIND) < 0.22 ? 'No wind'
    : `${Math.abs(WIND) > 0.66 ? 'Strong' : 'Light'} wind ${WIND < 0 ? 'left' : 'right'}`;
  const POST_HALF = 13;                        // half the gap between uprights

  let A = {}, g = null;
  return {
    key: 'kick', label: 'Kick', pickTitle: 'Choose your kicker',
    shell: WIND_LABEL, attrLabels: ['Leg', 'Accuracy', 'Nerve'],
    hint: 'tap to set power · tap to set aim',
    controls: [['Tap', 'start the power meter'], ['Tap again', 'lock power — longer kicks need more'],
               ['Third tap', 'lock aim as the marker sweeps'],
               ['Wind', 'read the streamers — aim into it'],
               ['Every make', 'moves you back five yards']],
    roster: parseRoster('kick', SAMPLE),
    reset() {
      g = { dist: 25, made: 0, longest: 0, state: 'select', phase: 'power',
            power: 0, powerDir: 1, aim: 0, aimDir: 1, lockedPower: 0, lockedAim: 0,
            ball: null, result: '' };
      this.g = g;
    },
    choose(p) {
      A = { MAX: 38 + 27 * p.a, AIMSPD: 0.030 - 0.014 * p.b, PWRSPD: 0.026 - 0.010 * p.c };
      this.setup(); g.state = 'ready';
    },
    setup() {
      g.phase = 'power'; g.power = 0; g.powerDir = 1; g.aim = 0; g.aimDir = 1;
      g.ball = null; g.state = 'ready';
    },
    kick() {
      // required power scales with distance against this kicker's max range
      const need = g.dist / A.MAX;
      const short = g.lockedPower < need;
      // aim error plus wind drift over the flight
      const drift = g.lockedAim * 30 + WIND * (g.dist / 60) * 26;
      g.ball = { t: 0, drift, short, need };
      g.state = 'flight';
    },
    step() {
      if (g.state === 'aiming' || g.state === 'charging') {
        if (g.phase === 'power') {
          g.power += g.powerDir * A.PWRSPD;
          if (g.power >= 1) { g.power = 1; g.powerDir = -1; }
          if (g.power <= 0) { g.power = 0; g.powerDir = 1; }
        } else {
          g.aim += g.aimDir * A.AIMSPD;
          if (g.aim >= 1) { g.aim = 1; g.aimDir = -1; }
          if (g.aim <= -1) { g.aim = -1; g.aimDir = 1; }
        }
        return;
      }
      if (g.state !== 'flight') return;
      const b = g.ball;
      b.t += 0.016;
      const reach = b.short ? (g.lockedPower / b.need) : 1;
      if (b.t >= reach || b.t >= 1) {
        if (b.short) { g.result = 'short'; g.state = 'miss'; }
        else if (Math.abs(b.drift) > POST_HALF) { g.result = b.drift < 0 ? 'wide left' : 'wide right'; g.state = 'miss'; }
        else {
          g.made++; g.longest = Math.max(g.longest, g.dist);
          g.dist += 5; g.result = 'good'; g.state = 'good';
        }
      }
    },
    render() {
      ctx.fillStyle = '#08090b'; ctx.fillRect(0, 0, VW, VH);
      const groundY = VH - 34;
      const postY = groundY - g.dist * PPY;
      // yard ticks between the spot and the posts
      for (let y = 5; y < g.dist; y += 5) {
        const sy = Math.round(groundY - y * PPY);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(VW / 2 - 12, sy, 4, 1); ctx.fillRect(VW / 2 + 8, sy, 4, 1);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(2, 0, 1, VH); ctx.fillRect(VW - 3, 0, 1, VH);

      // uprights: crossbar plus two posts
      const cx = VW / 2;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(cx - POST_HALF, Math.round(postY), POST_HALF * 2, 1);
      ctx.fillRect(cx - POST_HALF, Math.round(postY) - 26, 1, 26);
      ctx.fillRect(cx + POST_HALF, Math.round(postY) - 26, 1, 26);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(cx, Math.round(postY), 1, groundY - postY);       // the line of the kick

      // Streamers on the uprights: which way it is blowing and how hard,
      // the way a kicker actually reads it before lining one up.
      const calm = Math.abs(WIND) < 0.22;
      const fdir = WIND < 0 ? -1 : 1;
      const flen = calm ? 2 : Math.round(3 + Math.abs(WIND) * 7);
      const ftop = Math.round(postY) - 26;
      ctx.fillStyle = calm ? 'rgba(255,255,255,0.26)' : PAL.O;
      for (const px of [cx - POST_HALF, cx + POST_HALF]) {
        for (let i = 1; i <= flen; i++) {
          ctx.fillRect(px + fdir * i, ftop + (i > flen * 0.55 ? 1 : 0), 1, 1);
        }
      }

      // kicker
      sprite(RUN20[0], Math.round(cx) - HALF - 8, groundY - HALF);

      if (g.state === 'flight' || g.state === 'good' || g.state === 'miss') {
        const b = g.ball;
        const prog = Math.min(1, b.t / (b.short ? (g.lockedPower / b.need) : 1));
        const y = groundY + (postY - groundY) * prog;
        const x = cx + b.drift * prog;
        const hgt = Math.sin(prog * Math.PI);                         // reads as height
        const r = 1 + Math.round(hgt * 1.6);
        ctx.fillStyle = PAL.O;
        ctx.fillRect(Math.round(x) - r, Math.round(y) - r, r * 2, r * 2);
      } else {
        ctx.fillStyle = PAL.O;
        ctx.fillRect(Math.round(cx) - 1, groundY - 1, 3, 2);
      }

      // meters — hairline, only while they matter
      if (g.state === 'aiming' || g.state === 'charging' || g.state === 'ready') {
        const mx = VW - 14, top = 40, h = VH - 110;
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(mx, top, 1, h); ctx.fillRect(mx - 3, top, 7, 1); ctx.fillRect(mx - 3, top + h, 7, 1);
        const pv = g.phase === 'power' ? g.power : g.lockedPower;
        ctx.fillStyle = g.phase === 'power' ? '#ffffff' : 'rgba(255,255,255,0.42)';
        ctx.fillRect(mx - 4, Math.round(top + h - pv * h), 9, 1);

        const by = VH - 18, bw = 88;
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(cx - bw / 2, by, bw, 1);
        ctx.fillRect(cx, by - 3, 1, 7);
        const av = g.phase === 'aim' ? g.aim : g.lockedAim;
        if (g.phase === 'aim' || g.state !== 'ready') {
          ctx.fillStyle = g.phase === 'aim' ? '#ffffff' : 'rgba(255,255,255,0.42)';
          ctx.fillRect(Math.round(cx + av * (bw / 2)) - 1, by - 4, 3, 9);
        }
      }
    },
    onUp() {
      if (g.state === 'ready') { g.state = 'charging'; g.phase = 'power'; return; }
      if (g.state === 'charging') { g.lockedPower = g.power; g.phase = 'aim'; g.state = 'aiming'; return; }
      if (g.state === 'aiming') { g.lockedAim = g.aim; this.kick(); return; }
      if (g.state === 'good') { this.setup(); return; }
      if (g.state === 'miss') { this.reset(); g.state = 'select'; return; }
    },
    score() { return { value: g.made, detail: g.longest ? `long ${g.longest} yd` : '' }; },
    status() {
      // Wind is worth more than half the gap between the posts on a long
      // attempt, so it has to be readable for the whole session — naming it
      // once on the pick screen just reads as the aim being broken.
      const w = Math.abs(WIND) < 0.22 ? 'CALM'
        : `${WIND < 0 ? '←' : '→'} ${Math.abs(WIND).toFixed(1)}`;
      return `<span>FROM <b>${g.dist}</b> YD</span><span>WIND <b>${w}</b></span>`
        + `<span>MADE <b>${g.made}</b></span>`
        + `<span class="sc">LONG ${g.longest || '—'}</span>`;
    },
    overlay(pick) {
      if (g.state === 'charging' || g.state === 'aiming' || g.state === 'flight') return null;
      if (g.state === 'ready') return { ttl: pick.name, sub: `${pick.team} · ${g.dist} yard attempt`, tap: 'tap to start power', attrs: g.made === 0 };
      if (g.state === 'good') return { ttl: 'Good', gold: true, sub: `${g.dist - 5} yd · back to ${g.dist}`, tap: 'tap for the next one' };
      return { ttl: g.result === 'short' ? 'Short' : g.result === 'wide left' ? 'Wide left' : 'Wide right',
               bad: true, sub: `${g.made} made · long ${g.longest || 0} yd`, tap: 'tap to play again' };
    },
    get state() { return g ? g.state : 'select'; },
  };
})();

// ===========================================================================
// SHELL — tabs, picker, overlay, loop
// ===========================================================================
const ORD = ['', '1ST', '2ND', '3RD', '4TH'];
const GAMES = [RUN_GAME, PASS_GAME, KICK_GAME];
let active = GAMES[0];
let pick = null;

const el = (id) => document.getElementById(id);
const tabs = el('tabs'), picker = el('picker'), plist = el('plist');
const promptEl = el('prompt'), propts = el('propts');
let pick2 = null, pickStage = 0;
const overlay = el('overlay'), ttl = el('ttl'), sub = el('sub'), tapEl = el('tap'), attrs = el('attrs');
const brief = el('brief'), blist = el('blist');
let briefing = false;

brief.addEventListener('pointerup', () => { briefing = false; paintUI(); });

GAMES.forEach((game) => {
  const t = document.createElement('div');
  t.className = 'tab'; t.textContent = game.label;
  t.onclick = () => select(game);
  tabs.appendChild(t);
});

// Standings live in the host page, so this only earns its place when embedded.
if (window.parent !== window) {
  const b = document.createElement('div');
  b.className = 'tab board'; b.textContent = 'Board';
  b.onclick = () => {
    try {
      parent.postMessage({ source: 'arcade', type: 'board', game: active.key }, '*');
    } catch { /* no host */ }
  };
  tabs.appendChild(b);
}

// `name:team:a:b:c:trend` — trend is -1/0/1 for how the rating has moved over
// the last few weeks, so a player on a heater is visible before you pick him.
function parseRoster(param, sample) {
  return (new URLSearchParams(location.search).get(param) || sample).split('|').map((r) => {
    const [name, tm, a, b, c, tr] = r.split(':');
    return {
      name: (name || 'Player').toUpperCase(), team: (tm || '').toUpperCase(),
      a: clamp01(parseFloat(a)), b: clamp01(parseFloat(b)), c: clamp01(parseFloat(c)),
      trend: Math.max(-1, Math.min(1, parseInt(tr, 10) || 0)),
    };
  });
}

function segs(v, n, cls) {
  const on = Math.max(1, Math.round(v * n));
  let s = '';
  for (let i = 0; i < n; i++) s += `<span class="${cls}${i < on ? ' on' : ''}"></span>`;
  return s;
}
function buildPicker() {
  const two = !!(active.roster2 && active.roster2.length);
  const second = pickStage === 1;
  const list = second ? active.roster2 : active.roster;
  el('ptitle').textContent = second ? active.pickTitle2 : active.pickTitle;
  el('pfront').textContent = second && pick
    ? `${pick.name} throwing`
    : `${active.shell} this week`;
  plist.innerHTML = '';
  list.forEach((p) => {
    const d = document.createElement('div');
    d.className = 'pick';
    const kit = jerseyOf(p.team);
    d.innerHTML = `<span><span class="pn">${p.name}</span><span class="pt">`
      + (kit ? `<i class="pchip" style="background:${kit}"></i>` : '')
      + `${p.team}`
      + (p.trend ? `<b class="ptrend ${p.trend > 0 ? 'up' : 'down'}">${p.trend > 0 ? '▲' : '▼'}</b>` : '')
      + `</span></span>`
      + `<span class="pbars"><span class="pbar">${segs(p.a, 8, 'pseg')}</span>`
      + `<span class="pbar">${segs(p.b, 8, 'pseg')}</span>`
      + `<span class="pbar">${segs(p.c, 8, 'pseg')}</span></span>`;
    d.onclick = () => {
      if (!second) {
        pick = p;
        setJersey(p.team);
        active.choose(p);
        // A two-part game asks for the second player before it starts.
        if (two) { pickStage = 1; buildPicker(); paintUI(); return; }
      } else {
        pick2 = p;
        active.choose2(p);
      }
      briefing = true;                        // show how-to-play before the first snap
      el('btitle').textContent = `${active.label} — how to play`;
      blist.innerHTML = active.controls
        .map(([k, v]) => `<div class="brow"><span class="bk">${k}</span><span class="bv">${v}</span></div>`)
        .join('');
      paintUI();
    };
    plist.appendChild(d);
  });
}
function select(game) {
  active = game;
  pick = null;
  pick2 = null;
  pickStage = 0;
  setJersey(null);
  briefing = false;
  active.reset();
  [...tabs.children].forEach((t, i) => t.classList.toggle('on', GAMES[i] === game));
  el('hint').textContent = game.hint;
  buildPicker();
  paintUI();
}

function paintUI() {
  const g = active;
  const inSelect = g.state === 'select';
  picker.classList.toggle('show', inSelect);
  brief.classList.toggle('show', briefing && !inSelect);
  if (briefing && !inSelect) {
    overlay.classList.remove('show'); attrs.classList.remove('show');
    el('status').innerHTML = g.status();
    return;
  }
  const pr = !inSelect && !briefing && g.prompt ? g.prompt() : null;
  if (pr) {
    el('prtitle').textContent = pr.title;
    el('prsub').textContent = pr.sub || '';
    propts.innerHTML = '';
    for (const o of pr.options) {
      const b = document.createElement('div');
      b.className = 'propt'; b.textContent = o.label;
      b.onclick = () => { g.pickOption(o.key); paintUI(); };
      propts.appendChild(b);
    }
  }
  promptEl.classList.toggle('show', !!pr);

  el('status').innerHTML = inSelect ? '' : g.status();
  if (inSelect) { overlay.classList.remove('show'); attrs.classList.remove('show'); return; }

  const o = g.overlay(pick || g.roster[0]);
  ttl.classList.remove('gold', 'bad');
  overlay.classList.toggle('presnap', !!(o && o.presnap));
  if (!o) { overlay.classList.remove('show'); attrs.classList.remove('show'); return; }
  ttl.textContent = o.ttl;
  if (o.gold) ttl.classList.add('gold');
  if (o.bad) ttl.classList.add('bad');
  sub.textContent = o.sub || '';
  tapEl.textContent = o.tap || '';
  if (o.attrs && pick) {
    attrs.innerHTML = g.attrLabels.map((label, i) =>
      `<div class="attr"><span class="k">${label}</span><span class="bar">`
      + segs([pick.a, pick.b, pick.c][i], 10, 'seg') + '</span></div>').join('');
  }
  attrs.classList.toggle('show', !!(o.attrs && pick));
  overlay.classList.add('show');
}

// ---- input ---------------------------------------------------------------
let pStart = null;
function logical(e) {
  const r = canvas.getBoundingClientRect();
  const camY = active.g && active.g.camY ? active.g.camY : 0;
  return { x: ((e.clientX - r.left) / r.width) * VW, y: ((e.clientY - r.top) / r.height) * VH + camY };
}
canvas.addEventListener('pointerdown', (e) => { pStart = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (active.state === 'select') { pStart = null; return; }
  if (briefing) { briefing = false; pStart = null; paintUI(); return; }
  const dx = pStart ? e.clientX - pStart.x : 0;
  const dy = pStart ? e.clientY - pStart.y : 0;
  active.onUp(logical(e), dx, dy);
  pStart = null;
  paintUI();
});
window.addEventListener('keydown', (e) => {
  if (briefing) { briefing = false; paintUI(); return; }
  if (active.state === 'select') {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= active.roster.length) { pick = active.roster[n - 1]; active.choose(pick); paintUI(); }
    return;
  }
  if (e.key === 'ArrowLeft') { active.onUp({ x: 0, y: 0 }, -40, 0); paintUI(); }
  else if (e.key === 'ArrowRight') { active.onUp({ x: 0, y: 0 }, 40, 0); paintUI(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); active.onUp({ x: 0, y: 0 }, 0, -40); paintUI(); }
  else if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); active.onUp({ x: VW / 2, y: 0 }, 0, 0); paintUI(); }
});

/** Terminal states differ per game: the kick run ends on the first miss. */
const isOver = (g) => g.state === 'gameover' || (g.key === 'kick' && g.state === 'miss');

let reported = '';
function reportScore() {
  if (!active.score || !active.g) return;
  const r = active.score();
  // Guard against the same finish being posted twice by a repaint.
  const stamp = `${active.key}:${r.value}:${r.detail}`;
  if (stamp === reported) return;
  reported = stamp;
  try {
    parent.postMessage({
      source: 'arcade', type: 'score', game: active.key,
      value: r.value, detail: r.detail,
      player: pick ? pick.name : '', team: pick ? pick.team : '', seed: SEED,
    }, '*');
  } catch { /* standalone, not embedded */ }
}

// ---- loop ----------------------------------------------------------------
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  const before = active.state;
  while (acc >= 1000 / 60) { if (active.state !== 'select') active.step(); acc -= 1000 / 60; }
  if (before !== active.state) {
    paintUI();
    if (isOver(active)) reportScore();
  }
  if (active.state !== 'select' && active.g) active.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

el('build').textContent = `build ${BUILD}`;
select(GAMES[0]);
window.__active = () => active;
</script>
</body>
</html>
