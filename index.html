<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0f" />

    <title>Sprites</title>
    <meta name="description" content="Your fantasy roster, as an arcade football game. Ten drives a week, one run that counts, played by the real players on your Sleeper team." />

    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews. Most scrapers want an absolute og:image, so these need
         the deployment's origin prefixed once there is one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sprites" />
    <meta property="og:title" content="Sprites" />
    <meta property="og:description" content="Your fantasy roster, as an arcade football game. Ten drives a week, one run that counts." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pixel-art football player beside the word SPRITES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sprites" />
    <meta name="twitter:description" content="Your fantasy roster, as an arcade football game. Ten drives a week, one run that counts." />
    <meta name="twitter:image" content="/og.png" />

    <!-- On a home screen it should look like the app, not a browser tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sprites" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
